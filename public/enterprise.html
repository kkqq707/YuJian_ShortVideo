        /**
         * 数字人生成任务创建与轮询
         *
         * Phase 2-C-2-4-B-2-B-3: 从 alert 占位改为真实任务创建
         *
         * 流程：
         *   1. 读取 YJ.state.getDigitalHumanState()
         *   2. 同步 DOM 表单值到 state
         *   3. 组装任务参数 → 调用 GenerationAPI.createDigitalHumanTask()
         *   4. 复用 YuJianVideoTask.pollTaskStatus() 轮询机制
         */
        async function handleDigitalHumanGenerate() {
            var YJ = window.YJ || {};
            var dh = (YJ.state && YJ.state.getDigitalHumanState) ? YJ.state.getDigitalHumanState() : {};
            var btn = document.getElementById('dhGenerateBtn');
            var originalHTML = btn ? btn.innerHTML : '';

            // ── 读取 DOM 表单最新值 ──
            var scriptEl = document.getElementById('dhScript');
            var voiceEl = document.getElementById('dhVoice');
            var speedEl = document.getElementById('dhSpeed');
            var resolutionEl = document.getElementById('dhResolution');
            var aspectRatioEl = document.getElementById('dhAspectRatio');

            var script = scriptEl ? scriptEl.value.trim() : (dh.script || '');
            var voice = voiceEl ? voiceEl.value : dh.voice;
            var speed = speedEl ? parseFloat(speedEl.value) : (dh.speed || 1.0);
            var resolution = resolutionEl ? resolutionEl.value : dh.resolution;
            var aspectRatio = aspectRatioEl ? aspectRatioEl.value : dh.aspectRatio;

            // ── 校验必填项 ──
            if (!script) {
                if (typeof showToast === 'function') showToast('请输入口播文案', 'warning');
                return;
            }

            // ── 同步表单值到 state ──
            if (YJ.state && YJ.state.setDigitalHumanState) {
                YJ.state.setDigitalHumanState({
                    script: script,
                    voice: voice,
                    speed: speed,
                    resolution: resolution,
                    aspectRatio: aspectRatio
                });
            }

            // ── 组装任务参数 ──
            var taskInput = {
                templateId: dh.templateId || 'digital_human',
                modelId: dh.modelId || null,
                imageUrl: dh.imageUrl || null,
                avatarId: dh.avatarId || null,
                script: script,
                voice: voice,
                speed: speed,
                resolution: resolution,
                aspectRatio: aspectRatio
            };

            // ── 设置生成中状态 ──
            if (YJ.state && YJ.state.setDigitalHumanState) {
                YJ.state.setDigitalHumanState({ isGenerating: true });
            }

            // ── 更新按钮 UI ──
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
            }

            try {
                // ── 调用任务创建接口 ──
                var task;
                if (window.EnterpriseAPI && window.EnterpriseAPI.Generation && window.EnterpriseAPI.Generation.createDigitalHumanTask) {
                    task = await window.EnterpriseAPI.Generation.createDigitalHumanTask(taskInput);
                } else {
                    throw new Error('createDigitalHumanTask API 不可用');
                }

                var taskId = task.id || task.task_id;
                console.log('[DigitalHuman] 任务创建成功, taskId:', taskId);

                // ── 保存 currentTaskId ──
                if (YJ.state && YJ.state.setDigitalHumanState) {
                    YJ.state.setDigitalHumanState({ currentTaskId: taskId });
                }

                // ── 复用已有轮询机制 ──
                if (typeof YuJianVideoTask !== 'undefined' && YuJianVideoTask.pollTaskStatus) {
                    YuJianVideoTask.pollTaskStatus(taskId, {
                        onUpdate: function (t) {
                            console.log('[DigitalHuman] 任务进度更新:', t.status, t.progress);
                        },
                        onSuccess: function (t) {
                            console.log('[DigitalHuman] 任务完成:', t);
                            if (YJ.state && YJ.state.setDigitalHumanState) {
                                YJ.state.setDigitalHumanState({ isGenerating: false });
                            }
                            if (btn) {
                                btn.disabled = false;
                                btn.innerHTML = '<i class="fas fa-check"></i> 生成完成';
                            }
                            if (typeof showToast === 'function') {
                                showToast('数字人视频生成成功！', 'success');
                            }
                            // 恢复按钮文案
                            setTimeout(function () {
                                if (btn) btn.innerHTML = originalHTML;
                            }, 2000);
                        },
                        onFailed: function (t) {
                            console.error('[DigitalHuman] 任务失败:', t);
                            if (YJ.state && YJ.state.setDigitalHumanState) {
                                YJ.state.setDigitalHumanState({ isGenerating: false });
                            }
                            if (btn) {
                                btn.disabled = false;
                                btn.innerHTML = '<i class="fas fa-redo"></i> 重新生成';
                            }
                            if (typeof showToast === 'function') {
                                showToast(t.error_msg || '数字人视频生成失败，请重试', 'error');
                            }
                        },
                        onTimeout: function () {
                            console.warn('[DigitalHuman] 轮询超时');
                            if (YJ.state && YJ.state.setDigitalHumanState) {
                                YJ.state.setDigitalHumanState({ isGenerating: false });
                            }
                            if (btn) {
                                btn.disabled = false;
                                btn.innerHTML = originalHTML;
                            }
                            if (typeof showToast === 'function') {
                                showToast('任务状态确认超时，可稍后在任务记录中查看', 'warning');
                            }
                        },
                        onError: function (err) {
                            console.error('[DigitalHuman] 轮询出错:', err);
                        }
                    });
                }

            } catch (err) {
                console.error('[DigitalHuman] 任务创建失败:', err);

                // ── 恢复状态 ──
                if (YJ.state && YJ.state.setDigitalHumanState) {
                    YJ.state.setDigitalHumanState({ isGenerating: false, currentTaskId: null });
                }
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-redo"></i> 重试';
                }
                if (typeof showToast === 'function') {
                    if (err.name === 'AbortError' || (err.code && err.code === 'ABORTED')) {
                        showToast('操作已取消', 'info');
                    } else {
                        showToast(err.message || '任务创建失败，请重试', 'error');
                    }
                }
            }
        }

            'image2video': '图片动态化',
            'text2video': '宣传视频生成',
            'text2image': '商业图片生成',
            'image_generation': '商业图片生成',
            'image_edit': '图片智能编辑',
            'ref2video': '图片动态化',
            'digital_human': '数字人口播',
            'video_extend': '视频扩展',
            'video_style_transfer': '视频风格转换'
        };

        var WORKS_STATUS_MAP = {
            'success': '生成完成',
            'processing': '正在生成',
            'pending': '等待生成',
            'failed': '生成失败'
        };

        // ─── 页面状态 ──────────────────────────────────────
        var WORKS_STATE = {
            currentPage: 1,
            total: 0,
            pageSize: 12,
            items: [],
            isLoading: false
        };

        // ─── 格式化函数 ────────────────────────────────────
        function formatTaskType(taskType) {
            return TASKTYPE_MAP[taskType] || 'AI视频';
        }

        function formatWorkStatus(status) {
            return WORKS_STATUS_MAP[status] || status;
        }

        function formatWorkDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var h = String(d.getHours()).padStart(2, '0');
            var min = String(d.getMinutes()).padStart(2, '0');
            return y + '-' + m + '-' + day + ' ' + h + ':' + min;
        }

        function formatDuration(seconds) {
            if (!seconds && seconds !== 0) return '';
            if (seconds < 60) return seconds + 's';
            var m = Math.floor(seconds / 60);
            var s = seconds % 60;
            return m + 'm' + (s > 0 ? s + 's' : '');
        }

        // ─── 渲染页面骨架 ──────────────────────────────────
        function renderMyWorks() {
            return '<div class="page-header">' +
                '<h3 style="font-size:18px;font-weight:700"><i class="fas fa-film" style="margin-right:8px;color:var(--primary-light)"></i>我的作品</h3>' +
                '<p style="font-size:13px;color:var(--text-sub);margin-top:4px">查看和管理您的AI生成作品</p>' +
                '</div>' +
                '<div id="worksContent" class="loading-skeleton">' +
                '<i class="fas fa-spinner fa-pulse"></i> 加载中...' +
                '</div>' +
                '<div id="worksPagination"></div>';
        }

        // ─── 加载作品列表 ──────────────────────────────────
        async function loadMyWorks(page) {
            if (WORKS_STATE.isLoading) return;
            WORKS_STATE.isLoading = true;
            WORKS_STATE.currentPage = page;

            var contentEl = document.getElementById('worksContent');
            var paginationEl = document.getElementById('worksPagination');

            if (!contentEl) return;

            contentEl.innerHTML = '<div class="loading-skeleton"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>';
            if (paginationEl) paginationEl.innerHTML = '';

            try {
                var data = await YuJianAPI.get('/enterprise/video-generation/tasks?page=' + page + '&pageSize=' + WORKS_STATE.pageSize);
                // API returns { total, page, pageSize, items: [...] }
                WORKS_STATE.total = data.total || 0;
                WORKS_STATE.items = data.items || [];
                WORKS_STATE.pageSize = data.pageSize || 12;

                if (!WORKS_STATE.items.length) {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-film"></i>' +
                        '<p>暂无作品</p>' +
                        '<p class="sub-text">使用AI生成功能创建您的第一个视频作品</p>' +
                        '</div>';
                } else {
                    contentEl.innerHTML = '<div class="works-grid">' +
                        WORKS_STATE.items.map(renderWorkCard).join('') +
                        '</div>';
                }

                renderPagination(paginationEl);

            } catch (err) {
                console.error('[MyWorks] 加载作品列表失败:', err);
                if (err.status === 401) {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-lock"></i>' +
                        '<p>登录已过期</p>' +
                        '<p class="sub-text">请刷新页面重新登录</p>' +
                        '</div>';
                } else {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-exclamation-circle"></i>' +
                        '<p>加载失败，请稍后重试</p>' +
                        '<p class="sub-text"><button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + page + ')" style="margin-top:12px">重新加载</button></p>' +
                        '</div>';
                }
            } finally {
                WORKS_STATE.isLoading = false;
            }

            // ── 自动刷新：如果当前列表中还有未完成任务，定时刷新 ──
            scheduleMyWorksRefresh();
        }

        // ─── 作品列表自动刷新（有活跃任务时）──────────────────
        var worksRefreshTimer = null;

        function scheduleMyWorksRefresh() {
            // 清除之前的定时器
            if (worksRefreshTimer) {
                clearTimeout(worksRefreshTimer);
                worksRefreshTimer = null;
            }

            // 检查是否有未完成任务需要持续刷新
            var hasActive = WORKS_STATE.items.some(function (item) {
                return item.status === 'pending' || item.status === 'processing';
            });

            if (hasActive && APP.currentPage === 'myworks') {
                worksRefreshTimer = setTimeout(function () {
                    if (APP.currentPage === 'myworks' && !WORKS_STATE.isLoading) {
                        loadMyWorks(WORKS_STATE.currentPage || 1);
                    }
                }, 3000); // 每 3 秒刷新一次
            }
        }

        function refreshMyWorksIfActive() {
            // 只在 myworks 页面且不在加载中时刷新
            if (APP.currentPage !== 'myworks') return;
            if (WORKS_STATE.isLoading) return;
            if (typeof loadMyWorks === 'function') {
                loadMyWorks(WORKS_STATE.currentPage || 1);
            }
        }

        // ─── 渲染单个作品卡片 ──────────────────────────────
        function renderWorkCard(item) {
            // Phase UI-AICreation-02-B-1-G-P: 识别图片作品，防止按视频渲染
            var isImageTask = item.taskType === 'text2image' || item.taskType === 'image_generation'
                || (item.outputAsset && item.outputAsset.type === 'image')
                || (item.mediaType === 'image');
            var typeLabel = formatTaskType(item.taskType);
            var statusLabel = formatWorkStatus(item.status);
            var dateStr = formatWorkDate(item.createdAt);
            var promptText = item.prompt || '';
            var escapedPrompt = escapeHtml(promptText);
            var durationStr = isImageTask ? '' : formatDuration(item.duration);
            // Sprint 5.6: 优先使用签名 playUrl，私有Bucket播放需要签名URL
            // 图片任务不应有 videoUrl/playUrl，但防御性检查 outputAsset.type
            var videoPlayUrl = isImageTask ? '' : (item.playUrl || item.videoUrl || '');
            var hasVideo = !isImageTask && videoPlayUrl && item.status === 'success';
            var hasImage = isImageTask && item.status === 'success';
            var thumbUrl = resolveThumbnailUrl(item) || '';

            var thumbHtml = thumbUrl
                ? '<img src="' + escapeHtml(thumbUrl) + '" alt="缩略图" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-image no-thumb\\\'></i>\'">'
                : '<i class="fas fa-image no-thumb"></i>';

            var playOverlayHtml = hasVideo
                ? '<div class="play-overlay"><i class="fas fa-play-circle"></i></div>'
                : (hasImage
                    ? '<div class="play-overlay"><i class="fas fa-search-plus"></i></div>'
                    : '');

            var actionsHtml = '';
            if (hasVideo) {
                // Sprint 5.8: 延迟解析播放URL，点击时才调用 getPlayUrl
                actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();playWorkVideo(\'' +
                    item.id + '\', \'' + escapeJsString(promptText || 'AI视频') + '\')" title="播放">' +
                    '<i class="fas fa-play"></i></button>';
            }
            if (hasImage) {
                // 图片作品：查看原图按钮
                actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();previewWorkImage(\'' +
                    item.id + '\', \'' + escapeJsString(promptText || 'AI图片') + '\')" title="查看原图">' +
                    '<i class="fas fa-search-plus"></i></button>';
            }
            actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();showWorkDetail(\'' +
                item.id + '\')" title="详情"><i class="fas fa-info-circle"></i></button>';
            actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();deleteWork(\'' +
                item.id + '\', \'' + escapeJsString(promptText || 'AI视频') + '\')" title="删除" style="color:var(--danger)">' +
                '<i class="fas fa-trash"></i></button>';

            var thumbClickAttr = '';
            if (hasVideo) {
                thumbClickAttr = ' onclick="playWorkVideo(\'' + item.id + '\', \'' + escapeJsString(promptText || 'AI视频') + '\')"';
            } else if (hasImage) {
                thumbClickAttr = ' onclick="previewWorkImage(\'' + item.id + '\', \'' + escapeJsString(promptText || 'AI图片') + '\')"';
            }

            var isProcessing = item.status === 'processing' || item.status === 'pending';
            var isFailed = item.status === 'failed';
            var progressPct = item.progress || 0;

            // 进度条 HTML（processing/pending 状态）
            var progressHtml = '';
            if (isProcessing) {
                var progressLabel = item.status === 'pending' ? '排队中' : (isImageTask ? '正在生成图片' : '正在生成视频');
                progressHtml = '<div class="work-progress">' +
                    '<div class="work-progress-bar">' +
                    '<div class="work-progress-fill" style="width:' + progressPct + '%"></div>' +
                    '</div>' +
                    '<span class="work-progress-text">' + progressLabel + ' ' + progressPct + '%</span>' +
                    '</div>';
            }

            // 错误信息 HTML（failed 状态）
            var errorHtml = '';
            if (isFailed && item.errorMsg) {
                errorHtml = '<div class="work-error">' +
                    '<i class="fas fa-exclamation-circle"></i>' +
                    '<span>错误原因：' + escapeHtml(item.errorMsg) + '</span>' +
                    '</div>';
            }

            return '<div class="work-card">' +
                '<div class="work-thumb"' + thumbClickAttr + '>' +
                thumbHtml +
                playOverlayHtml +
                '</div>' +
                '<div class="work-info">' +
                (escapedPrompt ? '<div class="prompt-text" title="' + escapedPrompt + '">' + escapedPrompt + '</div>' : '') +
                '<div class="work-badges">' +
                '<span class="work-type-badge">' + escapeHtml(typeLabel) + '</span>' +
                '<span class="work-status-badge status-' + (item.status || '') + '">' + escapeHtml(statusLabel) + '</span>' +
                '</div>' +
                progressHtml +
                errorHtml +
                '<div class="work-meta-row">' +
                '<span>' + (durationStr ? '<i class="far fa-clock" style="margin-right:3px"></i>' + durationStr + ' · ' : '') + dateStr + '</span>' +
                '</div>' +
                '<div class="work-actions">' + actionsHtml + '</div>' +
                '</div>' +
                '</div>';
        }

        // ─── 渲染分页 ──────────────────────────────────────
        function renderPagination(container) {
            if (!container) return;
            var total = WORKS_STATE.total;
            var page = WORKS_STATE.currentPage;
            var pageSize = WORKS_STATE.pageSize;
            var totalPages = Math.ceil(total / pageSize);

            if (total <= pageSize) {
                container.innerHTML = total > 0
                    ? '<div class="pagination-bar"><span class="page-info">共 ' + total + ' 个作品</span></div>'
                    : '';
                return;
            }

            var prevBtn = page > 1
                ? '<button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + (page - 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})"><i class="fas fa-chevron-left"></i> 上一页</button>'
                : '<button class="btn btn-outline btn-sm" disabled><i class="fas fa-chevron-left"></i> 上一页</button>';

            var nextBtn = page < totalPages
                ? '<button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + (page + 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})">下一页 <i class="fas fa-chevron-right"></i></button>'
                : '<button class="btn btn-outline btn-sm" disabled>下一页 <i class="fas fa-chevron-right"></i></button>';

            container.innerHTML = '<div class="pagination-bar">' +
                prevBtn +
                '<span class="page-info">第 ' + page + ' / ' + totalPages + ' 页，共 ' + total + ' 个作品</span>' +
                nextBtn +
                '</div>';
        }

        async function deleteWork(taskId, title) {
            var displayTitle = decodeURIComponent(title || '该作品');
            if (!confirm('确定要删除「' + displayTitle + '」吗？\n\n作品将从列表隐藏。')) {
                return;

            try {
                await YuJianAPI.request('/enterprise/video-generation/tasks/' + taskId, { method: 'DELETE' });

                loadMyWorks(WORKS_STATE.currentPage);
            } catch (err) {
                console.error('[MyWorks] 删除失败:', err);
                if (err.status === 401) {
                    showToast('登录已过期，请刷新页面重新登录', 'error');
                } else if (err.status === 404) {
                    showToast('作品不存在或已删除', 'warning');

                } else {
                    showToast('删除失败，请稍后重试', 'error');

        // ─── 视频播放器 ────────────────────────────────────
        function playVideo(videoUrl, title) {
            var decodedTitle = decodeURIComponent(title || '视频播放');

            // 移除已有播放器
            var existing = document.getElementById('videoPlayerOverlay');
            if (existing) existing.parentNode.removeChild(existing);

            var overlay = document.createElement('div');
            overlay.id = 'videoPlayerOverlay';
            overlay.className = 'video-player-overlay';
            overlay.innerHTML =
                '<div class="video-player-container" onclick="event.stopPropagation()">' +
                '<div class="video-player-header">' +
                '<h4 title="' + escapeHtml(decodedTitle) + '">' + escapeHtml(decodedTitle.length > 30 ? decodedTitle.substring(0, 30) + '...' : decodedTitle) + '</h4>' +
                '<button class="video-player-close" onclick="closeVideoPlayer()" title="关闭">' +
                '<i class="fas fa-times"></i></button>' +
                '</div>' +
                '<video id="workVideoPlayer" controls autoplay playsinline>' +
                '<source src="' + escapeHtml(videoUrl) + '" type="video/mp4">' +
                '您的浏览器不支持视频播放</video>' +
                '<div class="video-player-controls">' +
                '<button onclick="var v=document.getElementById(\'workVideoPlayer\');if(v)v.requestFullscreen()">' +
                '<i class="fas fa-expand"></i> 全屏</button>' +
                '<button onclick="closeVideoPlayer()"><i class="fas fa-times"></i> 关闭</button>' +
                '</div>' +
                '</div>';

            // 点击背景关闭
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeVideoPlayer();
            });

            document.body.appendChild(overlay);

            // ESC 关闭
            var escHandler = function (e) {
                if (e.key === 'Escape') {
                    closeVideoPlayer();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);

            // 开始播放
            setTimeout(function () {
                var video = document.getElementById('workVideoPlayer');
                if (video) {
                    video.play().catch(function () {
                        // autoplay blocked, controls are shown
                    });
                }
            }, 100);
        }

        function closeVideoPlayer() {
            var overlay = document.getElementById('videoPlayerOverlay');
            if (overlay) {
                var video = document.getElementById('workVideoPlayer');
                if (video) {
                    video.pause();
                    video.src = '';
                }
                overlay.parentNode.removeChild(overlay);
            }
        }

        // ─── Sprint 5.8: 延迟解析视频播放URL ──────────────────
        /**
         * 通过任务ID获取签名播放URL后播放视频
         * 替代直接使用 task.playUrl（可能已过期）的模式
         *
         * @param {string|number} taskId - 生成任务ID
         * @param {string} title - 视频标题
         */
        async function playWorkVideo(taskId, title) {
            var decodedTitle = decodeURIComponent(title || '视频播放');
            try {
                // KL-B: 获取任务详情以拿到 outputAsset.id，然后委托给统一播放核心
                var task = await YuJianAPI.get('/enterprise/video-generation/tasks/' + taskId);
                var outputAsset = task.outputAsset;

                if (outputAsset && outputAsset.id) {
                    // 委托给素材库播放核心（含缓存查找 + getPlayUrl 签名 + playVideo）
                    await playAssetVideo(outputAsset.id);
                    return;
                }

                // 降级：无 outputAsset 时使用任务的播放 URL
                var fallbackUrl = task.playUrl || task.videoUrl || task.output_url || '';
                if (fallbackUrl) {
                    playVideo(fallbackUrl, decodedTitle);
                } else {
                    showToast('视频资源不可用', 'error');
                }
            } catch (err) {
                console.error('[playWorkVideo] 获取播放URL失败:', err);
                showToast('获取播放链接失败，请稍后重试', 'error');
            }
        }

        // Sprint Stable: 页面状态持久化 — 恢复上次访问的页面，而非总是返回首页
        var restoredPage = (typeof PageState !== 'undefined' && PageState.restore) ? PageState.restore() : 'dashboard';
        // 🔧 Phase Fix: 仅标记初始页面，暂不渲染。

        APP._initialPage = restoredPage;
        // 导航事件由 HTML onclick 属性处理，不再重复绑定 addEventListener

        // ===================================================

        // ─── 全局状态 ──────────────────────────────────────

            selectedFile: null,      // 当前选中的 File
            previewUrl: null,        // 本地预览 ObjectURL
            uploadedImageUrl: null,  // OSS 上传后的 URL
            assetId: null,           // Asset 记录 ID
            currentTaskId: null,     // 当前任务本地 ID
            currentAbortController: null,
            isUploading: false,
            isGenerating: false,
            // Sprint 3.2: 页面状态机
            // idle → creating → processing → success/failed
            pageState: 'idle',       // idle | creating | processing | success | failed
            // Sprint 4.2: 资产选择模式
            selectedAsset: null,     // 从AssetPicker选择的资产 { id, name, url, thumbnailUrl, type }

        };

        // ═══════════════════════════════════════════════════════════
        //  AssetPicker — 资产选择器（Sprint 4.2）
        // ═══════════════════════════════════════════════════════════
        const ASSET_PICKER = {
            assets: [],              // 当前加载的资产列表
            selectedAsset: null,     // 当前选中的资产
            currentPage: 1,

        /**
         * 打开 AssetPicker
         * @param {object} options — { type?: string, callback?: Function }
         */
        function openAssetPicker(options) {
            options = options || {};
            ASSET_PICKER.callback = options.callback || null;
            ASSET_PICKER.selectedAsset = null;
            ASSET_PICKER.currentPage = 1;
            ASSET_PICKER.currentType = options.type || 'image';

            // 重置筛选按钮
            var filters = document.querySelectorAll('.asset-picker-filter');
            filters.forEach(function (f) {
                var ft = f.getAttribute('data-type');
                f.classList.toggle('active', ft === ASSET_PICKER.currentType);

        /**
         * 关闭 AssetPicker
         */
        function closeAssetPicker() {
            var overlay = document.getElementById('assetPickerOverlay');
            if (overlay) overlay.classList.remove('show');
            ASSET_PICKER.callback = null;
        }

        // 点击遮罩关闭
        (function bindAssetPickerOverlayClick() {
            document.addEventListener('click', function (e) {
                if (e.target && e.target.id === 'assetPickerOverlay') {
                    closeAssetPicker();
                }
            });
        })();

        /**
         * 筛选资产类型
         */
        function filterAssetPicker(btn, type) {
            // 更新激活态
            var filters = document.querySelectorAll('.asset-picker-filter');
            filters.forEach(function (f) { f.classList.remove('active'); });
            if (btn) btn.classList.add('active');

            ASSET_PICKER.currentType = type;
            ASSET_PICKER.currentPage = 1;
            ASSET_PICKER.selectedAsset = null;
            updateAssetPickerSelection();
            loadAssetPickerAssets();
        }

        /**
         * 加载资产列表
         */
        async function loadAssetPickerAssets() {
            var body = document.getElementById('assetPickerBody');
            if (!body) return;

            body.innerHTML = '<div class="asset-picker-loading"><div class="spinner"></div><div>加载中...</div></div>';

            try {
                var params = '?page=' + ASSET_PICKER.currentPage + '&pageSize=' + ASSET_PICKER.pageSize;
                if (ASSET_PICKER.currentType) {
                    params += '&type=' + encodeURIComponent(ASSET_PICKER.currentType);
                }

                var result = await YuJianAPI.get('/enterprise/assets' + params);
                // result = { items, total, page, pageSize }

                ASSET_PICKER.assets = result.items || [];
                ASSET_PICKER.total = result.total || 0;

                if (ASSET_PICKER.assets.length === 0) {
                    body.innerHTML = '<div class="asset-picker-empty"><i class="fas fa-inbox"></i><div>暂无素材</div><div style="font-size:12px;margin-top:4px">请先在资产中心上传素材</div></div>';
                } else {
                    renderAssetPickerItems();
                }

                renderAssetPickerPagination();
            } catch (err) {
                console.error('[AssetPicker] 加载资产失败:', err);
                body.innerHTML = '<div class="asset-picker-empty"><i class="fas fa-exclamation-circle"></i><div>加载失败</div><div style="font-size:12px;margin-top:4px">' + (err.message || '请重试') + '</div></div>';
            }
        }

        /**
         * 渲染资产列表项
         */
        function renderAssetPickerItems() {
            var body = document.getElementById('assetPickerBody');
            if (!body) return;

            var html = '';
            ASSET_PICKER.assets.forEach(function (asset) {
                var isSelected = ASSET_PICKER.selectedAsset && ASSET_PICKER.selectedAsset.id === asset.id;
                var thumbUrl = asset.thumbnailUrl || asset.url || '';
                var typeIcon = asset.type === 'video' ? '<i class="fas fa-video" style="position:absolute;bottom:4px;right:4px;font-size:10px;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;color:#fff"></i>' : '';

                html += '<div class="asset-picker-item' + (isSelected ? ' selected' : '') + '" onclick="selectAssetPickerItem(' + asset.id + ')" data-asset-id="' + asset.id + '">';
                html += '<div class="asset-picker-item-thumb" style="position:relative">';
                if (thumbUrl) {
                    html += '<img src="' + escapeHtml(thumbUrl) + '" alt="' + escapeHtml(asset.name || '') + '" loading="lazy">';
                } else {
                    html += '<div class="no-thumb"><i class="fas fa-' + (asset.type === 'video' ? 'video' : 'image') + '"></i></div>';
                }
                html += typeIcon;
                html += '</div>';
                html += '<div class="asset-picker-item-info">';
                html += '<div class="asset-picker-item-name" title="' + escapeHtml(asset.name || '未命名') + '">' + escapeHtml(asset.name || '未命名') + '</div>';
                html += '</div>';
                html += '</div>';
            });

            body.innerHTML = html;
        }

        /**
         * 选择资产
         */
        function selectAssetPickerItem(assetId) {
            var asset = ASSET_PICKER.assets.find(function (a) { return a.id === assetId; });
            if (!asset) return;

            ASSET_PICKER.selectedAsset = asset;

            // 更新选中态
            var items = document.querySelectorAll('.asset-picker-item');
            items.forEach(function (item) {
                var id = parseInt(item.getAttribute('data-asset-id'));
                item.classList.toggle('selected', id === assetId);
            });

            updateAssetPickerSelection();
        }

        /**
         * 更新选中提示
         */
        function updateAssetPickerSelection() {
            var info = document.getElementById('assetPickerSelectedInfo');
            var btn = document.getElementById('assetPickerConfirmBtn');

            if (ASSET_PICKER.selectedAsset) {
                if (info) info.innerHTML = '已选择：<span class="asset-picker-selected-name">' + escapeHtml(ASSET_PICKER.selectedAsset.name || '未命名') + '</span>';
                if (btn) btn.disabled = false;
            } else {
                if (info) info.textContent = '未选择素材';
                if (btn) btn.disabled = true;
            }
        }

        /**
         * 渲染分页
         */
        function renderAssetPickerPagination() {
            var container = document.getElementById('assetPickerPagination');
            if (!container) return;

            var totalPages = Math.ceil(ASSET_PICKER.total / ASSET_PICKER.pageSize);
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            var html = '';
            html += '<button class="btn btn-sm btn-outline" onclick="goAssetPickerPage(' + (ASSET_PICKER.currentPage - 1) + ')"' + (ASSET_PICKER.currentPage <= 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i></button>';
            html += '<span>' + ASSET_PICKER.currentPage + ' / ' + totalPages + '</span>';
            html += '<button class="btn btn-sm btn-outline" onclick="goAssetPickerPage(' + (ASSET_PICKER.currentPage + 1) + ')"' + (ASSET_PICKER.currentPage >= totalPages ? ' disabled' : '') + '><i class="fas fa-chevron-right"></i></button>';
            container.innerHTML = html;
        }

        /**
         * 翻页
         */
        function goAssetPickerPage(page) {
            var totalPages = Math.ceil(ASSET_PICKER.total / ASSET_PICKER.pageSize);
            if (page < 1 || page > totalPages) return;
            ASSET_PICKER.currentPage = page;
            ASSET_PICKER.selectedAsset = null;
            updateAssetPickerSelection();
            loadAssetPickerAssets();
        }

        /**
         * 确认选择
         */
        function confirmAssetPicker() {
            if (!ASSET_PICKER.selectedAsset) {
                showToast('请先选择一个素材', 'warning');
                return;
            }

            var asset = ASSET_PICKER.selectedAsset;

            // 设置 I2V 状态为资产模式
            clearImageSelection(); // 清理上传模式的状态

            I2V_STATE.sourceMode = 'asset';
            I2V_STATE.selectedAsset = asset;
            I2V_STATE.assetId = asset.id;
            I2V_STATE.selectedFile = null;
            I2V_STATE.uploadedImageUrl = asset.url; // 直接使用资产URL

            // 更新 UI
            showAssetPreview(asset);

            // 触发回调（必须在 closeAssetPicker 之前，因为 closeAssetPicker 会清除 callback）
            if (typeof ASSET_PICKER.callback === 'function') {
                ASSET_PICKER.callback(asset);
            }

            // 关闭弹层
            closeAssetPicker();

            showToast('已选择素材：' + (asset.name || '未命名'), 'success');
        }

        /**
         * 显示资产预览（替代上传预览）
         */
        function showAssetPreview(asset) {
            var thumbUrl = asset.thumbnailUrl || asset.url || '';

            // 隐藏上传区域，显示预览
            var container = document.getElementById('i2vPreviewContainer');
            var img = document.getElementById('i2vPreviewImage');
            var info = document.getElementById('i2vFileInfo');
            var uploadArea = document.getElementById('i2vUploadArea');

            if (container) container.style.display = 'block';
            if (img) img.src = thumbUrl;
            if (info) {
                var sizeStr = asset.size ? (asset.size / (1024 * 1024)).toFixed(2) + 'MB' : '';
                var dimStr = (asset.width && asset.height) ? (asset.width + '×' + asset.height) : '';
                info.textContent = (asset.name || '资产素材') + (sizeStr ? ' | ' + sizeStr : '') + (dimStr ? ' | ' + dimStr : '');
            }
            if (uploadArea) {
                uploadArea.classList.add('filled');
            }

            // 大图预览
            var largePreview = document.getElementById('i2vLargePreview');
            var placeholder = document.getElementById('i2vPreviewPlaceholder');
            if (largePreview) { largePreview.src = thumbUrl; largePreview.style.display = 'block'; }
            if (placeholder) placeholder.style.display = 'none';

            // 更新资产选择按钮样式
            var assetBtn = document.getElementById('refSourceAssetBtn');
            if (assetBtn) {
                assetBtn.classList.add('asset-selected');
                assetBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>' + (asset.name || '已选择').substring(0, 8) + '</span>';
            }

            // 清理结果区
            resetResultArea();
        }
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var icons = { error: 'fa-times-circle', success: 'fa-check-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + escapeHtml(message);
            container.appendChild(toast);
            setTimeout(function () {
                toast.classList.add('fade-out');
                setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // 专用于 onclick 属性中 JS 字符串上下文的转义
        // 区别于 escapeHtml：HTML 转义解决的是 < > & " 等 HTML 实体问题，
        // 而 JS 字符串中转义需处理 \ ' " 换行等破坏 JS 语法的字符
        function escapeJsString(str) {
            if (!str) return '';
            return str
                .replace(/\\/g, '\\\\')   // 反斜杠必须最先处理，否则会破坏后续转义
                .replace(/'/g, "\\'")     // 单引号 — 破坏 JS 字符串
                .replace(/"/g, '&quot;')  // 双引号 — 破坏外层 HTML 属性
                .replace(/\n/g, '\\n')    // 换行符 — 破坏 JS 字符串
                .replace(/\r/g, '\\r');   // 回车符 — 破坏 JS 字符串
        }

        // ─── 登录逻辑 ──────────────────────────────────────
        function showLogin() {
            var overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.classList.add('show');
        }

        function hideLogin() {
            var overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.classList.remove('show');
            document.getElementById('loginError').textContent = '';
            document.getElementById('loginPassword').value = '';
        }

        async function handleLogin() {
            var btn = document.getElementById('loginBtn');
            var phoneEl = document.getElementById('loginPhone');
            var passwordEl = document.getElementById('loginPassword');
            var errorEl = document.getElementById('loginError');

            var phone = (phoneEl.value || '').trim();
            var password = passwordEl.value || '';

            if (!phone) { errorEl.textContent = '请输入手机号'; return; }
            if (!password) { errorEl.textContent = '请输入密码'; return; }

            errorEl.textContent = '';
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                var result = await YuJianAuth.login({ phone: phone, password: password });
                hideLogin();
                showToast('登录成功，欢迎回来！', 'success');
                updateUserDisplay(result.userInfo);
                // 检查是否有待恢复的任务
                YuJianVideoTask.recoverIncompleteTasks({
                    onUpdate: function (t) { updateTaskStatusDisplay(t); refreshMyWorksIfActive(); },
                    onSuccess: function (t) { handleTaskSuccess(t); refreshMyWorksIfActive(); },
                    onFailed: function (t) { handleTaskFailed(t); refreshMyWorksIfActive(); }
                });
            } catch (err) {
                console.error('[Auth] 登录失败', err);
                errorEl.textContent = err.message || '登录失败，请重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        function updateUserDisplay(userInfo) {
            var name = (userInfo && userInfo.email) ? userInfo.email.split('@')[0] : '';
            var initial = name ? name[0].toUpperCase() : '用';
            // 更新侧边栏用户头像
            var userAvatars = document.querySelectorAll('.avatar-sm');
            userAvatars.forEach(function (el) { if (el) el.textContent = initial; });
        }

        // 页面加载时检查登录状态
        (function initAuth() {
            if (YuJianAuth.isAuthenticated()) {
                var userInfo = YuJianAuth.getUserInfo();
                if (userInfo) updateUserDisplay(userInfo);
                // 尝试恢复任务（从数据库查询所有未完成任务）
                setTimeout(function () {
                    YuJianVideoTask.recoverIncompleteTasks({
                        onUpdate: function (t) { updateTaskStatusDisplay(t); refreshMyWorksIfActive(); },
                        onSuccess: function (t) { handleTaskSuccess(t); refreshMyWorksIfActive(); },
                        onFailed: function (t) { handleTaskFailed(t); refreshMyWorksIfActive(); }
                    });
                }, 500);
            }
        })();

        // ─── 拦截导航，确保登录 ────────────────────────────
        var _originalNavigateTo = navigateTo;
        navigateTo = function (page) {
            // 创作类页面需要登录
            var authPages = ['studio', 'image2video', 'text2video', 'ref2video', 'digitalhuman', 'imageGen', 'assets'];
            if (authPages.indexOf(page) !== -1 && !YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');
                return;
            }
            _originalNavigateTo(page);
        };

        // ─── 图片选择 ──────────────────────────────────────
        async function handleImageSelect(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            // 清理旧预览
            clearImageSelection();

            // 校验
            var validation = await YuJianUpload.validateImage(file);
            if (!validation.valid) {
                showToast(validation.error, 'error');
                // 清理 input 以便重新选择同一文件
                event.target.value = '';
                return;
            }

            var meta = validation.meta;

            // 创建本地预览
            var preview = YuJianUpload.createPreview(file);
            I2V_STATE.selectedFile = file;
            I2V_STATE.previewUrl = preview.url;
            I2V_STATE.uploadedImageUrl = null;
            I2V_STATE.assetId = null;

            // 显示预览
            showImagePreview(preview.url, meta);
        }

        function showImagePreview(url, meta) {
            // 小图预览
            var container = document.getElementById('i2vPreviewContainer');
            var img = document.getElementById('i2vPreviewImage');
            var info = document.getElementById('i2vFileInfo');
            var uploadArea = document.getElementById('i2vUploadArea');
            var sourceLabel = document.getElementById('i2vSourceLabel');

            if (container) container.style.display = 'block';
            if (img) img.src = url;
            if (info && meta) {
                var sizeMB = (meta.size / (1024 * 1024)).toFixed(2);
                info.textContent = meta.name + ' | ' + sizeMB + 'MB | ' + meta.width + '×' + meta.height;
            }
            if (uploadArea) {
                uploadArea.classList.add('filled');
            }
            // Sprint 4.2: 显示来源标签
            if (sourceLabel) {
                sourceLabel.style.display = (I2V_STATE.sourceMode === 'asset') ? 'inline' : 'none';
            }

            // 大图预览
            var largePreview = document.getElementById('i2vLargePreview');
            var placeholder = document.getElementById('i2vPreviewPlaceholder');
            if (largePreview) { largePreview.src = url; largePreview.style.display = 'block'; }
            if (placeholder) placeholder.style.display = 'none';

            // 清理结果区（新图片意味着新任务）
            resetResultArea();
        }

        function clearImageSelection() {
            // 释放 ObjectURL
            if (I2V_STATE.previewUrl) {
                URL.revokeObjectURL(I2V_STATE.previewUrl);
                I2V_STATE.previewUrl = null;
            }
            I2V_STATE.selectedFile = null;
            I2V_STATE.uploadedImageUrl = null;
            I2V_STATE.assetId = null;
            // Sprint 4.2: 清理资产选择状态
            I2V_STATE.selectedAsset = null;
            I2V_STATE.sourceMode = 'upload';

            // 重置 UI
            var container = document.getElementById('i2vPreviewContainer');
            var uploadArea = document.getElementById('i2vUploadArea');
            var largePreview = document.getElementById('i2vLargePreview');
            var placeholder = document.getElementById('i2vPreviewPlaceholder');
            var fileInput = document.getElementById('i2vFileInput');
            var sourceLabel = document.getElementById('i2vSourceLabel');

            if (container) container.style.display = 'none';
            if (uploadArea) uploadArea.classList.remove('filled');
            if (largePreview) { largePreview.style.display = 'none'; largePreview.src = ''; }
            if (placeholder) placeholder.style.display = '';
            if (fileInput) fileInput.value = '';
            if (sourceLabel) sourceLabel.style.display = 'none';

            // Sprint 4.2: 重置资产选择按钮样式
            var assetBtn = document.getElementById('refSourceAssetBtn');
            if (assetBtn) {
                assetBtn.classList.remove('asset-selected');
                assetBtn.innerHTML = '<i class="fas fa-folder-open"></i><span>从资产库选择</span>';
            }

            resetResultArea();
        }

        // ─── 状态区管理 ────────────────────────────────────
        function setPageState(newState) {
            var oldState = I2V_STATE.pageState;
            I2V_STATE.pageState = newState;
            console.log('[Image2Video] 状态变更:', oldState, '→', newState);
        }

        function showStatus(type, message, showSpinner) {
            var area = document.getElementById('i2vStatus');
            var text = document.getElementById('i2vStatusText');
            var spinner = document.getElementById('i2vSpinner');
            if (!area || !text) return;

            area.className = 'status-area ' + type + ' show';
            text.textContent = message;
            if (spinner) spinner.style.display = showSpinner ? 'block' : 'none';
        }

        function hideStatus() {
            var area = document.getElementById('i2vStatus');
            if (area) area.classList.remove('show');
        }

        function updateTaskStatusDisplay(task) {
            if (!task) return;
            var statusText = YuJianVideoTask.STATUS_MAP[task.status] || task.status;
            var isProcessing = task.status === 'pending' || task.status === 'processing';
            showStatus(isProcessing ? 'processing' : task.status === 'success' ? 'success' : 'error',
                statusText, isProcessing);
        }

        function resetResultArea() {
            I2V_STATE.pageState = 'idle';
            var resultArea = document.getElementById('i2vResultArea');
            var video = document.getElementById('i2vResultVideo');
            var errorDiv = document.getElementById('i2vResultError');
            var errorText = document.getElementById('i2vResultErrorText');
            var actions = document.getElementById('i2vResultActions');

            if (resultArea) resultArea.classList.remove('show');
            if (video) { video.style.display = 'none'; video.src = ''; video.load(); }
            if (errorDiv) errorDiv.style.display = 'none';
            if (errorText) errorText.textContent = '';
            if (actions) actions.style.display = 'none';

            hideStatus();
        }

        // ─── 提示词计数 ────────────────────────────────────
        (function bindPromptCounter() {
            // 使用事件委托，因为元素是动态渲染的
            document.addEventListener('input', function (e) {
                if (e.target && e.target.id === 'i2vPrompt') {
                    var counter = document.getElementById('i2vPromptCount');
                    if (counter) counter.textContent = (e.target.value || '').length;
                }
            });
        })();

        // ─── 图生视频生成 ──────────────────────────────────
        async function handleGenerateImage2Video() {
            var btn = document.getElementById('i2vGenerateBtn');
            var btnText = document.getElementById('i2vGenerateText');
            var promptEl = document.getElementById('i2vPrompt');
            var modelEl = document.getElementById('i2vModel');
            var durationEl = document.getElementById('i2vDuration');

            // 检查登录
            if (!YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');

            var stepIds = ['genStepSubmit', 'genStepProcess', 'genStepComplete', 'genStepView'];

            var targetIdx = stepMap[activeStep] !== undefined ? stepMap[activeStep] : 0;

            for (var i = 0; i < stepIds.length; i++) {

                el.className = 'gen-timeline-step';
                if (i < targetIdx) el.classList.add('done');
                if (i === targetIdx) el.classList.add('active');

            for (var j = 0; j < lineIds.length; j++) {

                else line.classList.remove('done');

        // Sprint 4.4 Patch1: 安全请求封装（捕获网络/JSON/超时错误）
        function safeFetch(url, options) {
            var timeoutMs = (options && options.timeout) || 15000;
            return new Promise(function (resolve, reject) {
                var timer = setTimeout(function () {
                    reject({ code: 'TIMEOUT', message: '请求超时', status: 0, retryable: true });
                }, timeoutMs);

                YuJianAPI.get(url, options)
                    .then(function (data) {
                        clearTimeout(timer);
                        resolve(data);
                    })
                    .catch(function (err) {
                        clearTimeout(timer);
                        // 统一错误格式
                        reject({
                            code: err.code || 'UNKNOWN',
                            message: err.message || '未知错误',
                            status: err.status || 0,
                            retryable: err.retryable !== false,
                            raw: err
                        });
                    });
            });
        }

        async function loadAssets(page) {
            var AS = YJ.state.assets;
            if (AS.isLoading) return;

            AS.currentPage = page || 1;
            AS.errorMessage = '';

            // 显示加载状态

            var params = '?page=' + AS.currentPage + '&pageSize=' + AS.pageSize;
            if (AS.currentType) params += '&type=' + AS.currentType;
            if (AS.currentKeyword) params += '&keyword=' + encodeURIComponent(AS.currentKeyword);
            if (AS.currentSort) params += '&sort=' + AS.currentSort;
            if (AS.currentStatus) params += '&status=' + AS.currentStatus;

            // Sprint 4.4 Patch2: 始终使用稳定的 Asset API，不依赖 Workspace 模块
            var apiPath = '/enterprise/assets';

            try {
                // Sprint 4.4 Patch1: 使用 safeFetch 替代直接 API 调用
                var data = await safeFetch(apiPath + params);

                if (!data) {
                    throw { code: 'EMPTY_RESPONSE', message: '服务器返回空数据', status: 0, retryable: true };

                AS.total = data.total || 0;

                    AS.pageState = ASSET_PAGE_STATE.SUCCESS;

            // 关闭其他打开的菜单

        // ─── 格式化文件大小 ────────────────────────────────
        function formatAssetSize(bytes) {
            if (!bytes || bytes === 0) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ─── 渲染分页 ──────────────────────────────────────
        function renderAssetPagination(container) {
            if (!container) return;
            var total = YJ.state.assets.total;
            var page = YJ.state.assets.currentPage;
            var pageSize = YJ.state.assets.pageSize;
            var totalPages = Math.ceil(total / pageSize);

            if (total <= pageSize) {
                container.innerHTML = total > 0
                    ? '<div class="pagination-bar"><span class="page-info">共 ' + total + ' 个素材</span></div>'
                    : '';
                return;
            }

            var prevBtn = page > 1
                ? '<button class="btn btn-outline btn-sm" onclick="loadAssets(' + (page - 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})"><i class="fas fa-chevron-left"></i> 上一页</button>'
                : '<button class="btn btn-outline btn-sm" disabled><i class="fas fa-chevron-left"></i> 上一页</button>';

            var nextBtn = page < totalPages
                ? '<button class="btn btn-outline btn-sm" onclick="loadAssets(' + (page + 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})">下一页 <i class="fas fa-chevron-right"></i></button>'
                : '<button class="btn btn-outline btn-sm" disabled>下一页 <i class="fas fa-chevron-right"></i></button>';

            container.innerHTML = '<div class="pagination-bar">' +
                prevBtn +
                '<span class="page-info">第 ' + page + ' / ' + totalPages + ' 页，共 ' + total + ' 个素材</span>' +
                nextBtn +
                '</div>';
        }

        // ─── Sprint 4.2: 资产详情 Modal ────────────────────
        var CURRENT_ASSET_DETAIL = null; // { id, url, name, ... }

        // KL-B: PLAY_URL_CACHE 统一使用 utils.js 版本

        // ─── 预览资产（Sprint 4.2: 改为打开详情模态框）──────
        // Sprint 4.4 Patch5: 统一图片URL解析
        function getAssetPreviewUrl(asset) {
            if (!asset) return '';
            return asset.thumbnailUrl || asset.url || asset.fileUrl || asset.path || '';
        }

        // KL-B: resolveAssetPlayableUrl 统一使用 utils.js 版本（window.resolveAssetPlayableUrl）
        // 删除本文件重复实现，避免 PLAY_URL_CACHE 双份不互通

        // Sprint 4.4 Patch5: 统一 API 响应格式转换
        function normalizeAssetResponse(data) {
            if (!data) return null;
            // 支持: { data: { asset: {...} } }  →  提取 asset
            if (data.data && data.data.asset && data.data.asset.id) return data.data.asset;
            // 支持: { data: {...} }  →  提取 data
            if (data.data && data.data.id) return data.data;
            // 支持: { asset: {...} }  →  提取 asset
            if (data.asset && data.asset.id) return data.asset;
            // 直接就是 Asset 对象
            return data;
        }

        // Sprint 4.4 Patch5: 打开素材详情（缓存优先，避免二次请求导致字段丢失）
        async function openAssetDetail(assetOrId) {
            var overlay = document.getElementById('assetDetailOverlay');
            var previewEl = document.getElementById('assetDetailPreview');
            var bodyEl = document.getElementById('assetDetailBody');
            var actionsEl = document.getElementById('assetDetailActions');
            var titleEl = document.getElementById('assetDetailTitle');

            // Sprint 4.4 Patch7: 显示加载态，先清理旧的AI创作按钮等动态节点
            var staleGenBtn = actionsEl.querySelector('#asset-ai-create-btn');
            if (staleGenBtn) staleGenBtn.remove();
            overlay.classList.add('show');
            actionsEl.style.display = 'none';
            titleEl.innerText = '素材详情';
            previewEl.innerHTML = '<div class="asset-detail-loading"><div class="spinner"></div><div>加载中...</div></div>';
            bodyEl.innerHTML = '<div class="asset-detail-loading"><div class="spinner"></div><div>加载详情...</div></div>';

            var asset = null;
            var assetId = null;

            // Sprint 4.4 Patch5: 解析参数 — 支持传入 Asset 对象或 assetId
            if (typeof assetOrId === 'object' && assetOrId !== null && assetOrId.id) {
                asset = assetOrId;
                assetId = asset.id;
            } else if (typeof assetOrId === 'string' || typeof assetOrId === 'number') {
                assetId = String(assetOrId);
                // 优先从缓存获取，避免二次 API 请求
                asset = ASSET_CACHE[assetId] || null;
            }

            // Sprint 4.4 Patch5: 缓存命中 — 直接渲染，不发起 API 请求
            if (asset) {
                await renderAssetDetailContent(asset, assetId || asset.id);
                return;
            }

            // 缓存未命中，无有效 ID
            if (!assetId) {
                previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>素材不可用</p></div>';
                actionsEl.style.display = 'flex';
                document.getElementById('assetDetailDeleteBtn').style.display = 'none';
                return;
            }

            // 缓存未命中，通过 API 获取
            try {
                var data = await safeFetch('/enterprise/assets/' + assetId);
                var normalized = normalizeAssetResponse(data);
                if (!normalized) {
                    throw { code: 'EMPTY_RESPONSE', message: '服务器返回空数据', status: 0 };
                }
                // 存入缓存
                ASSET_CACHE[assetId] = normalized;
                await renderAssetDetailContent(normalized, assetId);
            } catch (err) {
                console.error('[AssetDetail] 加载失败:', err);
                // Sprint 4.4 Patch5: 只有 API 明确返回 404 才显示"不存在"
                if (err.status === 404) {
                    previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                    bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>素材不存在或已删除</p></div>';
                } else {
                    previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                    bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>加载失败，请重试</p><button class="btn btn-outline btn-sm" onclick="openAssetDetail(\'' + assetId + '\')" style="margin-top:12px">重试</button></div>';
                }
                actionsEl.style.display = 'flex';
                document.getElementById('assetDetailDeleteBtn').style.display = 'none';
            }
        }

        function closeAssetDetail() {
            var overlay = document.getElementById('assetDetailOverlay');
            overlay.classList.remove('show');
            CURRENT_ASSET_DETAIL = null;
        }

        // ─── Sprint 4.4 Patch1: 加载素材创作历史（完全隔离，失败不影响 Modal）─
        async function loadAssetHistory(assetId) {
            var historyList = document.getElementById('assetHistoryList');
            if (!historyList) return;

            // Sprint 4.4 Patch1: 使用 safeFetch，Workspace API 失败则回退到旧接口
            try {
                // 使用 Workspace 接口获取增强生成数据
                var wsData = await safeFetch('/enterprise/workspace/assets/' + assetId + '/generations');

                var overlay = document.getElementById('assetDetailOverlay');
                if (!overlay || !overlay.classList.contains('show')) return;

                if (!wsData || !wsData.generations || wsData.generations.length === 0) {
                    historyList.innerHTML = '<div class="history-empty"><i class="fas fa-inbox"></i><p>暂无创作记录</p></div>';
                    return;
                }

                var STATUS_CLASS = {
                    'success': 'history-status-success',
                    'processing': 'history-status-processing',
                    'pending': 'history-status-pending',
                    'failed': 'history-status-failed'
                };
                var STATUS_LABEL = {
                    'success': '已完成',
                    'processing': '处理中',
                    'pending': '等待中',
                    'failed': '失败'
                };

                // 统计信息
                var summary = (wsData && wsData.summary) || {};
                var summaryHtml = '';
                if (summary.total > 0) {
                    summaryHtml = '<div style="display:flex;gap:16px;margin-bottom:12px;font-size:12px;flex-wrap:wrap">' +
                        '<span style="color:var(--text-muted)">总计 <strong style="color:#fff">' + summary.total + '</strong></span>' +
                        (summary.success > 0 ? '<span style="color:#34d399">✓ 成功 <strong>' + summary.success + '</strong></span>' : '') +
                        (summary.processing > 0 ? '<span style="color:#60a5fa">⟳ 处理中 <strong>' + summary.processing + '</strong></span>' : '') +
                        (summary.failed > 0 ? '<span style="color:#f87171">✗ 失败 <strong>' + summary.failed + '</strong></span>' : '') +
                        '</div>';
                }

                var html = summaryHtml;
                for (var i = 0; i < wsData.generations.length; i++) {
                    var task = wsData.generations[i];
                    var statusLabel = STATUS_LABEL[task.status] || (task.status || '未知');
                    var statusClass = STATUS_CLASS[task.status] || 'history-status-pending';
                    var dateStr = formatWorkDate((task && task.createdAt) || null);
                    var promptText = (task && task.prompt) || '无提示词';
                    var taskTypeIcon = (task && task.taskType) === 'text2video' ? 'fa-font' :
                        (task && task.taskType) === 'image2video' ? 'fa-image' : 'fa-film';

                    // Sprint 4.4 Patch1: 安全访问 outputAsset 字段
                    var outputAsset = task && task.outputAsset;
                    var outputHtml = '';
                    if (outputAsset) {
                        var oaThumb = outputAsset.thumbnailUrl || outputAsset.url || '';
                        var oaId = outputAsset.id || 0;
                        var oaThumbImg = oaThumb
                            ? '<img src="' + escapeHtml(oaThumb) + '" style="width:60px;height:40px;border-radius:6px;object-fit:cover;background:rgba(0,0,0,0.3)" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
                            : '';
                        outputHtml = '<div class="history-item-action" style="display:flex;align-items:center;gap:10px;margin-top:8px">' +
                            oaThumbImg +
                            '<button class="btn-view-work" onclick="viewHistoryOutput(' + oaId + ', ' + (task.id || 0) + ')"><i class="fas fa-external-link-alt"></i> 查看作品</button>' +
                            '</div>';
                    }

                    var creativeTypeLabel = formatTaskType(task.taskType);
                    html += '<div class="history-item">' +
                        '<div class="history-item-header">' +
                        '<div class="history-item-name">' +
                        '<i class="fas ' + taskTypeIcon + ' task-icon"></i>' +
                        escapeHtml(promptText.length > 28 ? promptText.substring(0, 28) + '...' : promptText) +
                        '</div>' +
                        '<span class="history-item-status ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>' +
                        '</div>' +
                        '<div class="history-item-meta">' +
                        '创作类型：' + escapeHtml(creativeTypeLabel) + ' · ' + dateStr +
                        '</div>' +
                        ((task && task.prompt) ? '<div class="history-item-prompt" title="' + escapeHtml(task.prompt) + '">Prompt: ' + escapeHtml(task.prompt) + '</div>' : '') +
                        outputHtml +
                        '</div>';
                }
                historyList.innerHTML = html;

            } catch (wsErr) {
                console.warn('[AssetHistory] Workspace API 加载失败，回退到旧接口:', wsErr.message || wsErr);
                // Sprint 4.4 Patch1: 回退到旧接口，同样使用 safeFetch
                try {
                    var data = await safeFetch('/enterprise/assets/' + assetId + '/history');
                    var overlay = document.getElementById('assetDetailOverlay');
                    if (!overlay || !overlay.classList.contains('show')) return;

                    if (!data || !data.generationTasks || data.generationTasks.length === 0) {
                        historyList.innerHTML = '<div class="history-empty"><i class="fas fa-inbox"></i><p>暂无创作记录</p></div>';
                        return;
                    }
                    var STATUS_CLASS = {
                        'success': 'history-status-success',
                        'processing': 'history-status-processing',
                        'pending': 'history-status-pending',
                        'failed': 'history-status-failed'
                    };
                    var STATUS_LABEL = {
                        'success': '已完成',
                        'processing': '处理中',
                        'pending': '等待中',
                        'failed': '失败'
                    };
                    var html = '';
                    for (var j = 0; j < data.generationTasks.length; j++) {
                        var task = data.generationTasks[j];
                        var statusLabel = STATUS_LABEL[(task && task.status)] || (task && task.status) || '未知';
                        var statusClass = STATUS_CLASS[(task && task.status)] || 'history-status-pending';
                        var dateStr = formatWorkDate((task && task.createdAt) || null);
                        var promptText = (task && task.prompt) || '无提示词';
                        var taskTypeIcon = (task && task.taskType) === 'text2video' ? 'fa-font' :
                            (task && task.taskType) === 'image2video' ? 'fa-image' : 'fa-film';

                        // Sprint 4.4 Patch1: 安全访问 outputAsset
                        var taskOutput = task && task.outputAsset;
                        var outputHtml = taskOutput
                            ? '<div class="history-item-action"><button class="btn-view-work" onclick="viewHistoryOutput(' + (taskOutput.id || 0) + ', ' + (task.id || 0) + ')"><i class="fas fa-external-link-alt"></i> 查看作品</button></div>'
                            : '';

                        var creativeTypeLabel = formatTaskType(task.taskType);
                        html += '<div class="history-item">' +
                            '<div class="history-item-header">' +
                            '<div class="history-item-name">' +
                            '<i class="fas ' + taskTypeIcon + ' task-icon"></i>' +
                            escapeHtml(promptText.length > 28 ? promptText.substring(0, 28) + '...' : promptText) +
                            '</div>' +
                            '<span class="history-item-status ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>' +
                            '</div>' +
                            '<div class="history-item-meta">创作类型：' + escapeHtml(creativeTypeLabel) + ' · 创建时间: ' + dateStr + '</div>' +
                            ((task && task.prompt) ? '<div class="history-item-prompt" title="' + escapeHtml(task.prompt) + '">Prompt: ' + escapeHtml(task.prompt) + '</div>' : '') +
                            outputHtml +
                            '</div>';
                    }
                    historyList.innerHTML = html;
                } catch (err) {
                    // Sprint 4.4 Patch1: 两级 API 均失败，显示空状态，不关闭 Modal
                    console.warn('[AssetHistory] 旧接口也加载失败:', err.message || err);
                    var overlay = document.getElementById('assetDetailOverlay');
                    if (!overlay || !overlay.classList.contains('show')) return;
                    var el = document.getElementById('assetHistoryList');
                    if (el) el.innerHTML = '<div class="history-empty"><i class="fas fa-inbox"></i><p>暂无创作记录</p></div>';
                }
            }
        }

        // ─── 从创作历史跳转到作品 ────────────────────────────
        function viewHistoryOutput(outputAssetId, taskId) {
            // 参数校验
            if (!taskId && taskId !== 0) {
                showToast('无法查看作品：任务ID缺失', 'warning');
                return;
            }
            // 记录当前 asset id 用于回退（暂未使用，预留）
            var currentAssetId = CURRENT_ASSET_DETAIL ? CURRENT_ASSET_DETAIL.id : null;
            // 关闭素材详情
            closeAssetDetail();
            // 跳转到我的作品页面，并打开对应作品详情
            navigateTo('myworks');
            // 延迟等待页面渲染后打开作品详情
            setTimeout(function () {
                showWorkDetail(taskId);
            }, 400);
        }

        function copyAssetLink() {
            if (!CURRENT_ASSET_DETAIL || !CURRENT_ASSET_DETAIL.url) {
                showToast('无法获取素材链接', 'warning');
                return;
            }
            var url = CURRENT_ASSET_DETAIL.url;
            // 使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    showToast('链接已复制到剪贴板', 'success');
                }).catch(function () {
                    fallbackCopyText(url);
                });
            } else {
                fallbackCopyText(url);
            }
        }

        function fallbackCopyText(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('链接已复制到剪贴板', 'success');
            } catch (e) {
                showToast('复制失败，请手动复制链接', 'error');
            }
            document.body.removeChild(textarea);
        }

        function deleteAssetFromDetail() {
            var btn = document.getElementById('assetDetailDeleteBtn');
            var assetId = btn.getAttribute('data-asset-id');
            var assetName = btn.getAttribute('data-asset-name') || '';

            // 先关闭详情Modal，再打开删除确认

        // ─── 删除素材（Sprint 4.1 Patch2）────────────────────

            // 在modal body底部添加删除确认按钮

            // 确认按钮：保持红色危险色；hover 深红

                ' onmouseover="this.style.background=\'#eef2ff\';this.style.borderColor=\'#818cf8\'"' +
                ' onmouseout="this.style.background=\'transparent\';this.style.borderColor=\'#c7d2fe\'">取消</button>' +
                '<button class="btn btn-danger" onclick="closeModal();deleteAsset(\'' + assetId + '\')" style="min-width:100px;background:var(--danger,#ef4444);border-color:var(--danger,#ef4444);color:#fff"' +
                ' onmouseover="this.style.background=\'#dc2626\';this.style.borderColor=\'#dc2626\'"' +

            openModal('确认删除该素材？', encodeURIComponent(content));

        async function deleteAsset(assetId) {
            try {
                await YuJianAPI.request('/enterprise/assets/' + assetId, { method: 'DELETE' });
                showToast('素材已删除', 'success');
                // 从本地状态移除已删除项
                YJ.state.assets.items = YJ.state.assets.items.filter(function(item) { return item.id != assetId; });
                YJ.state.assets.total = Math.max(0, YJ.state.assets.total - 1);
                // 重新渲染列表
                var contentEl = document.getElementById('assetContent');
                if (contentEl) {
                    if (!YJ.state.assets.items.length) {
                        contentEl.innerHTML = '<div class="empty-works">' +
                            '<i class="fas fa-folder-open"></i>' +
                            '<p>暂无素材</p>' +
                            '<p class="sub-text">上传图片、视频或音频素材开始管理</p>' +
                            '</div>';
                    } else {
                        contentEl.innerHTML = '<div class="asset-grid-new">' +
                            YJ.state.assets.items.map(renderAssetCard).join('') +
                            '</div>';
                    }
                }
                // 刷新分页
                var paginationEl = document.getElementById('assetPagination');
                if (paginationEl) renderAssetPagination(paginationEl);
            } catch (err) {
                console.error('[Asset] 删除失败:', err);
                if (err.status === 401) {
                    showToast('登录已过期，请刷新页面重新登录', 'error');
                } else if (err.status === 404) {
                    showToast('素材不存在或已删除', 'warning');
                    loadAssets(YJ.state.assets.currentPage);
                } else {
                    showToast('删除失败，请稍后重试', 'error');
                }
            }
        }

        // ─── 上传素材 ──────────────────────────────────────
        function triggerAssetUpload() {
            if (!YuJianAuth.isAuthenticated()) {

        async function handleAssetFileSelect(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            // 判断文件类型
            var type = 'other';
            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';
            else if (file.type.startsWith('audio/')) type = 'audio';

            // 文件大小限制：图片10MB，视频200MB，音频50MB
            var maxSize = type === 'video' ? 200 * 1024 * 1024 : type === 'audio' ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
            var maxSizeLabel = type === 'video' ? '200MB' : type === 'audio' ? '50MB' : '10MB';

            if (file.size > maxSize) {
                var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
                showToast('文件过大 (' + sizeMB + 'MB)，最大支持 ' + maxSizeLabel, 'error');
                event.target.value = '';
                return;
            }

            showToast('正在上传素材...', 'info');

            try {
                // 复用现有上传流程：上传到 OSS 并创建素材记录
                var result = await uploadAssetFile(file, type);
                showToast('上传成功！', 'success');
                // 刷新资产列表
                YJ.state.assets.currentPage = 1;
                loadAssets(1);
            } catch (err) {
                console.error('[Assets] 上传失败:', err);
                showToast(err.message || '上传失败，请重试', 'error');
            } finally {
                event.target.value = '';
            }
        }

        // ─── 通用文件上传（扩展现有 YuJianUpload 流程）─────
        async function uploadAssetFile(file, type) {
            // 1. 获取 OSS 上传签名
            var signatureData = await YuJianAPI.get('/enterprise/assets/upload-signature?type=' + type);

            // 2. OSS 直传
            var ossResult = await uploadToOssGeneric(file, signatureData);

            // 3. 创建 Asset 记录
            var assetRecord = await YuJianAPI.post('/enterprise/assets', {
                name: file.name,
                url: ossResult.ossUrl,
                type: type,
                size: file.size,
                mime_type: file.type
            });

            return assetRecord;
        }

        function uploadToOssGeneric(file, signatureData) {
            return new Promise(function (resolve, reject) {
                var host = signatureData.host;
                var policy = signatureData.policy;
                var signature = signatureData.signature;
                var dir = signatureData.dir;
                var accessKeyId = signatureData.accessKeyId;

                var timestamp = Date.now();
                var randomStr = Math.random().toString(36).substring(2, 8);
                var safeName = file.name.replace(/[^一-龥a-zA-Z0-9._-]/g, '_');
                var key = dir + timestamp + '_' + randomStr + '_' + safeName;

                var formData = new FormData();
                formData.append('key', key);
                formData.append('policy', policy);
                formData.append('OSSAccessKeyId', accessKeyId);
                formData.append('signature', signature);
                formData.append('success_action_status', '200');
                formData.append('file', file);

                var xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', function (e) {
                    // 静默上传，不展示进度条
                });

                xhr.addEventListener('load', function () {
                    if (xhr.status === 200 || xhr.status === 204) {
                        var ossUrl = host + '/' + key;
                        resolve({ ossUrl: ossUrl, ossKey: key });
                    } else {
                        reject(new Error('OSS 上传失败 (' + xhr.status + ')'));
                    }
                });

                xhr.addEventListener('error', function () {
                    reject(new Error('OSS 上传网络异常，请重试'));
                });

                xhr.addEventListener('abort', function () {
                    reject(new Error('上传已取消'));
                });

                xhr.open('POST', host);
                xhr.send(formData);
            });
        }

        // ─── 导航到资产页时自动加载 ────────────────────────
        var _originalRenderAssets = render;
        render = function (page) {
            // 清理之前页面的轮询等
            if (APP.currentPage === 'image2video' && page !== 'image2video') {

            _originalRenderAssets(page);
            // 进入资产页面自动加载
            if (page === 'assets') {
                setTimeout(function () { loadAssets(1); }, 0);
            }
        };
    </script>
