        /* ─── 加载骨架（Sprint 3.3.2）──────────────────────── */
        .loading-skeleton {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-sub);
        }
        .loading-skeleton i {
            margin-right: 8px;
            font-size: 18px;
        }

        @media (max-width: 1200px) {
            .works-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .works-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .works-grid { grid-template-columns: 1fr; }
        }

        /* ─── 素材库（Sprint 4.1 资产中心）──────────────────────── */
        .asset-grid-new {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
        }
        /* Sprint 4.1 Patch3: 素材卡片UI升级 */
        .asset-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .asset-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* ── 缩略图区域（16:9）── */
        .asset-card-thumb {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .asset-card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .asset-card:hover .asset-card-thumb img {
            transform: scale(1.05);
        }
        .asset-card-icon {
            font-size: 36px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ── 类型标签（缩略图右下角）── */
        .asset-type-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border-radius: 6px;
            z-index: 2;
            pointer-events: none;
        }

        /* ── Hover 遮罩层 ── */
        .asset-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 4;
            pointer-events: none;
            border-radius: 20px;
        }
        .asset-card:hover .asset-hover-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        .asset-hover-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .asset-hover-btn:hover {
            background: rgba(99, 102, 241, 0.7);
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.4);
        }
        .asset-hover-delete:hover {
            background: rgba(239, 68, 68, 0.75);
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.4);
        }

        /* ── 更多按钮（⋮ 右上角）── */
        .asset-more-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: all 0.2s;
            z-index: 5;
            pointer-events: auto;
        }
        .asset-card:hover .asset-more-btn {
            opacity: 1;
        }
        .asset-more-btn:hover {
            background: rgba(99, 102, 241, 0.6);
            border-color: rgba(99, 102, 241, 0.7);
            color: #fff;
        }

        /* ── 更多菜单 ── */
        .asset-more-menu {
            position: absolute;
            top: 44px;
            right: 8px;
            min-width: 120px;
            background: rgba(30, 30, 50, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .asset-more-menu.show {
            display: block;
        }
        .asset-menu-item {
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .asset-menu-item:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
        }
        .asset-menu-delete {
            color: #f87171;
        }
        .asset-menu-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .asset-thumb-video {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }
        .asset-thumb-video img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }
        .asset-play-icon {
            position: absolute;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .asset-thumb-audio {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.15));
        }
        .asset-audio-icon {
            font-size: 48px;
            color: rgba(16, 185, 129, 0.6);
        }

        /* ── 信息区域 ── */
        .asset-card-info {
            padding: 12px 14px;
        }
        .asset-card-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .asset-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .asset-card-type {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--primary-light);
            font-size: 11px;
        }
        .asset-card-size {
            font-size: 11px;
            color: var(--text-muted);
        }
        .asset-card-date {
            font-size: 11px;
            color: var(--text-muted);
        }
        @media (max-width: 1400px) {
            .asset-grid-new { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 900px) {
            .asset-grid-new { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .asset-grid-new { grid-template-columns: repeat(2, 1fr); }
        }

        /* 素材库 */
        .asset-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .asset-item {
            aspect-ratio: 1; border-radius: 8px; 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.08));
            border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .asset-item:hover { transform: scale(1.05); }
        .asset-item i { font-size: 24px; color: var(--text-sub); }
        .asset-item .asset-type {
            position: absolute; bottom: 4px; right: 4px; font-size: 10px;
            background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; border-radius: 4px;
        }
        
        /* 剪辑工作台 */
        .timeline-editor {
            background: #1a1a2e; border-radius: var(--radius); padding: 20px; color: #fff;
        }
        .timeline-preview {
            width: 100%; max-width: 640px; margin: 0 auto 20px; aspect-ratio: 16/9;
            background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #6b7280;
        }
        .timeline-preview i { font-size: 48px; margin-bottom: 8px; }
        .timeline-track {
            background: #2d2d44; height: 60px; border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center; padding: 0 12px; gap: 8px; overflow-x: auto;
        }
        .timeline-clip {
            height: 40px; background: #3b7fe0; border-radius: 4px; padding: 0 10px;
            display: flex; align-items: center; font-size: 12px; flex-shrink: 0; cursor: move;
        }
        .timeline-clip.audio { background: #10b981; }
        .timeline-clip.text { background: #f59e0b; }
        .timeline-controls { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        
        /* 表格 */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f9fafb; font-weight: 600; color: var(--text-sub); font-size: 13px; }
        tr:hover { background: #f9fafb; }
        
        /* 搜索栏 */
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
        .search-box { position: relative; }
        .search-box input { 
            padding: 10px 14px 10px 38px; 
            border: 1px solid var(--border-glass); 
            border-radius: 10px; 
            width: 240px; 
            font-size: 14px; 
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: var(--primary-light); }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        /* 进度条 */
        .progress-bar { width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
        .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 4px; }
        
        /* 模态框 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: var(--radius); width: 500px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-header h3 { font-size: 18px; font-weight: 600; }
        .modal-close { cursor: pointer; color: var(--text-sub); font-size: 20px; }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
        
        /* 故事板编辑侧栏 */
        .storyboard-drawer {
            position: fixed; right: -420px; top: 0; width: 420px; height: 100vh;
            background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 200;
            transition: right 0.3s; display: flex; flex-direction: column;
        }
        .storyboard-drawer.show { right: 0; }
        .drawer-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { flex: 1; padding: 24px; overflow-y: auto; }
        .drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; }
        
        /* ─── 登录弹层（Sprint 3.3.2 UI Patch：玻璃拟态风格）─── */
        .login-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none; align-items: center; justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .login-overlay.show { display: flex; }
        .login-modal {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 360px; max-width: 90vw;
            padding: 36px 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
        }
        .login-modal h2 {
            font-size: 24px; font-weight: 700; margin-bottom: 6px;
            color: #fff;
            text-align: center;
            letter-spacing: 2px;
        }
        .login-modal .login-subtitle {
            font-size: 13px; color: rgba(255, 255, 255, 0.6);
            margin-bottom: 28px;
            text-align: center;
        }
        .login-modal .form-group { margin-bottom: 18px; }
        .login-modal .form-group label {
            display: block; margin-bottom: 8px; font-size: 13px;
            color: rgba(255, 255, 255, 0.8); font-weight: 500;
        }
        .login-modal .form-group input {
            width: 100%; padding: 0 16px; height: 48px; line-height: 48px;
            background: rgba(20, 30, 60, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; color: #fff;
            font-size: 14px; outline: none; transition: all 0.25s;
        }
        .login-modal .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .login-modal .form-group input:focus {
            border-color: rgba(32, 164, 243, 0.6);
            box-shadow: 0 0 0 3px rgba(32, 164, 243, 0.1);
            background: rgba(20, 30, 60, 0.6);
        }
        .login-modal .login-error {
            color: #f87171; font-size: 13px; margin-bottom: 6px;
            min-height: 20px;
        }
        .login-modal .btn-login {
            width: 100%; height: 46px;
            background: linear-gradient(135deg, #20a4f3, #8b5cf6);
            color: #fff; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 6px;
            box-shadow: 0 4px 20px rgba(32, 164, 243, 0.3);
        }
        .login-modal .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(32, 164, 243, 0.45);
        }
        .login-modal .btn-login:active { transform: translateY(0); }
        .login-modal .btn-login:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
            box-shadow: none;
        }
        .login-modal .login-register-hint {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: rgba(255, 255, 255, 0.5);
        }
        .login-modal .login-register-hint a {
            color: rgba(139, 92, 246, 0.9);
            cursor: pointer; text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .login-modal .login-register-hint a:hover {
            color: #a78bfa;
        }
        /* 移动端适配 */
        @media (max-width: 480px) {
            .login-modal {
                width: 92vw; padding: 28px 20px; border-radius: 16px;
            }
            .login-modal h2 { font-size: 22px; }
        }

        /* ─── Toast 通知 ─── */
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 3000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px; font-weight: 500;
            color: #fff;
            min-width: 280px; max-width: 420px;
            animation: toast-in 0.3s ease-out;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 10px;
        }
        .toast.error { background: rgba(239,68,68,0.9); }
        .toast.success { background: rgba(16,185,129,0.9); }
        .toast.info { background: rgba(59,130,246,0.9); }
        .toast.warning { background: rgba(245,158,11,0.9); }
        .toast.fade-out { animation: toast-out 0.3s ease-out forwards; }
        @keyframes toast-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* ─── 状态区 ─── */
        .status-area {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
        }
        .status-area.show { display: flex; }
        .status-area.uploading { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: #60a5fa; }
        .status-area.processing { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }
        .status-area.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
        .status-area.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .status-area .spinner {
            width: 18px; height: 18px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── 生成按钮禁用态 ─── */
        .generate-btn:disabled {
            opacity: 0.5; cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ─── 视频结果区 ─── */
        .result-video-area { display: none; margin-top: 20px; }
        .result-video-area.show { display: block; }
        .result-video-area video {
            width: 100%; border-radius: 12px;
            background: #000;
            max-height: 400px;
        }
        .result-actions {
            display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;
        }

        /* ─── 响应式 ─── */
        @media (max-width: 1024px) {
            .sidebar { width: 72px; }
            .sidebar-logo span, .nav-item span, .nav-section { display: none; }
            .nav-item { justify-content: center; padding: 14px; }
            .nav-item i { margin-right: 0; }
            .header, .main-content { left: 72px; margin-left: 72px; }
            .quick-create { grid-template-columns: repeat(2, 1fr); }
            .project-grid { grid-template-columns: repeat(2, 1fr); }
            .creation-form { grid-template-columns: 1fr; }
        }

        /* ─── AssetPicker 模态框（Sprint 4.2）──────────────────────── */
        .asset-picker-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 1500;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .asset-picker-overlay.show { display: flex; }
        .asset-picker-modal {
            background: rgba(20, 22, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 720px; max-width: 92vw; max-height: 80vh;
            display: flex; flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .asset-picker-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; align-items: center; justify-content: space-between;
        }
        .asset-picker-header h3 {
            font-size: 16px; font-weight: 600; color: #fff;
        }
        .asset-picker-close {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: none; color: rgba(255, 255, 255, 0.7);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: all 0.2s;
        }
        .asset-picker-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .asset-picker-toolbar {
            padding: 14px 24px;
            display: flex; gap: 12px; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .asset-picker-filter {
            padding: 8px 14px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 13px; cursor: pointer;
            transition: all 0.2s;
        }
        .asset-picker-filter:hover, .asset-picker-filter.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .asset-picker-filter.active {
            color: #a5b4fc;
            font-weight: 500;
        }
        .asset-picker-body {
            flex: 1; overflow-y: auto; padding: 16px 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            min-height: 280px;
            align-content: start;
        }
        .asset-picker-item {
            border-radius: 10px; overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.06);
            cursor: pointer; transition: all 0.2s;
            background: rgba(255, 255, 255, 0.03);
        }
        .asset-picker-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .asset-picker-item.selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }
        .asset-picker-item-thumb {
            aspect-ratio: 16/10;
            background: rgba(0, 0, 0, 0.3);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .asset-picker-item-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .asset-picker-item-thumb .no-thumb {
            font-size: 28px; color: rgba(255, 255, 255, 0.2);
        }
        .asset-picker-item-info {
            padding: 8px 10px;
        }
        .asset-picker-item-name {
            font-size: 12px; color: rgba(255, 255, 255, 0.85);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .asset-picker-empty {
            grid-column: 1 / -1;
            text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.4);
        }
        .asset-picker-empty i {
            font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4;
        }
        .asset-picker-loading {
            grid-column: 1 / -1;
            text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.5);
        }
        .asset-picker-loading .spinner {
            width: 24px; height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        .asset-picker-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-between; align-items: center;
        }
        .asset-picker-selected-info {
            font-size: 13px; color: rgba(255, 255, 255, 0.6);
        }
        .asset-picker-selected-name {
            color: #a5b4fc; font-weight: 500;
        }
        .asset-picker-actions {
            display: flex; gap: 10px;
        }
        .asset-picker-pagination {
            display: flex; gap: 8px; align-items: center; font-size: 12px; color: rgba(255,255,255,0.5);
        }

        /* ─── Asset Detail 模态框（Sprint 4.2）──────────────────────── */
        .asset-detail-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 1600;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .asset-detail-overlay.show { display: flex; }
        .asset-detail-modal {
            background: rgba(20, 22, 38, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 480px; max-width: 92vw;
            max-height: 92vh; overflow-y: auto;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            animation: detail-modal-in 0.25s ease-out;
        }
        @keyframes detail-modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .asset-detail-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px 0;
        }
        .asset-detail-header h3 {
            font-size: 17px; font-weight: 600; color: #fff;
            letter-spacing: 0.5px;
        }
        .asset-detail-close {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: all 0.2s;
        }
        .asset-detail-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .asset-detail-preview {
            margin: 16px 24px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex; align-items: center; justify-content: center;
            min-height: 240px;
            max-height: 360px;
        }
        .asset-detail-preview img {
            width: 100%; max-height: 360px; object-fit: contain;
            display: block;
        }
        .asset-detail-preview .preview-icon {
            font-size: 72px; color: rgba(255, 255, 255, 0.15);
        }
        .asset-detail-body {
            padding: 0 24px 20px;
        }
        .asset-detail-meta-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-bottom: 16px;
        }
        .asset-detail-meta-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px; padding: 12px 14px;
        }
        .asset-detail-meta-item .meta-label {
            font-size: 11px; color: rgba(255, 255, 255, 0.45);
            margin-bottom: 6px; letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .asset-detail-meta-item .meta-value {
            font-size: 13px; color: rgba(255, 255, 255, 0.85);
            font-weight: 500; word-break: break-all;
        }
        .asset-detail-name-row {
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .asset-detail-name-row .meta-label {
            font-size: 11px; color: rgba(255, 255, 255, 0.45);
            margin-bottom: 4px; letter-spacing: 0.5px;
        }
        .asset-detail-name-row .meta-value {
            font-size: 14px; color: #fff; font-weight: 500;
            word-break: break-all;
        }
        .asset-detail-usage {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.08));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px; margin-bottom: 16px;
        }
        .asset-detail-usage-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff; flex-shrink: 0;
        }
        .asset-detail-usage-text {
            font-size: 13px; color: rgba(255, 255, 255, 0.75);
        }
        .asset-detail-usage-text strong {
            color: #fff; font-size: 16px;
        }
        /* ─── Sprint 4.3: 创作历史 ─────────────────────────── */
        .asset-detail-history {
            margin-top: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }
        .asset-detail-history-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
        }
        .asset-detail-history-title i {
            color: var(--primary-light);
        }
        .asset-detail-history-subtitle {
            font-size: 12px; color: rgba(255, 255, 255, 0.5);
            margin-bottom: 14px;
        }
        .asset-detail-history-subtitle strong {
            color: #a5b4fc;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .history-item:last-child { margin-bottom: 0; }
        .history-item:hover {
            border-color: rgba(99, 102, 241, 0.25);
        }
        .history-item-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 6px;
        }
        .history-item-name {
            font-size: 14px; font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            display: flex; align-items: center; gap: 6px;
        }
        .history-item-name .task-icon {
            font-size: 16px; color: var(--primary-light);
        }
        .history-item-status {
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
            font-weight: 500;
        }
        .history-status-success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
        .history-status-processing {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }
        .history-status-pending {
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
        }
        .history-status-failed {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }
        .history-item-meta {
            font-size: 11px; color: rgba(255, 255, 255, 0.45);
            margin-bottom: 4px;
        }
        .history-item-prompt {
            font-size: 12px; color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 10px;
            border-radius: 6px;
            line-height: 1.5;
            max-height: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 6px;
        }
        .history-item-action {
            margin-top: 8px;
            text-align: right;
        }
        .history-item-action .btn-view-work {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item-action .btn-view-work:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
            color: #c4b5fd;
        }
        .history-empty {
            text-align: center; padding: 20px;
            color: rgba(255, 255, 255, 0.4); font-size: 13px;
        }

        .asset-detail-actions {
            display: flex; gap: 10px;
        }
        .asset-detail-actions .btn {
            flex: 1; justify-content: center; padding: 10px 0;
            font-size: 13px; border-radius: 10px;
        }
        .asset-detail-actions .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
        }
        .asset-detail-actions .btn-copy:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .asset-detail-actions .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }
        .asset-detail-actions .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .asset-detail-loading {
            text-align: center; padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }
        .asset-detail-loading .spinner {
            width: 32px; height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        /* ─── Sprint 4.4 Patch6: 独立图片预览 Modal ──────────── */
        .image-preview-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none; align-items: center; justify-content: center;
            z-index: 1700;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .image-preview-overlay.show { display: flex; }
        .image-preview-container {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            max-width: 94vw; max-height: 94vh;
            animation: detail-modal-in 0.2s ease-out;
        }
        .image-preview-close {
            position: absolute; top: -44px; right: -4px;
            width: 36px; height: 36px; border-radius: 9px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.2s;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .image-preview-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .image-preview-body {
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; overflow: hidden;
        }
        .image-preview-body img {
            max-width: 90vw; max-height: 90vh;
            object-fit: contain;
            display: block;
            border-radius: 8px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
        }
        .image-preview-error {
            text-align: center; padding: 60px 40px;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(20, 22, 38, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .image-preview-error i {
            font-size: 48px; display: block; margin-bottom: 14px;
            opacity: 0.35;
        }

        /* ─── Sprint 4.4: 资产状态标签 ────────────────────────── */
        .asset-status-tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 600;
            white-space: nowrap;
            margin-top: 4px;
        }
        .asset-status-tag.raw { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
        .asset-status-tag.processing { background: rgba(245, 158, 11, 0.2); color: #fbbf24; animation: statusPulse 2s ease-in-out infinite; }
        .asset-status-tag.generated { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .asset-status-tag.archived { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .asset-gen-count {
            font-size: 10px; color: var(--text-muted);
            margin-top: 2px;
        }
        .asset-gen-count strong { color: var(--primary-light); }

        /* ─── Sprint 4.4: AI创作 Panel 模态框 ──────────────── */
        .gen-panel-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .gen-panel-overlay.show { display: flex; }
        .gen-panel-modal {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 90%; max-width: 680px; max-height: 85vh;
            overflow-y: auto;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(99, 102, 241, 0.1);
        }
        .gen-panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gen-panel-header h3 {
            font-size: 16px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
        }
        .gen-panel-header h3 i { color: var(--accent-purple); font-size: 18px; }
        .gen-panel-close {
            width: 32px; height: 32px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05); color: #fff;
            border-radius: 50%; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .gen-panel-close:hover { background: rgba(255, 255, 255, 0.12); }

        .gen-panel-body { padding: 24px; }
        .gen-panel-section { margin-bottom: 20px; }
        .gen-panel-section label {
            display: block; font-size: 13px; font-weight: 500;
            margin-bottom: 8px; color: rgba(255, 255, 255, 0.85);
        }
        .gen-panel-section label .hint { font-weight: 400; color: var(--text-muted); font-size: 11px; }

        /* 参考素材预览卡片 */
        .gen-source-card {
            display: flex; gap: 12px; align-items: center;
            padding: 12px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gen-source-card-thumb {
            width: 64px; height: 64px; border-radius: 8px;
            object-fit: cover; flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
        }
        .gen-source-card-info { flex: 1; min-width: 0; }
        .gen-source-card-name {
            font-size: 13px; font-weight: 500; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .gen-source-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* prompt textarea */
        .gen-prompt-textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; font-size: 13px; font-family: inherit;
            resize: vertical; min-height: 80px;
            transition: border-color 0.2s;
        }
        .gen-prompt-textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .gen-prompt-counter { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* 模型选择卡片 */
        .gen-model-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .gen-model-card {
            padding: 14px 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .gen-model-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .gen-model-card.selected {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.12);
        }
        .gen-model-card-icon { font-size: 22px; margin-bottom: 4px; }
        .gen-model-card-name { font-size: 14px; font-weight: 600; }
        .gen-model-card-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        /* 输出类型选择器 */
        .gen-output-type-row { display: flex; gap: 10px; }
        .gen-output-type-btn {
            flex: 1; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #fff; cursor: pointer; text-align: center;
            font-size: 14px; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .gen-output-type-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .gen-output-type-btn.selected {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.12);
        }

        .gen-panel-footer {
            padding: 16px 24px; border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .gen-panel-footer .btn { padding: 10px 24px; border-radius: 10px; }

        /* ─── Sprint 4.4: Generation Timeline ──────────────── */
        .gen-timeline {
            display: flex; align-items: center; gap: 0;
            padding: 24px 20px; margin: 16px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
        }
        .gen-timeline-step {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; flex-shrink: 0;
            position: relative;
        }
        .gen-timeline-dot {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }
        .gen-timeline-step.active .gen-timeline-dot {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-purple);
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.3);
        }
        .gen-timeline-step.done .gen-timeline-dot {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        .gen-timeline-step.failed .gen-timeline-dot {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        .gen-timeline-label {
            font-size: 11px; color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }
        .gen-timeline-step.active .gen-timeline-label { color: var(--accent-purple); }
        .gen-timeline-step.done .gen-timeline-label { color: var(--success); }
        .gen-timeline-step.failed .gen-timeline-label { color: var(--danger); }
        .gen-timeline-line {
            width: 40px; height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 12px 24px; flex-shrink: 0;
        }
        .gen-timeline-line.done { background: var(--success); }

        /* ─── Sprint 4.4: 资产详情 AI作品区域 ──────────────── */
        .asset-detail-ai-works {
            margin-top: 16px; padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .asset-detail-ai-works-title {

        .template-cards {

        .template-card {

                grid-template-columns: repeat(2, 1fr);

        // ===================================================
        //  Sprint 3.3.2: 我的作品页面
        // ===================================================

        // ─── 常量映射 ──────────────────────────────────────
        var TASKTYPE_MAP = {
            'image2video': '图片动态化',
            'text2video': '宣传视频生成',
            'text2image': '商业图片生成',
            'image_edit': '图片智能编辑',
            'ref2video': '图片动态化',
            'digital_human': '数字人口播',
            'video_extend': '视频扩展',
            'video_style_transfer': '视频风格转换'
        };

        var WORKS_STATUS_MAP = {
            'success': '生成完成',
            'processing': '生成中',
            'pending': '等待生成',
            'failed': '生成失败'
        };

        // ─── 页面状态 ──────────────────────────────────────
        var WORKS_STATE = {
            currentPage: 1,
            total: 0,
            pageSize: 20,
            items: [],
            isLoading: false
        };

        // ─── 格式化函数 ────────────────────────────────────
        function formatTaskType(taskType) {
            return TASKTYPE_MAP[taskType] || 'AI视频';
        }

        function formatWorkStatus(status) {
            return WORKS_STATUS_MAP[status] || status;
        }

        function formatWorkDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var h = String(d.getHours()).padStart(2, '0');
            var min = String(d.getMinutes()).padStart(2, '0');
            return y + '-' + m + '-' + day + ' ' + h + ':' + min;
        }

        function formatDuration(seconds) {
            if (!seconds && seconds !== 0) return '';
            if (seconds < 60) return seconds + 's';
            var m = Math.floor(seconds / 60);
            var s = seconds % 60;
            return m + 'm' + (s > 0 ? s + 's' : '');
        }

        // ─── 渲染页面骨架 ──────────────────────────────────
        function renderMyWorks() {
            return '<div class="page-header">' +
                '<h3 style="font-size:18px;font-weight:700"><i class="fas fa-film" style="margin-right:8px;color:var(--primary-light)"></i>我的作品</h3>' +
                '<p style="font-size:13px;color:var(--text-sub);margin-top:4px">查看和管理您的AI生成视频作品</p>' +
                '</div>' +
                '<div id="worksContent" class="loading-skeleton">' +
                '<i class="fas fa-spinner fa-pulse"></i> 加载中...' +
                '</div>' +
                '<div id="worksPagination"></div>';
        }

        // ─── 加载作品列表 ──────────────────────────────────
        async function loadMyWorks(page) {
            if (WORKS_STATE.isLoading) return;
            WORKS_STATE.isLoading = true;
            WORKS_STATE.currentPage = page;

            var contentEl = document.getElementById('worksContent');
            var paginationEl = document.getElementById('worksPagination');

            if (!contentEl) return;

            contentEl.innerHTML = '<div class="loading-skeleton"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>';
            if (paginationEl) paginationEl.innerHTML = '';

            try {
                var data = await YuJianAPI.get('/enterprise/video-generation/tasks?page=' + page + '&pageSize=' + WORKS_STATE.pageSize);
                // API returns { total, page, pageSize, items: [...] }
                WORKS_STATE.total = data.total || 0;
                WORKS_STATE.items = data.items || [];
                WORKS_STATE.pageSize = data.pageSize || 20;

                if (!WORKS_STATE.items.length) {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-film"></i>' +
                        '<p>暂无作品</p>' +
                        '<p class="sub-text">使用AI生成功能创建您的第一个视频作品</p>' +
                        '</div>';
                } else {
                    contentEl.innerHTML = '<div class="works-grid">' +
                        WORKS_STATE.items.map(renderWorkCard).join('') +
                        '</div>';
                }

                renderPagination(paginationEl);

            } catch (err) {
                console.error('[MyWorks] 加载作品列表失败:', err);
                if (err.status === 401) {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-lock"></i>' +
                        '<p>登录已过期</p>' +
                        '<p class="sub-text">请刷新页面重新登录</p>' +
                        '</div>';
                } else {
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-exclamation-circle"></i>' +
                        '<p>加载失败，请稍后重试</p>' +
                        '<p class="sub-text"><button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + page + ')" style="margin-top:12px">重新加载</button></p>' +
                        '</div>';
                }
            } finally {
                WORKS_STATE.isLoading = false;
            }
        }

        // ─── 渲染单个作品卡片 ──────────────────────────────
        function renderWorkCard(item) {
            var typeLabel = formatTaskType(item.taskType);
            var statusLabel = formatWorkStatus(item.status);
            var dateStr = formatWorkDate(item.createdAt);
            var promptText = item.prompt || '';
            var escapedPrompt = escapeHtml(promptText);
            var durationStr = formatDuration(item.duration);
            // Sprint 5.6: 优先使用签名 playUrl，私有Bucket播放需要签名URL
            var videoPlayUrl = item.playUrl || item.videoUrl || '';
            var hasVideo = videoPlayUrl && item.status === 'success';
            var hasThumb = item.thumbnailUrl || item.coverUrl;
            var thumbUrl = hasThumb || '';

            var thumbHtml = hasThumb
                ? '<img src="' + escapeHtml(thumbUrl) + '" alt="缩略图" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-image no-thumb\\\'></i>\'">'
                : '<i class="fas fa-image no-thumb"></i>';

            var playOverlayHtml = hasVideo
                ? '<div class="play-overlay"><i class="fas fa-play-circle"></i></div>'
                : '';

            var actionsHtml = '';
            if (hasVideo) {
                // Sprint 5.8: 延迟解析播放URL，点击时才调用 getPlayUrl
                actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();playWorkVideo(\'' +
                    item.id + '\', \'' + escapeHtml(promptText || 'AI视频') + '\')" title="播放">' +
                    '<i class="fas fa-play"></i></button>';
            }
            actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();showWorkDetail(\'' +
                item.id + '\')" title="详情"><i class="fas fa-info-circle"></i></button>';
            actionsHtml += '<button class="btn btn-outline btn-sm-icon" onclick="event.stopPropagation();deleteWork(\'' +
                item.id + '\', \'' + escapeHtml(promptText || 'AI视频') + '\')" title="删除" style="color:var(--danger)">' +
                '<i class="fas fa-trash"></i></button>';

            var thumbClickAttr = hasVideo
                ? ' onclick="playWorkVideo(\'' + item.id + '\', \'' + escapeHtml(promptText || 'AI视频') + '\')"'
                : '';

            return '<div class="work-card">' +
                '<div class="work-thumb"' + thumbClickAttr + '>' +
                thumbHtml +
                playOverlayHtml +
                '</div>' +
                '<div class="work-info">' +
                (escapedPrompt ? '<div class="prompt-text" title="' + escapedPrompt + '">' + escapedPrompt + '</div>' : '') +
                '<div class="work-badges">' +
                '<span class="work-type-badge">' + escapeHtml(typeLabel) + '</span>' +
                '<span class="work-status-badge status-' + (item.status || '') + '">' + escapeHtml(statusLabel) + '</span>' +
                '</div>' +
                '<div class="work-meta-row">' +
                '<span>' + (durationStr ? '<i class="far fa-clock" style="margin-right:3px"></i>' + durationStr + ' · ' : '') + dateStr + '</span>' +
                '</div>' +
                '<div class="work-actions">' + actionsHtml + '</div>' +
                '</div>' +
                '</div>';
        }

        // ─── 渲染分页 ──────────────────────────────────────
        function renderPagination(container) {
            if (!container) return;
            var total = WORKS_STATE.total;
            var page = WORKS_STATE.currentPage;
            var pageSize = WORKS_STATE.pageSize;
            var totalPages = Math.ceil(total / pageSize);

            if (total <= pageSize) {
                container.innerHTML = total > 0
                    ? '<div class="pagination-bar"><span class="page-info">共 ' + total + ' 个作品</span></div>'
                    : '';
                return;
            }

            var prevBtn = page > 1
                ? '<button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + (page - 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})"><i class="fas fa-chevron-left"></i> 上一页</button>'
                : '<button class="btn btn-outline btn-sm" disabled><i class="fas fa-chevron-left"></i> 上一页</button>';

            var nextBtn = page < totalPages
                ? '<button class="btn btn-outline btn-sm" onclick="loadMyWorks(' + (page + 1) + ');window.scrollTo({top:0,behavior:\'smooth\'})">下一页 <i class="fas fa-chevron-right"></i></button>'
                : '<button class="btn btn-outline btn-sm" disabled>下一页 <i class="fas fa-chevron-right"></i></button>';

            container.innerHTML = '<div class="pagination-bar">' +
                prevBtn +
                '<span class="page-info">第 ' + page + ' / ' + totalPages + ' 页，共 ' + total + ' 个作品</span>' +
                nextBtn +
                '</div>';
        }

        // ─── 删除作品 ──────────────────────────────────────
        async function deleteWork(taskId, title) {
            var displayTitle = decodeURIComponent(title || '该作品');
            if (!confirm('确定要删除「' + displayTitle + '」吗？\n\n作品将从列表隐藏。')) {
                return;
            }

            try {
                await YuJianAPI.request('/enterprise/video-generation/tasks/' + taskId, { method: 'DELETE' });
                showToast('删除成功', 'success');
                // 刷新当前页
                loadMyWorks(WORKS_STATE.currentPage);
            } catch (err) {
                console.error('[MyWorks] 删除失败:', err);
                if (err.status === 401) {
                    showToast('登录已过期，请刷新页面重新登录', 'error');
                } else if (err.status === 404) {
                    showToast('作品不存在或已删除', 'warning');
                    loadMyWorks(WORKS_STATE.currentPage);
                } else {
                    showToast('删除失败，请稍后重试', 'error');
                }
            }
        }

        // ─── 作品详情（简易弹窗）───────────────────────────
        async function showWorkDetail(taskId) {
            try {
                var task = await YuJianAPI.get('/enterprise/video-generation/tasks/' + taskId);
                var typeLabel = formatTaskType(task.taskType);
                var statusLabel = formatWorkStatus(task.status);
                var dateStr = formatWorkDate(task.createdAt);
                var durationStr = formatDuration(task.duration);
                var promptText = task.prompt || '无';
                // Sprint 5.6: 优先使用签名 playUrl
                var videoPlayUrl = task.playUrl || task.videoUrl || '';

                var content = '<div style="display:flex;flex-direction:column;gap:12px;font-size:13px">' +
                    '<div><strong style="color:var(--text-sub)">创作类型：</strong>' + escapeHtml(typeLabel) + '</div>' +
                    '<div><strong style="color:var(--text-sub)">状态：</strong>' + escapeHtml(statusLabel) + '</div>' +
                    (durationStr ? '<div><strong style="color:var(--text-sub)">时长：</strong>' + durationStr + '</div>' : '') +
                    '<div><strong style="color:var(--text-sub)">创建时间：</strong>' + dateStr + '</div>' +
                    '<div><strong style="color:var(--text-sub)">提示词：</strong></div>' +
                    '<div style="background:rgba(255,255,255,0.04);padding:10px;border-radius:6px;line-height:1.6;max-height:120px;overflow-y:auto">' +
                    escapeHtml(promptText) + '</div>' +
                    (videoPlayUrl ? '<div style="margin-top:4px"><button class="btn btn-primary btn-sm" onclick="closeModal();playWorkVideo(\'' +
                        taskId + '\', \'' + escapeHtml(promptText) + '\')"><i class="fas fa-play"></i> 播放视频</button></div>' : '') +
                    '</div>';

                openModal('作品详情', encodeURIComponent(content));
            } catch (err) {
                console.error('[MyWorks] 获取详情失败:', err);
                if (err.status === 401) {
                    showToast('登录已过期，请刷新页面重新登录', 'error');
                } else if (err.status === 404) {
                    showToast('作品不存在或已删除', 'warning');
                } else {
                    showToast('获取详情失败，请稍后重试', 'error');
                }
            }
        }

        // ─── 视频播放器 ────────────────────────────────────
        function playVideo(videoUrl, title) {
            var decodedTitle = decodeURIComponent(title || '视频播放');

            // 移除已有播放器
            var existing = document.getElementById('videoPlayerOverlay');
            if (existing) existing.parentNode.removeChild(existing);

            var overlay = document.createElement('div');
            overlay.id = 'videoPlayerOverlay';
            overlay.className = 'video-player-overlay';
            overlay.innerHTML =
                '<div class="video-player-container" onclick="event.stopPropagation()">' +
                '<div class="video-player-header">' +
                '<h4 title="' + escapeHtml(decodedTitle) + '">' + escapeHtml(decodedTitle.length > 30 ? decodedTitle.substring(0, 30) + '...' : decodedTitle) + '</h4>' +
                '<button class="video-player-close" onclick="closeVideoPlayer()" title="关闭">' +
                '<i class="fas fa-times"></i></button>' +
                '</div>' +
                '<video id="workVideoPlayer" controls autoplay playsinline>' +
                '<source src="' + escapeHtml(videoUrl) + '" type="video/mp4">' +
                '您的浏览器不支持视频播放</video>' +
                '<div class="video-player-controls">' +
                '<button onclick="var v=document.getElementById(\'workVideoPlayer\');if(v)v.requestFullscreen()">' +
                '<i class="fas fa-expand"></i> 全屏</button>' +
                '<button onclick="closeVideoPlayer()"><i class="fas fa-times"></i> 关闭</button>' +
                '</div>' +
                '</div>';

            // 点击背景关闭
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeVideoPlayer();
            });

            document.body.appendChild(overlay);

            // ESC 关闭
            var escHandler = function (e) {
                if (e.key === 'Escape') {
                    closeVideoPlayer();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);

            // 开始播放
            setTimeout(function () {
                var video = document.getElementById('workVideoPlayer');
                if (video) {
                    video.play().catch(function () {
                        // autoplay blocked, controls are shown
                    });
                }
            }, 100);
        }

        function closeVideoPlayer() {
            var overlay = document.getElementById('videoPlayerOverlay');
            if (overlay) {
                var video = document.getElementById('workVideoPlayer');
                if (video) {
                    video.pause();
                    video.src = '';
                }
                overlay.parentNode.removeChild(overlay);
            }
        }

        // ─── Sprint 5.8: 延迟解析视频播放URL ──────────────────
        /**
         * 通过任务ID获取签名播放URL后播放视频
         * 替代直接使用 task.playUrl（可能已过期）的模式
         *
         * @param {string|number} taskId - 生成任务ID
         * @param {string} title - 视频标题
         */
        async function playWorkVideo(taskId, title) {
            var decodedTitle = decodeURIComponent(title || '视频播放');
            try {
                // 获取任务详情以拿到 outputAsset
                var task = await YuJianAPI.get('/enterprise/video-generation/tasks/' + taskId);
                var outputAsset = task.outputAsset;
                if (outputAsset && outputAsset.id) {
                    var playUrl = await resolveAssetPlayableUrl({
                        id: outputAsset.id,
                        type: 'video',
                        url: outputAsset.url || task.output_url
                    });
                    if (playUrl) {
                        playVideo(playUrl, decodedTitle);
                        return;
                    }
                }
                // 降级：使用任务中的 playUrl
                var fallbackUrl = task.playUrl || task.videoUrl || task.output_url || '';
                if (fallbackUrl) {
                    playVideo(fallbackUrl, decodedTitle);
                } else {
                    showToast('视频资源不可用', 'error');
                }
            } catch (err) {
                console.error('[playWorkVideo] 获取播放URL失败:', err);
                showToast('获取播放链接失败，请稍后重试', 'error');
            }
        }

        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', function() {

                if (page) navigateTo(page);
            });
        });

        // Sprint Stable: 页面状态持久化 — 恢复上次访问的页面，而非总是返回首页
        var restoredPage = (typeof PageState !== 'undefined' && PageState.restore) ? PageState.restore() : 'dashboard';
        render(restoredPage);

        // 响应式侧栏
        window.addEventListener('resize', () => {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth < 1024) {
                sidebar.style.width = '72px';
            } else {
                sidebar.style.width = 'var(--sidebar-width)';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {

                    closeStoryboard();

        // ===================================================
        //  图生视频闭环集成代码
        // ===================================================

        // ─── 全局状态 ──────────────────────────────────────
        const I2V_STATE = {
            selectedFile: null,      // 当前选中的 File
            previewUrl: null,        // 本地预览 ObjectURL
            uploadedImageUrl: null,  // OSS 上传后的 URL
            assetId: null,           // Asset 记录 ID
            currentTaskId: null,     // 当前任务本地 ID
            currentAbortController: null,
            isUploading: false,
            isGenerating: false,
            // Sprint 3.2: 页面状态机
            // idle → creating → processing → success/failed
            pageState: 'idle',       // idle | creating | processing | success | failed
            // Sprint 4.2: 资产选择模式
            selectedAsset: null,     // 从AssetPicker选择的资产 { id, name, url, thumbnailUrl, type }
            sourceMode: 'upload'     // 'upload' | 'asset' — 素材来源模式
        };

        // ═══════════════════════════════════════════════════════════
        //  AssetPicker — 资产选择器（Sprint 4.2）
        // ═══════════════════════════════════════════════════════════
        const ASSET_PICKER = {
            assets: [],              // 当前加载的资产列表
            selectedAsset: null,     // 当前选中的资产
            currentPage: 1,
            pageSize: 20,
            total: 0,
            currentType: '',         // 当前筛选类型
            callback: null           // 确认回调
        };

        /**
         * 打开 AssetPicker
         * @param {object} options — { type?: string, callback?: Function }
         */
        function openAssetPicker(options) {
            options = options || {};
            ASSET_PICKER.callback = options.callback || null;
            ASSET_PICKER.selectedAsset = null;
            ASSET_PICKER.currentPage = 1;
            ASSET_PICKER.currentType = options.type || 'image';

            // 重置筛选按钮
            var filters = document.querySelectorAll('.asset-picker-filter');
            filters.forEach(function (f) {
                var ft = f.getAttribute('data-type');
                f.classList.toggle('active', ft === ASSET_PICKER.currentType);
            });

            if (overlay) overlay.classList.add('show');

            updateAssetPickerSelection();
