        /**
         * 关闭 AssetPicker
         */
        function closeAssetPicker() {
            var overlay = document.getElementById('assetPickerOverlay');
            if (overlay) overlay.classList.remove('show');
            ASSET_PICKER.callback = null;
        }

        // 点击遮罩关闭
        (function bindAssetPickerOverlayClick() {
            document.addEventListener('click', function (e) {
                if (e.target && e.target.id === 'assetPickerOverlay') {
                    closeAssetPicker();
                }
            });
        })();

        /**
         * 筛选资产类型
         */
        function filterAssetPicker(btn, type) {
            // 更新激活态
            var filters = document.querySelectorAll('.asset-picker-filter');
            filters.forEach(function (f) { f.classList.remove('active'); });
            if (btn) btn.classList.add('active');

            ASSET_PICKER.currentType = type;
            ASSET_PICKER.currentPage = 1;
            ASSET_PICKER.selectedAsset = null;
            updateAssetPickerSelection();
            loadAssetPickerAssets();
        }

        /**
         * 加载资产列表
         */
        async function loadAssetPickerAssets() {
            var body = document.getElementById('assetPickerBody');
            if (!body) return;

            body.innerHTML = '<div class="asset-picker-loading"><div class="spinner"></div><div>加载中...</div></div>';

            try {
                var params = '?page=' + ASSET_PICKER.currentPage + '&pageSize=' + ASSET_PICKER.pageSize;
                if (ASSET_PICKER.currentType) {
                    params += '&type=' + encodeURIComponent(ASSET_PICKER.currentType);
                }

                var result = await YuJianAPI.get('/enterprise/assets' + params);
                // result = { items, total, page, pageSize }

                ASSET_PICKER.assets = result.items || [];
                ASSET_PICKER.total = result.total || 0;

                if (ASSET_PICKER.assets.length === 0) {
                    body.innerHTML = '<div class="asset-picker-empty"><i class="fas fa-inbox"></i><div>暂无素材</div><div style="font-size:12px;margin-top:4px">请先在资产中心上传素材</div></div>';
                } else {
                    renderAssetPickerItems();
                }

                renderAssetPickerPagination();
            } catch (err) {
                console.error('[AssetPicker] 加载资产失败:', err);
                body.innerHTML = '<div class="asset-picker-empty"><i class="fas fa-exclamation-circle"></i><div>加载失败</div><div style="font-size:12px;margin-top:4px">' + (err.message || '请重试') + '</div></div>';
            }
        }

        /**
         * 渲染资产列表项
         */
        function renderAssetPickerItems() {
            var body = document.getElementById('assetPickerBody');
            if (!body) return;

            var html = '';
            ASSET_PICKER.assets.forEach(function (asset) {
                var isSelected = ASSET_PICKER.selectedAsset && ASSET_PICKER.selectedAsset.id === asset.id;
                var thumbUrl = asset.thumbnailUrl || asset.url || '';
                var typeIcon = asset.type === 'video' ? '<i class="fas fa-video" style="position:absolute;bottom:4px;right:4px;font-size:10px;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;color:#fff"></i>' : '';

                html += '<div class="asset-picker-item' + (isSelected ? ' selected' : '') + '" onclick="selectAssetPickerItem(' + asset.id + ')" data-asset-id="' + asset.id + '">';
                html += '<div class="asset-picker-item-thumb" style="position:relative">';
                if (thumbUrl) {
                    html += '<img src="' + escapeHtml(thumbUrl) + '" alt="' + escapeHtml(asset.name || '') + '" loading="lazy">';
                } else {
                    html += '<div class="no-thumb"><i class="fas fa-' + (asset.type === 'video' ? 'video' : 'image') + '"></i></div>';
                }
                html += typeIcon;
                html += '</div>';
                html += '<div class="asset-picker-item-info">';
                html += '<div class="asset-picker-item-name" title="' + escapeHtml(asset.name || '未命名') + '">' + escapeHtml(asset.name || '未命名') + '</div>';
                html += '</div>';
                html += '</div>';
            });

            body.innerHTML = html;
        }

        /**
         * 选择资产
         */
        function selectAssetPickerItem(assetId) {
            var asset = ASSET_PICKER.assets.find(function (a) { return a.id === assetId; });
            if (!asset) return;

            ASSET_PICKER.selectedAsset = asset;

            // 更新选中态
            var items = document.querySelectorAll('.asset-picker-item');
            items.forEach(function (item) {
                var id = parseInt(item.getAttribute('data-asset-id'));
                item.classList.toggle('selected', id === assetId);
            });

            updateAssetPickerSelection();
        }

        /**
         * 更新选中提示
         */
        function updateAssetPickerSelection() {
            var info = document.getElementById('assetPickerSelectedInfo');
            var btn = document.getElementById('assetPickerConfirmBtn');

            if (ASSET_PICKER.selectedAsset) {
                if (info) info.innerHTML = '已选择：<span class="asset-picker-selected-name">' + escapeHtml(ASSET_PICKER.selectedAsset.name || '未命名') + '</span>';
                if (btn) btn.disabled = false;
            } else {
                if (info) info.textContent = '未选择素材';
                if (btn) btn.disabled = true;
            }
        }

        /**
         * 渲染分页
         */
        function renderAssetPickerPagination() {
            var container = document.getElementById('assetPickerPagination');
            if (!container) return;

            var totalPages = Math.ceil(ASSET_PICKER.total / ASSET_PICKER.pageSize);
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            var html = '';
            html += '<button class="btn btn-sm btn-outline" onclick="goAssetPickerPage(' + (ASSET_PICKER.currentPage - 1) + ')"' + (ASSET_PICKER.currentPage <= 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i></button>';
            html += '<span>' + ASSET_PICKER.currentPage + ' / ' + totalPages + '</span>';
            html += '<button class="btn btn-sm btn-outline" onclick="goAssetPickerPage(' + (ASSET_PICKER.currentPage + 1) + ')"' + (ASSET_PICKER.currentPage >= totalPages ? ' disabled' : '') + '><i class="fas fa-chevron-right"></i></button>';
            container.innerHTML = html;
        }

        /**
         * 翻页
         */
        function goAssetPickerPage(page) {
            var totalPages = Math.ceil(ASSET_PICKER.total / ASSET_PICKER.pageSize);
            if (page < 1 || page > totalPages) return;
            ASSET_PICKER.currentPage = page;
            ASSET_PICKER.selectedAsset = null;
            updateAssetPickerSelection();
            loadAssetPickerAssets();
        }

        /**
         * 确认选择
         */
        function confirmAssetPicker() {
            if (!ASSET_PICKER.selectedAsset) {
                showToast('请先选择一个素材', 'warning');
                return;
            }

            var asset = ASSET_PICKER.selectedAsset;

            // 设置 I2V 状态为资产模式
            clearImageSelection(); // 清理上传模式的状态

            I2V_STATE.sourceMode = 'asset';
            I2V_STATE.selectedAsset = asset;
            I2V_STATE.assetId = asset.id;
            I2V_STATE.selectedFile = null;
            I2V_STATE.uploadedImageUrl = asset.url; // 直接使用资产URL

            // 更新 UI
            showAssetPreview(asset);

            // 关闭弹层
            closeAssetPicker();

            // 触发回调
            if (typeof ASSET_PICKER.callback === 'function') {
                ASSET_PICKER.callback(asset);
            }

            showToast('已选择素材：' + (asset.name || '未命名'), 'success');
        }

        /**
         * 显示资产预览（替代上传预览）
         */
        function showAssetPreview(asset) {
            var thumbUrl = asset.thumbnailUrl || asset.url || '';

            // 隐藏上传区域，显示预览
            var container = document.getElementById('i2vPreviewContainer');
            var img = document.getElementById('i2vPreviewImage');
            var info = document.getElementById('i2vFileInfo');
            var uploadArea = document.getElementById('i2vUploadArea');

            if (container) container.style.display = 'block';
            if (img) img.src = thumbUrl;
            if (info) {
                var sizeStr = asset.size ? (asset.size / (1024 * 1024)).toFixed(2) + 'MB' : '';
                var dimStr = (asset.width && asset.height) ? (asset.width + '×' + asset.height) : '';
                info.textContent = (asset.name || '资产素材') + (sizeStr ? ' | ' + sizeStr : '') + (dimStr ? ' | ' + dimStr : '');
            }
            if (uploadArea) {
                uploadArea.classList.add('filled');
            }

            // 大图预览
            var largePreview = document.getElementById('i2vLargePreview');
            var placeholder = document.getElementById('i2vPreviewPlaceholder');
            if (largePreview) { largePreview.src = thumbUrl; largePreview.style.display = 'block'; }
            if (placeholder) placeholder.style.display = 'none';

            // 更新资产选择按钮样式
            var assetBtn = document.getElementById('refSourceAssetBtn');
            if (assetBtn) {
                assetBtn.classList.add('asset-selected');
                assetBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>' + (asset.name || '已选择').substring(0, 8) + '</span>';
            }

            // 清理结果区
            resetResultArea();
        }
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var icons = { error: 'fa-times-circle', success: 'fa-check-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + escapeHtml(message);
            container.appendChild(toast);
            setTimeout(function () {
                toast.classList.add('fade-out');
                setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // ─── 登录逻辑 ──────────────────────────────────────
        function showLogin() {
            var overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.classList.add('show');
        }

        function hideLogin() {
            var overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.classList.remove('show');
            document.getElementById('loginError').textContent = '';
            document.getElementById('loginPassword').value = '';
        }

        async function handleLogin() {
            var btn = document.getElementById('loginBtn');
            var phoneEl = document.getElementById('loginPhone');
            var passwordEl = document.getElementById('loginPassword');
            var errorEl = document.getElementById('loginError');

            var phone = (phoneEl.value || '').trim();
            var password = passwordEl.value || '';

            if (!phone) { errorEl.textContent = '请输入手机号'; return; }
            if (!password) { errorEl.textContent = '请输入密码'; return; }

            errorEl.textContent = '';
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                var result = await YuJianAuth.login({ phone: phone, password: password });
                hideLogin();
                showToast('登录成功，欢迎回来！', 'success');
                updateUserDisplay(result.userInfo);
                // 检查是否有待恢复的任务
                YuJianVideoTask.resumePendingTask({
                    onUpdate: function (t) { updateTaskStatusDisplay(t); },
                    onSuccess: function (t) { handleTaskSuccess(t); },
                    onFailed: function (t) { handleTaskFailed(t); }
                });
            } catch (err) {
                console.error('[Auth] 登录失败', err);
                errorEl.textContent = err.message || '登录失败，请重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        function updateUserDisplay(userInfo) {
            var name = (userInfo && userInfo.email) ? userInfo.email.split('@')[0] : '';
            var initial = name ? name[0].toUpperCase() : '用';
            // 更新侧边栏用户头像
            var userAvatars = document.querySelectorAll('.avatar-sm');
            userAvatars.forEach(function (el) { if (el) el.textContent = initial; });
        }

        // 页面加载时检查登录状态
        (function initAuth() {
            if (YuJianAuth.isAuthenticated()) {
                var userInfo = YuJianAuth.getUserInfo();
                if (userInfo) updateUserDisplay(userInfo);
                // 尝试恢复任务
                setTimeout(function () {
                    YuJianVideoTask.resumePendingTask({
                        onUpdate: function (t) { updateTaskStatusDisplay(t); },
                        onSuccess: function (t) { handleTaskSuccess(t); },
                        onFailed: function (t) { handleTaskFailed(t); }
                    });
                }, 500);
            }
        })();

        // ─── 拦截导航，确保登录 ────────────────────────────
        var _originalNavigateTo = navigateTo;
        navigateTo = function (page) {
            // 创作类页面需要登录
            var authPages = ['image2video', 'text2video', 'ref2video', 'digitalhuman', 'imageGen', 'assets'];
            if (authPages.indexOf(page) !== -1 && !YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');
                return;
            }
            _originalNavigateTo(page);
        };

        // ─── 图片选择 ──────────────────────────────────────
        async function handleImageSelect(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            // 清理旧预览
            clearImageSelection();

            // 校验
            var validation = await YuJianUpload.validateImage(file);
            if (!validation.valid) {
                showToast(validation.error, 'error');
                // 清理 input 以便重新选择同一文件
                event.target.value = '';
                return;
            }

            var meta = validation.meta;

            // 创建本地预览
            var preview = YuJianUpload.createPreview(file);
            I2V_STATE.selectedFile = file;
            I2V_STATE.previewUrl = preview.url;
            I2V_STATE.uploadedImageUrl = null;
            I2V_STATE.assetId = null;

            // 显示预览
            showImagePreview(preview.url, meta);
        }

        function showImagePreview(url, meta) {
            // 小图预览
            var container = document.getElementById('i2vPreviewContainer');
            var img = document.getElementById('i2vPreviewImage');
            var info = document.getElementById('i2vFileInfo');
            var uploadArea = document.getElementById('i2vUploadArea');
            var sourceLabel = document.getElementById('i2vSourceLabel');

            if (container) container.style.display = 'block';
            if (img) img.src = url;
            if (info && meta) {
                var sizeMB = (meta.size / (1024 * 1024)).toFixed(2);
                info.textContent = meta.name + ' | ' + sizeMB + 'MB | ' + meta.width + '×' + meta.height;
            }
            if (uploadArea) {
                uploadArea.classList.add('filled');
            }
            // Sprint 4.2: 显示来源标签
            if (sourceLabel) {
                sourceLabel.style.display = (I2V_STATE.sourceMode === 'asset') ? 'inline' : 'none';
            }

            // 大图预览
            var largePreview = document.getElementById('i2vLargePreview');
            var placeholder = document.getElementById('i2vPreviewPlaceholder');
            if (largePreview) { largePreview.src = url; largePreview.style.display = 'block'; }
            if (placeholder) placeholder.style.display = 'none';

            // 清理结果区（新图片意味着新任务）
            resetResultArea();
        }

        function clearImageSelection() {
            // 释放 ObjectURL
            if (I2V_STATE.previewUrl) {
                URL.revokeObjectURL(I2V_STATE.previewUrl);
                I2V_STATE.previewUrl = null;
            }
            I2V_STATE.selectedFile = null;

        // ─── 图生视频生成 ──────────────────────────────────
        async function handleGenerateImage2Video() {
            var btn = document.getElementById('i2vGenerateBtn');
            var btnText = document.getElementById('i2vGenerateText');
            var promptEl = document.getElementById('i2vPrompt');
            var modelEl = document.getElementById('i2vModel');
            var durationEl = document.getElementById('i2vDuration');

            // 检查登录
            if (!YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');
                return;
            }

            // Sprint 4.2: 检查是否有图片（上传模式或资产模式）
            if (I2V_STATE.sourceMode === 'asset') {
                if (!I2V_STATE.selectedAsset || !I2V_STATE.assetId) {
                    showToast('请先从资产库选择一张图片', 'warning');
                    return;
                }
            } else {
                if (!I2V_STATE.selectedFile) {
                    showToast('请先选择一张图片', 'warning');
                    return;
                }
            }

            // 检查提示词
            var prompt = promptEl ? (promptEl.value || '') : '';
            var promptCheck = YuJianVideoTask.validatePrompt(prompt);
            if (!promptCheck.valid) {
                showToast(promptCheck.error, 'warning');
                return;
            }

            // 禁用按钮，防止重复提交
            if (I2V_STATE.isGenerating || I2V_STATE.isUploading) return;
            I2V_STATE.isGenerating = true;
            setPageState('creating');
            if (btn) btn.disabled = true;
            if (btnText) btnText.textContent = '准备中...';

            // AbortController
            if (I2V_STATE.currentAbortController) {
                I2V_STATE.currentAbortController.abort();
            }
            I2V_STATE.currentAbortController = new AbortController();
            var signal = I2V_STATE.currentAbortController.signal;

            try {
                // Step 1: 上传图片（上传模式）或跳过（资产模式）
                if (I2V_STATE.sourceMode === 'asset') {
                    // 资产模式：直接使用已选择的 assetId，无需上传
                    console.log('[Image2Video] 资产模式，使用 assetId:', I2V_STATE.assetId);
                } else if (!I2V_STATE.uploadedImageUrl) {
                    // 上传模式：上传图片到 OSS
                    showStatus('uploading', '正在上传图片...', true);

                    var uploadResult = await YuJianUpload.uploadImage(I2V_STATE.selectedFile, {
                        onProgress: function (pct) {
                            var statusText = document.getElementById('i2vStatusText');
                            if (statusText) statusText.textContent = '正在上传图片 ' + pct + '%';
                        },
                        signal: signal
                    });

                    I2V_STATE.uploadedImageUrl = uploadResult.url;
                    I2V_STATE.assetId = uploadResult.assetId;
                    showStatus('uploading', '图片上传成功', false);
                }

                // Step 2: 创建图生视频任务（Sprint 3.1: 使用 sourceAssetId + 新接口）
                if (btnText) btnText.textContent = '提交任务中...';
                showStatus('processing', '正在提交生成任务...', true);

                var taskInput = {
                    sourceAssetId: I2V_STATE.assetId,
                    prompt: promptCheck.cleaned,
                    model: modelEl ? modelEl.value : 'happyhorse-i2v',
                    duration: durationEl ? parseInt(durationEl.value) : 5
                };

                var task = await YuJianVideoTask.createImageToVideoTask(taskInput, signal);
                I2V_STATE.currentTaskId = task.id || task.task_id;

                console.log('[Image2Video] 任务创建成功, taskId:', I2V_STATE.currentTaskId);

                // Step 3: 开始轮询
                setPageState('processing');
                if (btnText) btnText.textContent = '生成中...';
                showStatus('processing', '排队中，生成视频可能需要几十秒...', true);

                YuJianVideoTask.pollTaskStatus(I2V_STATE.currentTaskId, {
                    onUpdate: function (t) {
                        updateTaskStatusDisplay(t);
                        // 更新轮询进度提示
                        var pollCount = YuJianVideoTask.getPollCount();
                        var statusText = document.getElementById('i2vStatusText');
                        if (statusText && (t.status === 'pending' || t.status === 'processing')) {
                            var progressHint = '';
                            if (t.progress !== null && t.progress !== undefined) {
                                progressHint = '进度 ' + t.progress + '%';
                            } else {
                                progressHint = '正在处理中...';
                            }
                            statusText.textContent = progressHint + '（生成视频可能需要几十秒）';
                        }
                    },
                    onSuccess: function (t) { handleTaskSuccess(t); },
                    onFailed: function (t) { handleTaskFailed(t); },
                    onTimeout: function () {
                        setPageState('failed');
                        showStatus('error', '状态确认超时（已轮询60次），可稍后在任务记录中查看', false);
                        showToast('任务状态确认超时，可稍后在任务记录中查看结果', 'warning');
                        resetGenerateButton();
                    },
                    onError: function (err) {
                        console.error('[Image2Video] 查询出错', err);
                    }
                });

            } catch (err) {
                console.error('[Image2Video] 任务创建失败', err);
                setPageState('failed');
                if (err.name === 'AbortError' || err.code === 'ABORTED') {
                    showToast('操作已取消', 'info');
                } else {
                    showStatus('error', err.message || '任务创建失败', false);
                    showToast(err.message || '任务创建失败，请重试', 'error');
                }
                resetGenerateButton();
            }
        }

        function resetGenerateButton() {
            I2V_STATE.isGenerating = false;
            I2V_STATE.isUploading = false;
            // 只有在终态时才保持 pageState（success/failed 由各自的 handler 设置）
            if (I2V_STATE.pageState === 'creating' || I2V_STATE.pageState === 'processing') {
                I2V_STATE.pageState = 'idle';
            }
            var btn = document.getElementById('i2vGenerateBtn');
            var btnText = document.getElementById('i2vGenerateText');
            if (btn) btn.disabled = false;
            if (btnText) btnText.textContent = '让图片动起来';
        }

        // ─── 任务结果处理 ──────────────────────────────────
        async function handleTaskSuccess(task) {
            setPageState('success');
            resetGenerateButton();
            hideStatus();

            var resultArea = document.getElementById('i2vResultArea');
            var video = document.getElementById('i2vResultVideo');
            var errorDiv = document.getElementById('i2vResultError');
            var actions = document.getElementById('i2vResultActions');

            // Sprint 5.8: 通过 playUrl 接口获取签名播放 URL
            var videoUrl = null;
            var outputAssetId = task.outputAsset && task.outputAsset.id;

            if (outputAssetId) {
                try {
                    videoUrl = await resolveAssetPlayableUrl({
                        id: outputAssetId,
                        type: 'video',
                        url: task.outputAsset && task.outputAsset.url
                    });
                    console.log('[Image2Video] 使用签名 playUrl:', videoUrl);
                } catch (e) {
                    console.warn('[Image2Video] playUrl 解析失败，降级:', e.message);
                }
            }

            // 降级：使用 output_url
            if (!videoUrl && task.output_url) {
                videoUrl = task.output_url;
                console.log('[Image2Video] 使用 output_url（兼容模式）:', videoUrl);
            }

            if (!videoUrl) {
                // URL 为空
                setPageState('failed');
                showStatus('error', '任务完成但视频链接缺失', false);
                if (errorDiv) errorDiv.style.display = 'block';
                var errorTextEl = document.getElementById('i2vResultErrorText');
                if (errorTextEl) errorTextEl.textContent = '视频生成完成但链接为空，可能是服务端返回异常，请重试';
                if (actions) actions.style.display = 'none';
                showToast('视频链接缺失，请重试', 'error');
                return;
            }

            if (resultArea) resultArea.classList.add('show');
            if (video) {
                video.src = videoUrl;
                video.style.display = 'block';
                video.setAttribute('controlslist', 'nodownload');
                video.setAttribute('oncontextmenu', 'return false;');
                video.load();
            }

            // Sprint 3.2: 隐藏下载按钮，只保留重试
            if (actions) {
                actions.style.display = 'flex';
                var downloadBtn = document.getElementById('i2vDownloadBtn');
                if (downloadBtn) downloadBtn.style.display = 'none';
            }

            showStatus('success', '生成成功', false);
            showToast('视频生成成功！', 'success');

            console.log('[Image2Video] 任务完成, videoUrl:', videoUrl);
        }

        function handleTaskFailed(task) {
            setPageState('failed');
            resetGenerateButton();

            var resultArea = document.getElementById('i2vResultArea');
            var video = document.getElementById('i2vResultVideo');
            var errorDiv = document.getElementById('i2vResultError');
            var errorTextEl = document.getElementById('i2vResultErrorText');
            var actions = document.getElementById('i2vResultActions');

            var errorMsg = task.error_msg || '任务生成失败，请检查提示词或图片后重试';

            if (resultArea) resultArea.classList.add('show');
            if (video) video.style.display = 'none';
            if (errorDiv) errorDiv.style.display = 'block';
            if (errorTextEl) errorTextEl.textContent = errorMsg;
            if (actions) actions.style.display = 'none';

            showStatus('error', '生成失败', false);
            showToast(errorMsg, 'error');

            console.log('[Image2Video] 任务失败:', errorMsg);
        }

        var GEN_PANEL_STATE = {
            currentAsset: null,

            sourceAssetId: null,

        // ─── Sprint 4.4 Patch4: Asset 缓存（避免重复API查询）─────────
        var ASSET_CACHE = {};

        // ─── 打开AI创作Panel ────────────────────────────────
        // Sprint 4.4 Patch4: 支持传入 asset 对象或 assetId
        //   优先使用缓存/传入对象，避免重复API查询
        async function openGenPanel(assetOrId) {
            if (!YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');
                return;
            }

            var overlay = document.getElementById('genPanelOverlay');
            if (!overlay) return;

            // 重置状态
            resetGenPanel();

            // 显示加载态
            overlay.classList.add('show');
            document.getElementById('genSourceName').textContent = '加载中...';
            document.getElementById('genSourceMeta').textContent = '';
            document.getElementById('genSourceThumb').src = '';

            var asset = null;
            var assetId = null;

            // Sprint 4.4 Patch4: 解析参数
            if (typeof assetOrId === 'object' && assetOrId !== null && assetOrId.id) {
                // 传入的是 Asset 对象
                asset = assetOrId;
                assetId = asset.id;
            } else if (typeof assetOrId === 'string' || typeof assetOrId === 'number') {
                // 传入的是 assetId
                assetId = String(assetOrId);
                // 优先从缓存获取
                asset = ASSET_CACHE[assetId] || null;
            }

            // Sprint 4.4 Patch4: 设置统一状态
            if (assetId) {
                GEN_PANEL_STATE.assetId = assetId;
                GEN_PANEL_STATE.sourceAssetId = assetId;
            }

            if (asset) {
                // 已有 asset 数据，直接渲染
                GEN_PANEL_STATE.currentAsset = asset;
                GEN_PANEL_STATE.sourceAsset = asset;
                renderReferenceAssetInPanel(asset);
                return;
            }

            // 缓存未命中，需要通过API获取
            if (!assetId) {
                document.getElementById('genSourceName').textContent = '素材不可用';
                document.getElementById('genSourceMeta').textContent = '未选择素材';
                return;
            }

            try {
                asset = await YuJianAPI.get('/enterprise/assets/' + assetId);
                // 存入缓存
                ASSET_CACHE[assetId] = asset;
                GEN_PANEL_STATE.currentAsset = asset;
                GEN_PANEL_STATE.sourceAsset = asset;
                renderReferenceAssetInPanel(asset);
            } catch (err) {
                console.error('[GenPanel] 加载素材失败:', err);
                if (err.status === 404) {
                    document.getElementById('genSourceName').textContent = '素材不存在或已删除';
                } else {
                    document.getElementById('genSourceName').textContent = '素材不可用';
                }
                document.getElementById('genSourceMeta').textContent = '无法获取素材信息';
            }
        }

        // Sprint 4.4 Patch4: 渲染参考素材到Panel（提取为独立函数）
        function renderReferenceAssetInPanel(asset) {
            document.getElementById('genSourceName').textContent = asset.name || '未命名素材';
            var metaParts = [];
            var typeLabel = asset.typeLabel || (asset.type === 'image' ? '图片' : asset.type === 'video' ? '视频' : (asset.type || '--'));
            metaParts.push(typeLabel);
            var sizeStr = asset.size ? formatAssetSize(asset.size) : '';
            if (sizeStr) metaParts.push(sizeStr);
            document.getElementById('genSourceMeta').textContent = metaParts.join(' · ') || '--';

            var thumbUrl = asset.thumbnailUrl || asset.url || '';
            var thumbEl = document.getElementById('genSourceThumb');
            if (thumbUrl) {
                thumbEl.src = thumbUrl;
                thumbEl.style.display = '';
            } else {
                thumbEl.style.display = 'none';
            }

            // 聚焦 prompt 输入框
            setTimeout(function () {
                var promptEl = document.getElementById('genPrompt');
                if (promptEl) promptEl.focus();
            }, 200);
        }

        // ─── 重置时间线 ────────────────────────────────────
        function resetGenTimeline() {
            var steps = ['genStepSubmit', 'genStepProcess', 'genStepComplete', 'genStepView'];
            var lines = ['genLine1', 'genLine2', 'genLine3'];
            steps.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) { el.className = 'gen-timeline-step'; }
            });
            lines.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) { el.classList.remove('done'); }
            });
        }

        // ─── 更新生成时间线 ────────────────────────────────
        function updateGenTimeline(activeStep) {
            var timeline = document.getElementById('genTimelineContainer');
            if (timeline) timeline.style.display = 'block';

            var stepMap = { submit: 0, process: 1, complete: 2, view: 3 };
            var stepIds = ['genStepSubmit', 'genStepProcess', 'genStepComplete', 'genStepView'];
            var lineIds = ['genLine1', 'genLine2', 'genLine3'];
            var targetIdx = stepMap[activeStep] !== undefined ? stepMap[activeStep] : 0;

            for (var i = 0; i < stepIds.length; i++) {
                var el = document.getElementById(stepIds[i]);
                if (!el) continue;
                el.className = 'gen-timeline-step';
                if (i < targetIdx) el.classList.add('done');
                if (i === targetIdx) el.classList.add('active');
            }

            for (var j = 0; j < lineIds.length; j++) {
                var line = document.getElementById(lineIds[j]);
                if (!line) continue;
                if (j < targetIdx) line.classList.add('done');
                else line.classList.remove('done');
            }
        }

        // ─── 提交AI创作任务 ──────────────────────────────
        async function handleGenPanelSubmit() {
            if (GEN_PANEL_STATE.isSubmitting) return;
            if (!GEN_PANEL_STATE.assetId && !GEN_PANEL_STATE.sourceAssetId) {
                showToast('请先选择参考素材', 'warning');
                return;
            }

            var prompt = (document.getElementById('genPrompt').value || '').trim();
            if (!prompt) {
                showToast('请输入提示词', 'warning');
                return;
            }
            if (prompt.length > 2000) {

                var templateId = GEN_PANEL_STATE.selectedTemplate;

                var TEMPLATE_MAP = {
                    'image_to_video': { model: 'happyhorse-i2v', provider: 'aliyun' },

                var templateConfig = TEMPLATE_MAP[templateId] || TEMPLATE_MAP['image_to_video'];

                // 创建生成任务
                updateGenTimeline('process');
                submitText.textContent = '生成中...';

                        setTimeout(function () {
                            updateGenTimeline('view');
                            submitText.textContent = '生成完成';
                            submitBtn.disabled = false;

                            showToast('视频生成成功！', 'success');

                            // 在面板内显示结果
                            showGenResult(t);

                    },
                    onFailed: function (t) {
                        var stepComplete = document.getElementById('genStepComplete');
                        if (stepComplete) {
                            stepComplete.className = 'gen-timeline-step failed';

                        submitText.textContent = '生成失败';
                        submitBtn.disabled = false;
                        GEN_PANEL_STATE.isSubmitting = false;
                        showToast(t.error_msg || '生成失败，请重试', 'error');
                    },
                    onTimeout: function () {
                        submitText.textContent = '超时';
                        submitBtn.disabled = false;
                        GEN_PANEL_STATE.isSubmitting = false;
                        showToast('任务状态确认超时，可稍后在任务记录中查看', 'warning');
                    },
                    onError: function (err) {
                        console.error('[GenPanel] 轮询出错:', err);
                    }
                });

            } catch (err) {
                console.error('[GenPanel] 任务创建失败:', err);
                var stepComplete = document.getElementById('genStepComplete');
                if (stepComplete) {
                    stepComplete.className = 'gen-timeline-step failed';
                }
                submitBtn.disabled = false;
                submitText.textContent = '重试';
                GEN_PANEL_STATE.isSubmitting = false;

                if (err.name === 'AbortError' || err.code === 'ABORTED') {
                    showToast('操作已取消', 'info');
                } else {
                    showToast(err.message || '任务创建失败，请重试', 'error');
                }
            }

        //  Sprint 4.1: 资产中心
        // ===================================================

        // Sprint 4.4 Patch2: 恢复使用稳定的 Asset API，Workspace 统计异步解耦
        var ASSETS_STATE = {
            currentPage: 1,
            total: 0,
            pageSize: 20,
            items: [],
            currentType: '',
            currentKeyword: '',
            currentSort: 'newest',
            currentStatus: '',
            isLoading: false,
            searchTimer: null,
            // Sprint 4.4 Patch1: 页面状态管理
            pageState: 'loading',  // loading | success | empty | error
            errorMessage: ''

        // Sprint 4.4 Patch1: 页面状态常量
        var ASSET_PAGE_STATE = {
            LOADING: 'loading',
            SUCCESS: 'success',
            EMPTY: 'empty',
            ERROR: 'error'
        };

        // Sprint 4.4 Patch1: 安全请求封装（捕获网络/JSON/超时错误）
        function safeFetch(url, options) {
            var timeoutMs = (options && options.timeout) || 15000;
            return new Promise(function (resolve, reject) {
                var timer = setTimeout(function () {
                    reject({ code: 'TIMEOUT', message: '请求超时', status: 0, retryable: true });
                }, timeoutMs);

                YuJianAPI.get(url, options)
                    .then(function (data) {
                        clearTimeout(timer);
                        resolve(data);
                    })
                    .catch(function (err) {
                        clearTimeout(timer);
                        // 统一错误格式
                        reject({
                            code: err.code || 'UNKNOWN',
                            message: err.message || '未知错误',
                            status: err.status || 0,
                            retryable: err.retryable !== false,
                            raw: err
                        });
                    });
            });
        }

        // Sprint 4.4 Patch1: 渲染资产页面状态（loading / empty / error / success）
        function renderAssetPageState(state, contentEl, paginationEl) {
            if (paginationEl) paginationEl.innerHTML = '';

            switch (state) {
                case ASSET_PAGE_STATE.LOADING:
                    contentEl.innerHTML = '<div class="workspace-state"><div class="workspace-loading-spinner"></div><p>加载中...</p></div>';
                    break;
                case ASSET_PAGE_STATE.EMPTY:
                    var hasFilters = ASSETS_STATE.currentKeyword || ASSETS_STATE.currentType || ASSETS_STATE.currentStatus;
                    if (hasFilters) {
                        contentEl.innerHTML = '<div class="workspace-state">' +
                            '<i class="fas fa-search"></i>' +
                            '<p>没有匹配的素材</p>' +
                            '<p class="sub-text">尝试调整筛选条件或搜索关键词</p>' +
                            '<p class="sub-text"><button class="btn btn-outline btn-sm" onclick="clearAssetFilters()" style="margin-top:12px">清除筛选</button></p>' +
                            '</div>';
                    } else {
                        contentEl.innerHTML = '<div class="workspace-state">' +
                            '<i class="fas fa-folder-open"></i>' +
                            '<p>暂无素材</p>' +
                            '<p class="sub-text">上传图片、视频或音频素材开始管理</p>' +
                            '</div>';
                    }
                    break;
                case ASSET_PAGE_STATE.ERROR:
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-exclamation-circle"></i>' +
                        '<p>' + (ASSETS_STATE.errorMessage || '加载失败，请稍后重试') + '</p>' +
                        '<p class="sub-text"><button class="btn btn-outline btn-sm" onclick="loadAssets(' + ASSETS_STATE.currentPage + ')" style="margin-top:12px">重新加载</button></p>' +
                        '</div>';
                    break;
                case ASSET_PAGE_STATE.SUCCESS:
                    contentEl.innerHTML = '<div class="asset-grid-new">' +
                        ASSETS_STATE.items.map(renderAssetCard).join('') +
                        '</div>';
                    renderAssetPagination(paginationEl);
                    break;
                default:
                    break;
            }
        }

        var ASSET_TYPE_MAP = {
            'image': '图片',
            'video': '视频',
            'audio': '音频',
            'other': '其他'
        };

        var ASSET_ICONS = {
            'image': 'fa-image',
            'video': 'fa-video',
            'audio': 'fa-music',
            'other': 'fa-file'
        };

        // ─── 加载资产列表（Sprint 4.4 Patch1: 容错重构）────
        async function loadAssets(page) {
            if (ASSETS_STATE.isLoading) return;
            ASSETS_STATE.isLoading = true;
            ASSETS_STATE.currentPage = page || 1;
            ASSETS_STATE.errorMessage = '';

            var contentEl = document.getElementById('assetContent');
            var paginationEl = document.getElementById('assetPagination');
            if (!contentEl) { ASSETS_STATE.isLoading = false; return; }

            // 显示加载状态
            ASSETS_STATE.pageState = ASSET_PAGE_STATE.LOADING;
            renderAssetPageState(ASSET_PAGE_STATE.LOADING, contentEl, paginationEl);

            var params = '?page=' + ASSETS_STATE.currentPage + '&pageSize=' + ASSETS_STATE.pageSize;
            if (ASSETS_STATE.currentType) params += '&type=' + ASSETS_STATE.currentType;
            if (ASSETS_STATE.currentKeyword) params += '&keyword=' + encodeURIComponent(ASSETS_STATE.currentKeyword);
            if (ASSETS_STATE.currentSort) params += '&sort=' + ASSETS_STATE.currentSort;
            if (ASSETS_STATE.currentStatus) params += '&status=' + ASSETS_STATE.currentStatus;

            // Sprint 4.4 Patch2: 始终使用稳定的 Asset API，不依赖 Workspace 模块
            var apiPath = '/enterprise/assets';

            try {
                // Sprint 4.4 Patch1: 使用 safeFetch 替代直接 API 调用
                var data = await safeFetch(apiPath + params);

                if (!data) {
                    throw { code: 'EMPTY_RESPONSE', message: '服务器返回空数据', status: 0, retryable: true };
                }

                ASSETS_STATE.total = data.total || 0;
                ASSETS_STATE.items = data.items || [];
                ASSETS_STATE.pageSize = data.pageSize || 20;

                // Sprint 4.4 Patch4: 填充 Asset 缓存，避免 AI创作Panel 重复查询
                (ASSETS_STATE.items || []).forEach(function(a) {
                    if (a && a.id) ASSET_CACHE[a.id] = a;
                });

                if (!ASSETS_STATE.items.length) {
                    ASSETS_STATE.pageState = ASSET_PAGE_STATE.EMPTY;
                    renderAssetPageState(ASSET_PAGE_STATE.EMPTY, contentEl, paginationEl);
                } else {
                    ASSETS_STATE.pageState = ASSET_PAGE_STATE.SUCCESS;
                    renderAssetPageState(ASSET_PAGE_STATE.SUCCESS, contentEl, paginationEl);
                }

                // Sprint 4.4 Patch2: Workspace 统计信息后台异步加载，失败不影响资产列表
                loadWorkspaceStatsAsync();

            } catch (err) {
                console.error('[Assets] 加载失败:', err);
                ASSETS_STATE.pageState = ASSET_PAGE_STATE.ERROR;

                if (err.status === 401) {
                    ASSETS_STATE.errorMessage = '登录已过期，请刷新页面重新登录';
                    contentEl.innerHTML = '<div class="empty-works">' +
                        '<i class="fas fa-lock"></i>' +
                        '<p>登录已过期</p>' +
                        '<p class="sub-text">请刷新页面重新登录</p>' +
                        '</div>';
                } else {
                    ASSETS_STATE.errorMessage = err.message || '加载失败，请稍后重试';
                    renderAssetPageState(ASSET_PAGE_STATE.ERROR, contentEl, paginationEl);
                }
            } finally {
                ASSETS_STATE.isLoading = false;
            }
        }

        // Sprint 4.4 Patch2: 异步加载 Workspace 统计信息（完全解耦，后台请求）
        // 注意：Workspace API 失败仅记录 console，绝不影响资产页面的任何功能
        function loadWorkspaceStatsAsync() {
            // 延迟加载，优先渲染资产列表
            setTimeout(function () {
                safeFetch('/enterprise/workspace/assets?page=1&pageSize=1')
                    .then(function (wsData) {
                        // Workspace API 正常，无需额外操作（统计已包含在资产数据中）
                        // 如果后续需要更新 workspace 统计徽章，在此处理
                        console.log('[Workspace] Stats loaded successfully');
                    })
                    .catch(function (wsErr) {
                        // Sprint 4.4 Patch2: Workspace 统计失败仅记录 console，不影响任何资产功能
                        console.warn('[Workspace] Stats load failed (non-blocking, asset page unaffected):', wsErr.message);
                    });
            }, 500);
        }

        // ─── 渲染单个资产卡片（Sprint 4.4 Patch1: 安全默认值）──
        function renderAssetCard(item) {
            // Sprint 4.4 Patch1: 所有字段使用安全默认值，避免 Cannot read properties of undefined
            var assetType = (item && item.type) || 'other';
            var typeLabel = ASSET_TYPE_MAP[assetType] || '其他';
            var typeIcon = ASSET_ICONS[assetType] || 'fa-file';
            var typeBadge = { image: 'IMG', video: 'MP4', audio: 'MP3', other: 'FILE' }[assetType] || 'FILE';
            var name = (item && item.name) || '未命名素材';
            var dateStr = formatWorkDate((item && item.createdAt) || null);
            var thumbUrl = (item && item.thumbnailUrl) || (item && item.url) || '';
            var sizeStr = formatAssetSize((item && item.size) || 0);
            var escapedName = escapeHtml(name);
            var safeName = escapedName.replace(/'/g, "\\'");
            var itemId = (item && item.id) || '';

            // Sprint 4.4 Patch1: 资产状态 — 安全默认值
            var statusLabel = (item && item.statusLabel) || '原始素材';
            var statusClass = (item && item.status) || 'raw';
            var genCount = (item && item.generationCount) != null ? item.generationCount : 0;

                '<div class="asset-menu-item" onclick="event.stopPropagation();closeAssetMenu(\'' + itemId + '\');openGenPanel(\'' + itemId + '\')"><i class="fas fa-wand-magic-sparkles"></i> AI创作</div>' +
                '<div class="asset-menu-item asset-menu-delete" onclick="event.stopPropagation();closeAssetMenu(\'' + itemId + '\');confirmDeleteAsset(\'' + itemId + '\',\'' + safeName + '\')"><i class="fas fa-trash-alt"></i> 删除</div>' +
                '</div>' +
                // 信息区域
                '<div class="asset-card-info" onclick="previewAsset(\'' + itemId + '\')">' +
                '<div class="asset-card-name" title="' + escapedName + '">' + escapedName + '</div>' +
                '<div class="asset-card-meta">' +

        // ─── 更多菜单切换 ──────────────────────────────────
        function toggleAssetMenu(event, assetId) {
            var menu = document.getElementById('assetMenu_' + assetId);
            if (!menu) return;
            // 关闭其他打开的菜单
            var allMenus = document.querySelectorAll('.asset-more-menu.show');
            allMenus.forEach(function(m) {
                if (m !== menu) m.classList.remove('show');
            });
            menu.classList.toggle('show');
        }

        function closeAssetMenu(assetId) {
            var menu = document.getElementById('assetMenu_' + assetId);
            if (menu) menu.classList.remove('show');
        }

        // 点击空白处关闭所有更多菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.asset-more-btn') && !e.target.closest('.asset-more-menu')) {
                var menus = document.querySelectorAll('.asset-more-menu.show');
                menus.forEach(function(m) { m.classList.remove('show'); });
            }
        });

        // ─── 格式化文件大小 ────────────────────────────────
        function formatAssetSize(bytes) {
            if (!bytes || bytes === 0) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ─── 渲染分页 ──────────────────────────────────────
        function renderAssetPagination(container) {
            if (!container) return;
            var total = ASSETS_STATE.total;
            var page = ASSETS_STATE.currentPage;
            var pageSize = ASSETS_STATE.pageSize;
            var totalPages = Math.ceil(total / pageSize);

            if (total <= pageSize) {
                container.innerHTML = total > 0
                    ? '<div class="pagination-bar"><span class="page-info">共 ' + total + ' 个素材</span></div>'
                    : '';
                return;
            }

        var PLAY_URL_CACHE = {};

        // ─── 预览资产（Sprint 4.2: 改为打开详情模态框）──────
        // Sprint 4.4 Patch5: 统一图片URL解析
        function getAssetPreviewUrl(asset) {
            if (!asset) return '';
            return asset.thumbnailUrl || asset.url || asset.fileUrl || asset.path || '';
        }

        // ─── Sprint 5.8: 统一资源播放URL解析 ──────────────────
        /**
         * 获取资产的可播放 URL（带签名）
         *
         * 规则：
         *   - video: 调用 AssetAPI.getPlayUrl(asset.id) 获取签名 URL
         *   - image: 调用 AssetAPI.getPlayUrl(asset.id) 获取签名 URL
         *   - 禁止直接使用 asset.url 进行视频播放
         *
         * @param {Object} asset - 资产对象（必须有 id、type 字段）
         * @returns {Promise<string>} 签名后的可播放 URL
         */
        async function resolveAssetPlayableUrl(asset) {
            if (!asset || !asset.id) return '';

            // 检查缓存（55分钟内有效，API返回1小时签名）
            var cached = PLAY_URL_CACHE[asset.id];
            if (cached && cached.expiresAt > Date.now()) {
                return cached.url;
            }

            try {
                var api = (window.EnterpriseAPI && window.EnterpriseAPI.Asset) ||
                          (window.YJ && window.YJ.api && window.YJ.api.Asset);
                if (!api || !api.getPlayUrl) {
                    console.warn('[resolveAssetPlayableUrl] AssetAPI.getPlayUrl 不可用，使用降级URL');
                    return asset.url || '';
                }

                var result = await api.getPlayUrl(asset.id);
                var url = (result && result.url) || asset.url || '';

                // 缓存结果（55分钟，给5分钟缓冲避免刚好过期）
                PLAY_URL_CACHE[asset.id] = {
                    url: url,
                    expiresAt: Date.now() + 55 * 60 * 1000
                };

                return url;
            } catch (err) {
                console.error('[resolveAssetPlayableUrl] 获取播放URL失败:', err.message || err);
                // 降级：返回资产原始 URL
                return asset.url || '';
            }
        }

        // Sprint 4.4 Patch5: 统一 API 响应格式转换
        function normalizeAssetResponse(data) {
            if (!data) return null;
            // 支持: { data: { asset: {...} } }  →  提取 asset
            if (data.data && data.data.asset && data.data.asset.id) return data.data.asset;
            // 支持: { data: {...} }  →  提取 data
            if (data.data && data.data.id) return data.data;
            // 支持: { asset: {...} }  →  提取 asset
            if (data.asset && data.asset.id) return data.asset;
            // 直接就是 Asset 对象
            return data;
        }

        // Sprint 4.4 Patch5: 打开素材详情（缓存优先，避免二次请求导致字段丢失）
        async function openAssetDetail(assetOrId) {
            var overlay = document.getElementById('assetDetailOverlay');
            var previewEl = document.getElementById('assetDetailPreview');
            var bodyEl = document.getElementById('assetDetailBody');
            var actionsEl = document.getElementById('assetDetailActions');
            var titleEl = document.getElementById('assetDetailTitle');

            // Sprint 4.4 Patch7: 显示加载态，先清理旧的AI创作按钮等动态节点
            var staleGenBtn = actionsEl.querySelector('#asset-ai-create-btn');
            if (staleGenBtn) staleGenBtn.remove();
            overlay.classList.add('show');
            actionsEl.style.display = 'none';
            titleEl.innerText = '素材详情';
            previewEl.innerHTML = '<div class="asset-detail-loading"><div class="spinner"></div><div>加载中...</div></div>';
            bodyEl.innerHTML = '<div class="asset-detail-loading"><div class="spinner"></div><div>加载详情...</div></div>';

            var asset = null;
            var assetId = null;

            // Sprint 4.4 Patch5: 解析参数 — 支持传入 Asset 对象或 assetId
            if (typeof assetOrId === 'object' && assetOrId !== null && assetOrId.id) {
                asset = assetOrId;
                assetId = asset.id;
            } else if (typeof assetOrId === 'string' || typeof assetOrId === 'number') {
                assetId = String(assetOrId);
                // 优先从缓存获取，避免二次 API 请求
                asset = ASSET_CACHE[assetId] || null;
            }

            // Sprint 4.4 Patch5: 缓存命中 — 直接渲染，不发起 API 请求
            if (asset) {
                await renderAssetDetailContent(asset, assetId || asset.id);
                return;
            }

            // 缓存未命中，无有效 ID
            if (!assetId) {
                previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>素材不可用</p></div>';
                actionsEl.style.display = 'flex';
                document.getElementById('assetDetailDeleteBtn').style.display = 'none';
                return;
            }

            // 缓存未命中，通过 API 获取
            try {
                var data = await safeFetch('/enterprise/assets/' + assetId);
                var normalized = normalizeAssetResponse(data);
                if (!normalized) {
                    throw { code: 'EMPTY_RESPONSE', message: '服务器返回空数据', status: 0 };
                }
                // 存入缓存
                ASSET_CACHE[assetId] = normalized;
                await renderAssetDetailContent(normalized, assetId);
            } catch (err) {
                console.error('[AssetDetail] 加载失败:', err);
                // Sprint 4.4 Patch5: 只有 API 明确返回 404 才显示"不存在"
                if (err.status === 404) {
                    previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                    bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>素材不存在或已删除</p></div>';
                } else {
                    previewEl.innerHTML = '<i class="fas fa-exclamation-circle preview-icon" style="color:rgba(239,68,68,0.4)"></i>';
                    bodyEl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.5)"><p>加载失败，请重试</p><button class="btn btn-outline btn-sm" onclick="openAssetDetail(\'' + assetId + '\')" style="margin-top:12px">重试</button></div>';
                }
                actionsEl.style.display = 'flex';
                document.getElementById('assetDetailDeleteBtn').style.display = 'none';
            }
        }

                        (summary.processing > 0 ? '<span style="color:#60a5fa">⟳ 处理中 <strong>' + summary.processing + '</strong></span>' : '') +
                        (summary.failed > 0 ? '<span style="color:#f87171">✗ 失败 <strong>' + summary.failed + '</strong></span>' : '') +
                        '</div>';

                var html = summaryHtml;
                for (var i = 0; i < wsData.generations.length; i++) {

                        ((task && task.prompt) ? '<div class="history-item-prompt" title="' + escapeHtml(task.prompt) + '">Prompt: ' + escapeHtml(task.prompt) + '</div>' : '') +
                        outputHtml +

            } catch (wsErr) {

                // Sprint 4.4 Patch1: 回退到旧接口，同样使用 safeFetch
                try {
                    var data = await safeFetch('/enterprise/assets/' + assetId + '/history');
                    var overlay = document.getElementById('assetDetailOverlay');
                    if (!overlay || !overlay.classList.contains('show')) return;

                    if (!data || !data.generationTasks || data.generationTasks.length === 0) {
                        historyList.innerHTML = '<div class="history-empty"><i class="fas fa-inbox"></i><p>暂无创作记录</p></div>';
                        return;
                    }
                    var STATUS_CLASS = {
                        'success': 'history-status-success',
                        'processing': 'history-status-processing',
                        'pending': 'history-status-pending',
                        'failed': 'history-status-failed'
                    };
                    var STATUS_LABEL = {
                        'success': '已完成',
                        'processing': '处理中',
                        'pending': '等待中',
                        'failed': '失败'
                    };
                    var html = '';
                    for (var j = 0; j < data.generationTasks.length; j++) {
                        var task = data.generationTasks[j];
                        var statusLabel = STATUS_LABEL[(task && task.status)] || (task && task.status) || '未知';
                        var statusClass = STATUS_CLASS[(task && task.status)] || 'history-status-pending';
                        var dateStr = formatWorkDate((task && task.createdAt) || null);
                        var promptText = (task && task.prompt) || '无提示词';
                        var taskTypeIcon = (task && task.taskType) === 'text2video' ? 'fa-font' :
                            (task && task.taskType) === 'image2video' ? 'fa-image' : 'fa-film';

                        // Sprint 4.4 Patch1: 安全访问 outputAsset
                        var taskOutput = task && task.outputAsset;
                        var outputHtml = taskOutput
                            ? '<div class="history-item-action"><button class="btn-view-work" onclick="viewHistoryOutput(' + (taskOutput.id || 0) + ', ' + (task.id || 0) + ')"><i class="fas fa-external-link-alt"></i> 查看作品</button></div>'
                            : '';

                        var creativeTypeLabel = formatTaskType(task.taskType);
                        html += '<div class="history-item">' +
                            '<div class="history-item-header">' +
                            '<div class="history-item-name">' +
                            '<i class="fas ' + taskTypeIcon + ' task-icon"></i>' +
                            escapeHtml(promptText.length > 28 ? promptText.substring(0, 28) + '...' : promptText) +
                            '</div>' +
                            '<span class="history-item-status ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>' +
                            '</div>' +
                            '<div class="history-item-meta">创作类型：' + escapeHtml(creativeTypeLabel) + ' · 创建时间: ' + dateStr + '</div>' +
                            ((task && task.prompt) ? '<div class="history-item-prompt" title="' + escapeHtml(task.prompt) + '">Prompt: ' + escapeHtml(task.prompt) + '</div>' : '') +
                            outputHtml +
                            '</div>';
                    }
                    historyList.innerHTML = html;
                } catch (err) {
                    // Sprint 4.4 Patch1: 两级 API 均失败，显示空状态，不关闭 Modal
                    console.warn('[AssetHistory] 旧接口也加载失败:', err.message || err);
                    var overlay = document.getElementById('assetDetailOverlay');
                    if (!overlay || !overlay.classList.contains('show')) return;
                    var el = document.getElementById('assetHistoryList');
                    if (el) el.innerHTML = '<div class="history-empty"><i class="fas fa-inbox"></i><p>暂无创作记录</p></div>';
                }
            }
        }

        // ─── 从创作历史跳转到作品 ────────────────────────────
        function viewHistoryOutput(outputAssetId, taskId) {
            // 参数校验
            if (!taskId && taskId !== 0) {
                showToast('无法查看作品：任务ID缺失', 'warning');
                return;
            }
            // 记录当前 asset id 用于回退（暂未使用，预留）
            var currentAssetId = CURRENT_ASSET_DETAIL ? CURRENT_ASSET_DETAIL.id : null;
            // 关闭素材详情
            closeAssetDetail();
            // 跳转到我的作品页面，并打开对应作品详情
            navigateTo('myworks');
            // 延迟等待页面渲染后打开作品详情
            setTimeout(function () {
                showWorkDetail(taskId);
            }, 400);
        }

        function copyAssetLink() {
            if (!CURRENT_ASSET_DETAIL || !CURRENT_ASSET_DETAIL.url) {
                showToast('无法获取素材链接', 'warning');
                return;
            }
            var url = CURRENT_ASSET_DETAIL.url;
            // 使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    showToast('链接已复制到剪贴板', 'success');
                }).catch(function () {
                    fallbackCopyText(url);
                });
            } else {
                fallbackCopyText(url);
            }
        }

        function fallbackCopyText(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('链接已复制到剪贴板', 'success');
            } catch (e) {
                showToast('复制失败，请手动复制链接', 'error');
            }
            document.body.removeChild(textarea);
        }

        function deleteAssetFromDetail() {
            var btn = document.getElementById('assetDetailDeleteBtn');
            var assetId = btn.getAttribute('data-asset-id');
            var assetName = btn.getAttribute('data-asset-name') || '';

            // 先关闭详情Modal，再打开删除确认
            closeAssetDetail();
            // 延迟一点确保detail modal关闭动画完成
            setTimeout(function () {
                confirmDeleteAsset(assetId, assetName);
            }, 150);
        }

        // 点击 overlay 空白处关闭
        (function bindAssetDetailOverlayClick() {
            document.getElementById('assetDetailOverlay').addEventListener('click', function (e) {
                if (e.target === this) closeAssetDetail();
            });
        })();

        // ─── 删除素材（Sprint 4.1 Patch2）────────────────────
        function confirmDeleteAsset(assetId, assetName) {
            // Sprint 4.1 Patch3: 删除确认弹窗UI优化 — 取消按钮默认可见 + 文案优化
            var content = '<div style="text-align:center;padding:8px 0">' +
                '<p style="margin-bottom:24px;font-size:14px;line-height:1.6;color:var(--text-sub)">删除后该素材将从资产库移除，<br>已生成的视频不会受到影响。</p>' +
                '</div>';

            // 隐藏默认footer，使用内容区自定义按钮
            var footer = document.getElementById('modalFooter');
            if (footer) footer.style.display = 'none';

            // 在modal body底部添加删除确认按钮
            // 取消按钮：默认 indigo 色，白底可见；hover 浅紫背景
            // 确认按钮：保持红色危险色；hover 深红
            content += '<div style="display:flex;gap:12px;justify-content:center;margin-top:8px">' +
                '<button onclick="closeModal()" style="min-width:100px;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;background:transparent;color:#6366f1;border:1px solid #c7d2fe"' +
                ' onmouseover="this.style.background=\'#eef2ff\';this.style.borderColor=\'#818cf8\'"' +
                ' onmouseout="this.style.background=\'transparent\';this.style.borderColor=\'#c7d2fe\'">取消</button>' +
                '<button class="btn btn-danger" onclick="closeModal();deleteAsset(\'' + assetId + '\')" style="min-width:100px;background:var(--danger,#ef4444);border-color:var(--danger,#ef4444);color:#fff"' +
                ' onmouseover="this.style.background=\'#dc2626\';this.style.borderColor=\'#dc2626\'"' +
                ' onmouseout="this.style.background=\'var(--danger,#ef4444)\';this.style.borderColor=\'var(--danger,#ef4444)\'">确认删除</button>' +
                '</div>';

            openModal('确认删除该素材？', encodeURIComponent(content));
        }

        async function deleteAsset(assetId) {
            try {
                await YuJianAPI.request('/enterprise/assets/' + assetId, { method: 'DELETE' });
                showToast('素材已删除', 'success');
                // 从本地状态移除已删除项
                ASSETS_STATE.items = ASSETS_STATE.items.filter(function(item) { return item.id != assetId; });
                ASSETS_STATE.total = Math.max(0, ASSETS_STATE.total - 1);
                // 重新渲染列表
                var contentEl = document.getElementById('assetContent');
                if (contentEl) {
                    if (!ASSETS_STATE.items.length) {
                        contentEl.innerHTML = '<div class="empty-works">' +
                            '<i class="fas fa-folder-open"></i>' +
                            '<p>暂无素材</p>' +
                            '<p class="sub-text">上传图片、视频或音频素材开始管理</p>' +
                            '</div>';
                    } else {
                        contentEl.innerHTML = '<div class="asset-grid-new">' +
                            ASSETS_STATE.items.map(renderAssetCard).join('') +
                            '</div>';
                    }
                }
                // 刷新分页
                var paginationEl = document.getElementById('assetPagination');
                if (paginationEl) renderAssetPagination(paginationEl);
            } catch (err) {
                console.error('[Asset] 删除失败:', err);
                if (err.status === 401) {
                    showToast('登录已过期，请刷新页面重新登录', 'error');
                } else if (err.status === 404) {
                    showToast('素材不存在或已删除', 'warning');
                    loadAssets(ASSETS_STATE.currentPage);
                } else {
                    showToast('删除失败，请稍后重试', 'error');
                }
            }
        }

        // ─── 上传素材 ──────────────────────────────────────
        function triggerAssetUpload() {
            if (!YuJianAuth.isAuthenticated()) {
                showLogin();
                showToast('请先登录企业账号', 'warning');
                return;
            }
            document.getElementById('assetFileInput').click();
        }

        async function handleAssetFileSelect(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            // 判断文件类型
            var type = 'other';
            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';
            else if (file.type.startsWith('audio/')) type = 'audio';

            // 文件大小限制：图片10MB，视频200MB，音频50MB
            var maxSize = type === 'video' ? 200 * 1024 * 1024 : type === 'audio' ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
            var maxSizeLabel = type === 'video' ? '200MB' : type === 'audio' ? '50MB' : '10MB';

            if (file.size > maxSize) {
                var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
                showToast('文件过大 (' + sizeMB + 'MB)，最大支持 ' + maxSizeLabel, 'error');
                event.target.value = '';
                return;
            }

            showToast('正在上传素材...', 'info');

            try {
                // 复用现有上传流程：上传到 OSS 并创建素材记录
                var result = await uploadAssetFile(file, type);
                showToast('上传成功！', 'success');
                // 刷新资产列表
                ASSETS_STATE.currentPage = 1;
                loadAssets(1);
            } catch (err) {
                console.error('[Assets] 上传失败:', err);
                showToast(err.message || '上传失败，请重试', 'error');
            } finally {
                event.target.value = '';
            }
        }

        // ─── 通用文件上传（扩展现有 YuJianUpload 流程）─────
        async function uploadAssetFile(file, type) {
            // 1. 获取 OSS 上传签名
            var signatureData = await YuJianAPI.get('/enterprise/assets/upload-signature?type=' + type);

            // 2. OSS 直传
            var ossResult = await uploadToOssGeneric(file, signatureData);

            // 3. 创建 Asset 记录
            var assetRecord = await YuJianAPI.post('/enterprise/assets', {
                name: file.name,
                url: ossResult.ossUrl,
                type: type,
                size: file.size,
                mime_type: file.type
            });

            return assetRecord;
        }

        function uploadToOssGeneric(file, signatureData) {
            return new Promise(function (resolve, reject) {
                var host = signatureData.host;
                var policy = signatureData.policy;
                var signature = signatureData.signature;
                var dir = signatureData.dir;
                var accessKeyId = signatureData.accessKeyId;

                var timestamp = Date.now();
                var randomStr = Math.random().toString(36).substring(2, 8);
                var safeName = file.name.replace(/[^一-龥a-zA-Z0-9._-]/g, '_');
                var key = dir + timestamp + '_' + randomStr + '_' + safeName;

                var formData = new FormData();
                formData.append('key', key);
                formData.append('policy', policy);
                formData.append('OSSAccessKeyId', accessKeyId);
                formData.append('signature', signature);
                formData.append('success_action_status', '200');
                formData.append('file', file);

                var xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', function (e) {
                    // 静默上传，不展示进度条
                });

                xhr.addEventListener('load', function () {
                    if (xhr.status === 200 || xhr.status === 204) {
                        var ossUrl = host + '/' + key;
                        resolve({ ossUrl: ossUrl, ossKey: key });
                    } else {
                        reject(new Error('OSS 上传失败 (' + xhr.status + ')'));
                    }
                });

                xhr.addEventListener('error', function () {
                    reject(new Error('OSS 上传网络异常，请重试'));
                });

                xhr.addEventListener('abort', function () {
                    reject(new Error('上传已取消'));
                });

                xhr.open('POST', host);
                xhr.send(formData);
            });
        }

        // ─── 导航到资产页时自动加载 ────────────────────────
        var _originalRenderAssets = render;
        render = function (page) {
            // 清理之前页面的轮询等
            if (APP.currentPage === 'image2video' && page !== 'image2video') {
                YuJianVideoTask.stopPolling();
                clearImageSelection();
            }
            _originalRenderAssets(page);
            // 进入资产页面自动加载
            if (page === 'assets') {
                setTimeout(function () { loadAssets(1); }, 0);
            }
        };
    </script>
