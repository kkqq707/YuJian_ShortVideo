<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煜见光影 · 企业创作平台</title>
    <!-- Sprint 4.7 Patch1: Prevent favicon.ico 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Phase 0: Design System Foundation -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <!-- Phase 1-D: Page-level CSS (loaded after components for proper cascade) -->
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <link rel="stylesheet" href="css/pages/works.css">
    <link rel="stylesheet" href="css/pages/assets.css">
    <link rel="stylesheet" href="css/pages/studio.css">
    <link rel="stylesheet" href="css/pages/storyboard.css">
    <link rel="stylesheet" href="css/pages/editor.css">
    <link rel="stylesheet" href="css/pages/projects.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --sidebar-width: 72px;
            --sidebar-expanded: 220px;
            --header-height: 56px;
            --radius: 12px;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 背景光晕呼吸效果 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            animation: breathe 20s ease-in-out infinite;
            z-index: var(--z-base, 0);
            pointer-events: none;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.1) rotate(3deg); opacity: 0.8; }
        }

        /* 侧边栏 - 高透毛玻璃悬浮 */
        .sidebar {
            position: fixed; left: 0; top: 0; width: 90px; height: 100vh;
            background: transparent;
            display: flex; flex-direction: column; z-index: var(--z-sidebar, 200);
        }
        .sidebar-logo {
            height: 64px; display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border-glass); font-size: 18px; font-weight: 700;
            gap: 12px;
        }
        .sidebar-logo .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .sidebar-logo span {
            background: linear-gradient(135deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .nav-menu { flex: 1; padding: 12px 6px; overflow: hidden; }
        .nav-item {
            padding: 10px 6px; cursor: pointer; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, 0.7); transition: all 0.2s; border-radius: 8px;
            margin-bottom: 4px; gap: 4px; font-size: 11px; font-weight: 500;
            text-align: center;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .nav-item i { width: 20px; text-align: center; font-size: 18px; flex-shrink: 0; }
        .nav-section {
            padding: 16px 14px 8px;
            font-size: 11px;
            color: #6b7280;
            font-weight: 500;
        }

        /* 导航图标统一白色 */
        .nav-item i {
            color: rgba(255, 255, 255, 0.85);
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        .nav-item.active i {
            color: #fff;
        }
        .nav-item:hover i {
            color: #fff;
        }

        /* 侧边栏底部 */
        .sidebar-footer {
            padding: 8px 0 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
        }
        .footer-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.75) !important;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .footer-link:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff !important;
        }
        .footer-link i {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85) !important;
            text-align: center;
            font-size: 16px;
        }
        .user-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        .user-mini:hover { background: rgba(255, 255, 255, 0.06); }
        /* 顶部栏 — Phase 2-B: 统一头部 */
        .header {
            position: fixed; left: var(--sidebar-width); top: 0; right: 0; height: var(--header-height);
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: var(--z-header, 300);
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* 主内容区 — Phase 2-B: 增加顶部留白给 Header */
        .main-content { margin-left: 90px; padding: calc(var(--header-height) + 8px) 8px 0; min-height: 100vh; }

        /* 表格 */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f9fafb; font-weight: 600; color: var(--text-sub); font-size: 13px; }
        tr:hover { background: #f9fafb; }

        /* 搜索栏 */
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
        .search-box { position: relative; }
        .search-box input {
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            width: 240px;
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: var(--primary-light); }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* --- 登录弹层（Sprint 3.3.2 UI Patch：玻璃拟态风格）--- */
        .login-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none; align-items: center; justify-content: center;
            z-index: var(--z-overlay, 900);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .login-overlay.show { display: flex; }
        .login-modal {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 360px; max-width: 90vw;
            padding: 36px 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
        }
        .login-modal h2 {
            font-size: 24px; font-weight: 700; margin-bottom: 6px;
            color: #fff;
            text-align: center;
            letter-spacing: 2px;
        }
        .login-modal .login-subtitle {
            font-size: 13px; color: rgba(255, 255, 255, 0.6);
            margin-bottom: 28px;
            text-align: center;
        }
        .login-modal .form-group { margin-bottom: 18px; }
        .login-modal .form-group label {
            display: block; margin-bottom: 8px; font-size: 13px;
            color: rgba(255, 255, 255, 0.8); font-weight: 500;
        }
        .login-modal .form-group input {
            width: 100%; padding: 0 16px; height: 48px; line-height: 48px;
            background: rgba(20, 30, 60, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; color: #fff;
            font-size: 14px; outline: none; transition: all 0.25s;
        }
        .login-modal .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .login-modal .form-group input:focus {
            border-color: rgba(32, 164, 243, 0.6);
            box-shadow: 0 0 0 3px rgba(32, 164, 243, 0.1);
            background: rgba(20, 30, 60, 0.6);
        }
        .login-modal .login-error {
            color: #f87171; font-size: 13px; margin-bottom: 6px;
            min-height: 20px;
        }
        .login-modal .btn-login {
            width: 100%; height: 46px;
            background: linear-gradient(135deg, #20a4f3, #8b5cf6);
            color: #fff; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 6px;
            box-shadow: 0 4px 20px rgba(32, 164, 243, 0.3);
        }
        .login-modal .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(32, 164, 243, 0.45);
        }
        .login-modal .btn-login:active { transform: translateY(0); }
        .login-modal .btn-login:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
            box-shadow: none;
        }
        .login-modal .login-register-hint {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: rgba(255, 255, 255, 0.5);
        }
        .login-modal .login-register-hint a {
            color: rgba(139, 92, 246, 0.9);
            cursor: pointer; text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .login-modal .login-register-hint a:hover {
            color: #a78bfa;
        }
        /* 移动端适配 */
        @media (max-width: 480px) {
            .login-modal {
                width: 92vw; padding: 28px 20px; border-radius: 16px;
            }
            .login-modal h2 { font-size: 22px; }
        }

        /* --- 响应式 --- */
        @media (max-width: 1024px) {
            .sidebar { width: 72px; }
            .sidebar-logo span, .nav-item span, .nav-section { display: none; }
            .nav-item { justify-content: center; padding: 14px; }
            .nav-item i { margin-right: 0; }
            .header, .main-content { left: 72px; margin-left: 72px; }
            .header { padding: 0 12px; }
            .yj-user-name { display: none; }
            .quick-create { grid-template-columns: repeat(2, 1fr); }
            .project-grid { grid-template-columns: repeat(2, 1fr); }
            .creation-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 全屏视频背景 -->
    <div class="fullscreen-bg">
        <video class="fullscreen-video" autoplay muted loop playsinline onerror="this.style.display='none'">
            <source src="full-bg.mp4" type="video/mp4">
        </video>
        <div class="fullscreen-overlay"></div>
    </div>
    <!-- 侧边栏 — Phase 2-B: 分组导航结构 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">煜</div>
            <span>煜见光影</span>
        </div>
        <div class="nav-menu">
            <!-- 首页入口 -->
            <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
                <i class="fas fa-home"></i><span>首页</span>
            </div>

            <!-- 创作 -->
            <div class="nav-section">创作</div>
            <div class="nav-item" data-page="studio" onclick="navigateTo('studio')">
                <i class="fas fa-wand-magic-sparkles"></i><span>AI创作</span>
            </div>
            <div class="nav-item" data-page="digitalhuman" onclick="navigateTo('digitalhuman')">
                <i class="fas fa-user-tie"></i><span>数字人口播</span>
            </div>
            <div class="nav-item" data-page="storyboard" onclick="navigateTo('storyboard')">
                <i class="fas fa-clapperboard"></i><span>故事板</span>
            </div>
            <div class="nav-item" data-page="editor" onclick="navigateTo('editor')">
                <i class="fas fa-scissors"></i><span>视频剪辑</span>
            </div>

            <!-- 资源 -->
            <div class="nav-section">资源</div>
            <div class="nav-item" data-page="assets" onclick="navigateTo('assets')">
                <i class="fas fa-folder-open"></i><span>素材库</span>
            </div>
            <div class="nav-item" data-page="projects" onclick="navigateTo('projects')">
                <i class="fas fa-folder"></i><span>项目管理</span>
            </div>
            <div class="nav-item" data-page="myworks" onclick="navigateTo('myworks')">
                <i class="fas fa-film"></i><span>作品库</span>
            </div>

            <!-- 账户 -->
            <div class="nav-section">账户</div>
            <div class="nav-item" data-page="billing" onclick="navigateTo('billing')">
                <i class="fas fa-coins"></i><span>积分中心</span>
            </div>
            <div class="nav-item" data-page="settings" onclick="navigateTo('settings')">
                <i class="fas fa-gear"></i><span>系统设置</span>
            </div>
        </div>

        <!-- 侧边栏底部：用户头像 -->
        <div class="sidebar-footer">
            <div class="user-mini" onclick="navigateTo('settings')">
                <div class="avatar-sm">王</div>
            </div>
        </div>
    </div>

    <!-- 顶部栏 — Phase 2-B: 统一头部 -->
    <div class="header" id="mainHeader">
        <div class="page-title">
            <h1 class="yj-header-page-title" id="headerPageTitle">首页</h1>
            <div class="yj-breadcrumb" id="headerBreadcrumb">
                <span class="yj-breadcrumb-item yj-breadcrumb-current">首页</span>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
            <div class="yj-credits-display" onclick="navigateTo('billing')" title="点击查看积分详情">
                <i class="fas fa-coins"></i>
                <span>剩余</span>
                <span class="yj-credits-value" id="headerCredits">18,700</span>
                <span>积分</span>
            </div>
            <div class="yj-user-entry" onclick="navigateTo('settings')" title="账户设置">
                <div class="yj-user-avatar">王</div>
                <span class="yj-user-name">王磊</span>
            </div>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content" id="mainContent"></div>

    <!-- 故事板编辑侧栏 -->
    <div class="storyboard-drawer" id="storyboardEditor">
        <div class="drawer-header">
            <h3>编辑分镜</h3>
            <div style="cursor:pointer;color:var(--text-sub)" onclick="closeStoryboard()"><i class="fas fa-times"></i></div>
        </div>
        <div class="drawer-body">
            <div class="form-group">
                <label>画面描述</label>
                <textarea rows="4" placeholder="描述这个镜头的画面内容...">一位女性在明亮的办公室里微笑着看向镜头，背景是现代化的办公环境</textarea>
            </div>
            <div class="form-group">
                <label>台词/旁白</label>
                <textarea rows="3" placeholder="输入这个镜头的台词或旁白文字...">欢迎来到煜见光影，让AI帮你创作精彩视频</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>时长（秒）</label>
                    <input type="number" value="5" min="1" max="15">
                </div>
                <div class="form-group">
                    <label>画面风格</label>
                    <select>
                        <option>真实感</option>
                        <option>动漫风格</option>
                        <option>赛博朋克</option>
                        <option>水彩画</option>
                        <option>3D渲染</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>角色设定</label>
                <select>
                    <option>默认角色</option>
                    <option>职场女性</option>
                    <option>商务男性</option>
                    <option>年轻学生</option>
                </select>
            </div>
            <div class="form-group">
                <label>参考图片（可选）</label>
                <input type="file" accept="image/*">
            </div>
        </div>
        <div class="drawer-footer">
            <button class="btn btn-outline" onclick="closeStoryboard()">取消</button>
            <button class="btn btn-primary" onclick="closeStoryboard();alert('保存成功')">保存分镜</button>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <div class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
            </div>
            <div class="modal-body" id="modalContent"></div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modalConfirmBtn" onclick="closeModal()">确认</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 登录弹层（Sprint 3.3.2 UI Patch：玻璃拟态风格） -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2>煜见光影</h2>
            <div class="login-subtitle">请使用企业账号手机号登录创作平台</div>
            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="loginPhone" placeholder="请输入手机号" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>登录密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="btn-login" id="loginBtn" onclick="handleLogin()">登 录</button>
                <div class="login-register-hint">还没有账号？<a>立即注册</a></div>
            </form>
        </div>
    </div>

    <!-- Asset Detail 模态框（Sprint 4.2 资产详情） -->
    <div class="asset-detail-overlay" id="assetDetailOverlay" onclick="closeAssetDetail()">
        <div class="asset-detail-modal" onclick="event.stopPropagation()">
            <div class="asset-detail-header">
                <h3 id="assetDetailTitle">素材详情</h3>
                <button class="asset-detail-close" onclick="closeAssetDetail()"><i class="fas fa-times"></i></button>
            </div>
            <div class="asset-detail-preview" id="assetDetailPreview">
                <div class="asset-detail-loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
            </div>
            <div class="asset-detail-body" id="assetDetailBody">
                <div class="asset-detail-loading">
                    <div class="spinner"></div>
                    <div>加载详情...</div>
                </div>
            </div>
            <div class="asset-detail-actions" id="assetDetailActions" style="padding:0 24px 20px;display:none">
                <button class="btn btn-copy" onclick="copyAssetLink()"><i class="fas fa-link"></i> 复制链接</button>
                <button class="btn btn-delete" id="assetDetailDeleteBtn" onclick="deleteAssetFromDetail()"><i class="fas fa-trash-alt"></i> 删除素材</button>
                <button class="btn btn-outline" onclick="closeAssetDetail()" style="flex:0.6"><i class="fas fa-times"></i> 关闭</button>
            </div>
        </div>
    </div>

    <!-- Sprint 4.4 Patch6: 独立图片预览 Modal（纯图片放大，无详情信息） -->
    <div class="image-preview-overlay" id="imagePreviewOverlay" onclick="closeImagePreview()">
        <div class="image-preview-container" onclick="event.stopPropagation()">
            <button class="image-preview-close" onclick="closeImagePreview()" title="关闭预览">
                <i class="fas fa-times"></i>
            </button>
            <div class="image-preview-body" id="imagePreviewBody">

        /**
         * 根据 capability 动态刷新模型 select 选项
         * @param {string} capability — Registry capability (e.g. 'image_to_video')
         */
        async function studioRefreshModelSelect(capability) {
            var modelSelect = document.getElementById('studioModel');
            if (!modelSelect) return;

            // ★ Phase UI-AICreation-02-B-2.4-F: 竞态保护 — 记录请求时的 creationType
            var requestedType = YJ.state.aiCreation.creationType;

            // 确保 Registry 数据已加载
            try {
                if (window.YJ && YJ.modules && YJ.modules.modelData) {
                    await YJ.modules.modelData.ensureLoaded();
                }
            } catch (e) {
                console.warn('[Studio] Model data not available:', e.message);
                // ★ 竞态保护: 仅在 creationType 未变化时更新 DOM
                if (YJ.state.aiCreation.creationType === requestedType) {
                    modelSelect.innerHTML = '<option value="">模型数据加载失败</option>';
                }
                return;
            }

            // ★ 竞态保护: 请求完成后检查 creationType 是否已变化
            if (YJ.state.aiCreation.creationType !== requestedType) {
                console.log('[Studio] Model select stale — discarding result for', capability, '(current:', YJ.state.aiCreation.creationType, ')');
                return;
            }

            if (!YJ.state.isAiModelsReady || !YJ.state.isAiModelsReady()) {
                modelSelect.innerHTML = '<option value="">模型数据未就绪</option>';
                return;
            }

            var models = YJ.state.getModelsByCapability(capability);
            if (!models || !models.length) {
                modelSelect.innerHTML = '<option value="">暂无可用模型</option>';
                return;
            }

            var html = '';
            for (var i = 0; i < models.length; i++) {
                var m = models[i];
                var selected = (i === 0) ? ' selected' : '';
                html += '<option value="' + escapeHtml(m.id) + '"' + selected + '>'
                    + escapeHtml(m.displayName || m.name || m.id) + '</option>';
            }
            modelSelect.innerHTML = html;
            console.log('[Studio] Model select refreshed for capability:', capability, '—', models.length, 'models');
        }

        // ─── 创作类型切换 ───────────────────────────────
        function studioSelectType(el, type) {
            var prevType = YJ.state.aiCreation.creationType;

            // ★ Phase UI-AICreation-02-B-2.2-A: 保存当前模式的 DOM prompt 到状态
            var promptEl = document.getElementById('studioPrompt');
            var currentPrompt = promptEl ? promptEl.value : '';
            // Phase UI-AICreation-07-C: 保存负向提示词 DOM 值
            var negPromptEl = document.getElementById('studioNegativePrompt');
            var currentNegPrompt = negPromptEl ? negPromptEl.value : '';

            // ★ Phase UI-AICreation-02-B-2.2-A: 保存当前模式状态 → 旧命名空间
            if (prevType && YJ.state.saveAiCreationModeState) {
                // 将 DOM prompt 写入 textPrompt/ref2videoPrompt 后再保存
                if (prevType === 'ref2video') {
                    YJ.state.aiCreation.ref2videoPrompt = currentPrompt;
                } else {
                    YJ.state.aiCreation.textPrompt = currentPrompt;
                }
                // Phase UI-AICreation-07-C: 保存负向提示词
                // Phase UI-AICreation-07-G P2-1: 扩展 ref2video 也保存 negativePrompt
                if (prevType === 'text2video' || prevType === 'ref2video') {
                    YJ.state.aiCreation.negativePrompt = currentNegPrompt;
                }
                YJ.state.saveAiCreationModeState(prevType);
            }

            YJ.state.aiCreation.creationType = type;
            // Phase UI-AICreation-02-B-2.4-I: 持久化创作类型，刷新后保持子模式
            try { localStorage.setItem('enterprise_studio_creationType', type); } catch (e) { /* ignore */ }
            document.querySelectorAll('.yj-studio-type-card').forEach(function(c) {
                c.classList.remove('active');
            });
            if (el) el.classList.add('active');

            // Phase 2-C-2-3-B: 动态刷新模型选择器（从 Registry 数据获取）
            var capability = STUDIO_CAPABILITY_MAP[type];
            if (capability) {
                studioRefreshModelSelect(capability);
            }

            // ★ Phase UI-AICreation-02-B-2.3-D-3: 同步刷新 Prompt 模板
            var STUDIO_TPL_CAP_MAP = { imageGen: 'image', text2video: 'text_to_video', image2video: 'image_to_video', ref2video: 'reference_to_video' };
var templateCapability = STUDIO_TPL_CAP_MAP[type] || 'image_to_video';
            initTemplateSelector('#studioTemplateContainer', 'studioPrompt', templateCapability);

            // ── Phase 2-C-2-4-C-3-2: 素材清理（拆分规则） ──
            if (prevType === 'ref2video' && type !== 'ref2video') {
                studioClearRefImages();
            }
            if (prevType !== 'ref2video' && type === 'ref2video') {
                studioClearMaterial();
            }
            if (type === prevType && type === 'image2video') {
                studioClearMaterial();
            }

            // ★ Phase UI-AICreation-02-B-2.2-B: DOM 层隔离 — 集中管理 UI 可见性
            // 替代原有的散落 show/hide 逻辑，由三个专用函数统一处理
            studioUpdateStepBadges(type);
            studioUpdatePromptDOM(type);
            studioUpdateParamVisibility(type);

            // ── 模式专属的额外处理 ──
            if (type === 'ref2video') {
                renderRefImageGrid();
            }
            // Phase 2-C-1-C/2-C-1-D: 视频模式同步参数到 state
            if (type === 'image2video' || type === 'text2video') {
                studioReadParamsToState();
            }

            // ★ Phase UI-AICreation-02-B-2.2-A: 恢复新模式命名空间 → 当前状态 + DOM
            if (YJ.state.restoreAiCreationModeState) {
                YJ.state.restoreAiCreationModeState(type);
                // 恢复 prompt 到 DOM textarea
                var modeState = YJ.state.getAiCreationModeState(type);
                if (promptEl && modeState && modeState.prompt !== undefined && modeState.prompt !== null) {
                    promptEl.value = modeState.prompt;
                }
                // Phase UI-AICreation-07-C: 恢复负向提示词到 DOM
                if (negPromptEl && modeState && modeState.negativePrompt !== undefined && modeState.negativePrompt !== null) {
                    negPromptEl.value = modeState.negativePrompt;
                }
            }

            // 更新预览区域占位文案
            studioUpdatePreviewPlaceholder(type);

            // 重置结果
            studioResetResult();
        }

        // ─── 文件选择处理 ───────────────────────────────
        async function studioHandleFileSelect(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            studioClearMaterial();

            var validation = await YuJianUpload.validateImage(file);
            if (!validation.valid) {
                showToast(validation.error, 'error');
                event.target.value = '';
                return;
            }

            var meta = validation.meta;
            var preview = YuJianUpload.createPreview(file);

            // Unified state (Phase 2-D-3.4-B.5-B1)
            YJ.state.aiCreation.selectedFile = file;
            YJ.state.aiCreation.previewUrl = preview.url;
            YJ.state.aiCreation.uploadedImageUrl = null;
            YJ.state.aiCreation.assetId = null;
            YJ.state.aiCreation.sourceMode = 'upload';

            studioShowPreview(preview.url, meta);
        }

        function studioOnAssetPicked(asset) {
            // Unified state (Phase 2-D-3.4-B.5-B1)
            YJ.state.aiCreation.sourceMode = 'asset';
            YJ.state.aiCreation.selectedAsset = asset;
            YJ.state.aiCreation.assetId = asset.id;
            YJ.state.aiCreation.selectedFile = null;
            YJ.state.aiCreation.uploadedImageUrl = asset.url;

            var thumbUrl = asset.thumbnailUrl || asset.url || '';
            studioShowPreview(thumbUrl, {
                name: asset.name || '素材',
                size: asset.size || 0,
                width: asset.width || 0,
                height: asset.height || 0
            });

        }

        function studioRefOnAssetPicked(asset) {
            var refImages = YJ.state.aiCreation.referenceImages;
            if (refImages.length >= 5) {
                showToast('最多添加5张参考图片', 'warning');
                return;
            }

            refImages.push({
                url: asset.thumbnailUrl || asset.url,
                uploadedUrl: asset.url,
                uploadedAssetId: asset.id,
                name: asset.name || '素材库图片',
                sourceMode: 'asset',
                file: null
            });

            renderRefImageGrid();
            showToast('已从素材库添加参考图片', 'success');

        /** 清理所有 ref2video 参考图片并 revoke ObjectURL */
        function studioClearRefImages() {
            var images = YJ.state.aiCreation.referenceImages;
            if (!images || !images.length) {
                YJ.state.aiCreation.referenceImages = [];
                renderRefImageGrid();
                return;
            }

            for (var i = 0; i < images.length; i++) {

                if (ref.url && ref.url.startsWith('blob:')) {

            }

            renderRefImageGrid();

        /** 渲染 ref2video 5-slot 参考图片 Grid */
        function renderRefImageGrid() {
            var grid = document.getElementById('studioRefGrid');
            if (!grid) return;

            var images = YJ.state.aiCreation.referenceImages || [];
            var maxSlots = 5;
            var html = '';

            for (var i = 0; i < maxSlots; i++) {
                if (i < images.length) {
                    html += '<div class="yj-studio-ref-item filled">'
                        + '<img class="yj-studio-ref-thumb" src="' + images[i].url + '" alt="参考图' + (i + 1) + '">'
                        + '<button class="yj-studio-ref-remove" onclick="studioRemoveRefImage(' + i + ')" title="移除">'
                        + '<i class="fas fa-times"></i>'
                        + '</button>'
                        + '</div>';
                } else if (i === images.length && images.length < maxSlots) {
                    html += '<div class="yj-studio-ref-item yj-studio-ref-add"'
                        + ' onclick="document.getElementById(\'studioRefFileInput\').click()" title="添加参考图片">'
                        + '<i class="fas fa-plus"></i>'
                        + '<span>添加</span>'
                        + '</div>';
                } else {
                    html += '<div class="yj-studio-ref-item yj-studio-ref-empty"></div>';
                }
            }

            grid.innerHTML = html;
        }

        /** 处理 ref2video 多图文件选择 */
        async function studioHandleRefImageSelect(event) {
            var files = event.target.files;
            if (!files || !files.length) return;

            var refImages = YJ.state.aiCreation.referenceImages;
            var currentCount = refImages.length;
            var maxSlots = 5;
            var remaining = maxSlots - currentCount;

            if (remaining <= 0) {
                showToast('最多添加5张参考图片', 'warning');
                event.target.value = '';
                return;
            }

            var toProcess = Math.min(files.length, remaining);
            var added = 0;

            for (var i = 0; i < toProcess; i++) {
                var file = files[i];
                var validation = await YuJianUpload.validateImage(file);
                if (!validation.valid) {
                    showToast(validation.error, 'error');
                    continue;
                }
                var preview = YuJianUpload.createPreview(file);
                refImages.push({
                    file: file,
                    url: preview.url,
                    name: file.name || ('参考图' + (refImages.length + 1))
                });
                added++;
            }

            event.target.value = '';
            if (added > 0) {
                renderRefImageGrid();
                showToast('已添加 ' + added + ' 张参考图片', 'success');
            }
        }

        /** 移除单张 ref2video 参考图片并 revoke ObjectURL */
        function studioRemoveRefImage(index) {
            var images = YJ.state.aiCreation.referenceImages;
            if (!images || index < 0 || index >= images.length) return;

            var removed = images[index];
            if (removed.url && removed.url.startsWith('blob:')) {
                URL.revokeObjectURL(removed.url);
            }

            images.splice(index, 1);
            renderRefImageGrid();
        }

        // ★ Phase 2-C-2-4-C-3-3-A: ref2video 参考图片批量上传
        // Phase 2-D-3.4-B.3-B: 迁移至 YJ.state.aiCreation
        // Phase UI-AICreation-07-G P2-3: 串行上传改为 Promise.all 并行上传
        // Phase UI-AICreation-07-G P2-4: 添加进度反馈 (完成数/总数)
        async function studioUploadRefImages(statusEl) {
            var images = YJ.state.aiCreation.referenceImages;
            if (!images || !images.length) {
                showToast('请先添加参考图片', 'warning');
                return null;
            }

            YJ.state.aiCreation.isUploading = true;

            // 筛选需要上传的图片（素材库图片/已上传图片跳过）
            var imagesToUpload = [];
            for (var i = 0; i < images.length; i++) {
                var item = images[i];
                // 素材库图片已有 OSS URL，跳过上传
                if (item.sourceMode === 'asset' && item.uploadedUrl) continue;
                // 已上传的跳过，禁止重复上传
                if (item.uploadedUrl) continue;
                imagesToUpload.push(item);
            }

            try {
                if (imagesToUpload.length > 0) {
                    var total = imagesToUpload.length;
                    var completed = 0;
                    if (statusEl) {
                        statusEl.textContent = '正在上传参考图片 (' + completed + '/' + total + ')';
                    }

                    var uploadPromises = imagesToUpload.map(function(item) {
                        return YuJianUpload.uploadImage(item.file).then(function(result) {
                            item.uploadedUrl = result.url;
                            item.uploadedAssetId = result.assetId;
                            completed++;
                            if (statusEl) {
                                statusEl.textContent = '正在上传参考图片 (' + completed + '/' + total + ')';
                            }
                        });
                    });
                    await Promise.all(uploadPromises);
                }
            } catch (err) {
                YJ.state.aiCreation.isUploading = false;
                showToast('参考图片上传失败: ' + (err.message || '未知错误'), 'error');
                return null;
            }

            YJ.state.aiCreation.isUploading = false;

            var uploadedUrls = images.map(function(r) { return r.uploadedUrl; });
            return uploadedUrls;
        }

        /**
         * 根据创作类型动态更新 Step 编号
         * 解决硬编码 "1"/"2"/"3" 导致的跳过步骤后编号不一致问题
         *
         * @param {string} type — creationType
         *
         * 规则:
         *   text2video:  无素材步骤, Prompt=Step1, Params=Step2
         *   image2video: 素材=Step1, Prompt=Step2, Params=Step3
         *   ref2video:   参考图=Step1, Prompt=Step2, Params=Step3
         *   imageGen:    无素材步骤, Prompt=Step1, Params=Step2
         */
        function studioUpdateStepBadges(type) {
            var badgeMaterial = document.getElementById('studioStepBadgeMaterial');
            var badgeRef = document.getElementById('studioStepBadgeRef');
            var badgePrompt = document.getElementById('studioStepBadgePrompt');
            var badgeParams = document.getElementById('studioStepBadgeParams');

            var promptSection = document.getElementById('studioPromptSection');
            var paramsSection = document.getElementById('studioParamsSection');

            // 隐藏所有 badge 和对应的 section（稍后按需显示）
            if (badgeMaterial) badgeMaterial.parentElement.parentElement.style.display = 'none';
            if (badgeRef) badgeRef.parentElement.parentElement.style.display = 'none';
            if (promptSection) promptSection.style.display = 'block';
            if (paramsSection) paramsSection.style.display = 'block';

            switch (type) {
                case 'text2video':
                    // Step 1: Prompt, Step 2: Params
                    if (badgePrompt) badgePrompt.textContent = '1';
                    if (badgeParams) badgeParams.textContent = '2';
                    break;

                case 'image2video':
                    // Step 1: 素材, Step 2: Prompt, Step 3: Params
                    if (badgeMaterial) {
                        badgeMaterial.textContent = '1';
                        badgeMaterial.parentElement.parentElement.style.display = 'block';
                    }
                    if (badgePrompt) badgePrompt.textContent = '2';
                    if (badgeParams) badgeParams.textContent = '3';
                    break;

                case 'ref2video':
                    // Step 1: 参考图, Step 2: Prompt, Step 3: Params
                    if (badgeRef) {
                        badgeRef.textContent = '1';
                        badgeRef.parentElement.parentElement.style.display = 'block';
                    }
                    if (badgePrompt) badgePrompt.textContent = '2';
                    if (badgeParams) badgeParams.textContent = '3';
                    break;

                case 'imageGen':
                    // Step 1: Prompt, Step 2: Params
                    if (badgePrompt) badgePrompt.textContent = '1';
                    if (badgeParams) badgeParams.textContent = '2';
                    break;
            }
        }

        // ─── 开始生成 ────────────────────────────────────
        async function studioStartGenerate() {
            if (YJ.state.aiCreation.isGenerating) return;

            var prompt = (document.getElementById('studioPrompt').value || '').trim();
            if (!prompt) {
                showToast('请输入提示词', 'warning');
                return;
            }
            if (prompt.length > 2000) {
                showToast('提示词不能超过2000字', 'warning');
                return;
            }

            // Phase 2-C-1-D: 文生视频 — 保存提示词到状态
            YJ.state.aiCreation.textPrompt = prompt;
            // Phase UI-AICreation-02-B-2.2-A: 同时写入当前模式命名空间
            var _curType = YJ.state.aiCreation.creationType;
            if (_curType === 'ref2video') {
                YJ.state.aiCreation.ref2videoPrompt = prompt;
                if (YJ.state.aiCreation.ref2video) {
                    YJ.state.aiCreation.ref2video.prompt = prompt;
                }
            } else if (YJ.state.aiCreation[_curType]) {
                YJ.state.aiCreation[_curType].prompt = prompt;
            }

            // ★ Phase 2-C-2-4-C-3-3-B: ref2video 参考图片数量校验（2-5张）
            if (YJ.state.aiCreation.creationType === 'ref2video') {
                var _refImgCount = (YJ.state.aiCreation.referenceImages || []).length;
                if (_refImgCount < 2) {
                    showToast('参考生视频至少需要2张参考图片', 'warning');
                    return;
                }
                if (_refImgCount > 5) {
                    showToast('参考生视频最多支持5张参考图片', 'warning');
                    return;
                }
            }

            YJ.state.aiCreation.isGenerating = true;
            var generateBtn = document.getElementById('studioGenerateBtn');
            var generateText = document.getElementById('studioGenerateText');
            var statusArea = document.getElementById('studioStatus');
            var statusText = document.getElementById('studioStatusText');
            var statusIcon = document.getElementById('studioStatusIcon');
            var statusProgress = document.getElementById('studioStatusProgress');
            var progressBar = document.getElementById('studioProgressBar');
            var statusActions = document.getElementById('studioStatusActions');
            var resultArea = document.getElementById('studioResult');

            // 重置状态
            if (statusArea) statusArea.style.display = 'block';
            if (resultArea) resultArea.style.display = 'none';
            if (statusIcon) statusIcon.innerHTML = '<div class="yj-spinner yj-spinner-lg"></div>';
            if (statusText) statusText.textContent = '准备提交任务...';
            if (statusProgress) statusProgress.style.display = 'none';
            if (statusActions) statusActions.style.display = 'none';
            if (generateBtn) generateBtn.disabled = true;
            if (generateText) generateText.textContent = '提交中...';

            var creationType = YJ.state.aiCreation.creationType;

            // Phase 2-C-2-3-B: 读取用户选择的模型 ID
            var modelSelectEl = document.getElementById('studioModel');
            var selectedModelId = (modelSelectEl && modelSelectEl.value) || '';
            // 如果未选择有效模型（如 placeholder），使用 capability 对应的默认模型
            if (!selectedModelId) {
                var capability = STUDIO_CAPABILITY_MAP[creationType];
                if (capability) {
                    var models = (YJ.state && YJ.state.getModelsByCapability)
                        ? YJ.state.getModelsByCapability(capability) : [];
                    selectedModelId = (models && models.length > 0) ? models[0].id : '';
                }
            }

            try {
                // 设置 Processing 状态
                if (statusText) statusText.textContent = '正在生成，请耐心等待...';
                if (statusProgress) statusProgress.style.display = 'block';
                if (progressBar) progressBar.style.width = '0%';
                if (generateText) generateText.textContent = '生成中...';

                // 根据类型选择生成方式（Phase 2-C-1-B: 统一使用 EnterpriseAPI.Generation）
                var task = null;
                if (creationType === 'imageGen') {
                    // 图片生成 — 使用统一 API
                    // Phase UI-AICreation-02-B-1-E-C: 从统一状态读取图片参数
                    var _p = YJ.state.aiCreation.params;
                    task = await EnterpriseAPI.Generation.createImageGenerationTask({
                        prompt: prompt,
                        style: _p.style || 'realistic',
                        ratio: _p.aspectRatio || '16:9',
                        modelId: selectedModelId,
                        templateId: 'image_generation'
                    });
                } else if (creationType === 'ref2video') {
                    // ★ Phase 2-C-2-4-C-3-3-B: ref2video 真实生成分支
                    var _refDurationVal = parseInt(document.getElementById('studioDuration').value) || 5;

                    // 上传参考图片到 OSS（进度反馈由 studioUploadRefImages 内部更新）
                    if (generateText) generateText.textContent = '上传中...';
                    var _uploadedUrls = await studioUploadRefImages(statusText);
                    if (!_uploadedUrls) {
                        // 上传失败 — 恢复状态但不清空参考图片
                        YJ.state.aiCreation.isGenerating = false;
                        if (generateBtn) generateBtn.disabled = false;
                        if (generateText) generateText.textContent = '开始生成';
                        if (statusArea) statusArea.style.display = 'none';
                        return;
                    }

                    // 重置状态文本
                    if (statusText) statusText.textContent = '正在生成，请耐心等待...';
                    if (generateText) generateText.textContent = '生成中...';

                    // ★ 读取统一参数（与 image2video/text2video 一致）
                    var _refAspectRatioVal = (document.getElementById('studioAspectRatio') || {}).value || '16:9';
                    var _refMotionStrengthVal = (document.getElementById('studioMotionStrength') || {}).value || 'medium';
                    var _refCameraMovementVal = (document.getElementById('studioCameraMovement') || {}).value || 'static';
                    var _refQualityVal = (document.getElementById('studioQuality') || {}).value || 'standard';

                    var _refUnifiedParams = {
                        aspectRatio: _refAspectRatioVal,
                        motionStrength: _refMotionStrengthVal,
                        cameraMovement: _refCameraMovementVal,
                        quality: _refQualityVal
                    };

                    var _refTaskInput = {
                        referenceImages: _uploadedUrls,
                        prompt: prompt,
                        duration: _refDurationVal,
                        params: _refUnifiedParams,
                        negativePrompt: (document.getElementById('studioNegativePrompt')?.value || '').trim(),
                        modelId: selectedModelId
                    };

                    task = await EnterpriseAPI.Generation.createRefToVideoTask(_refTaskInput);
                } else {
                    // image2video / text2video — 使用统一 API
                    // Phase 2-C-1-C: 读取统一参数
                    var durationVal = parseInt(document.getElementById('studioDuration').value) || 5;
                    var aspectRatioVal = (document.getElementById('studioAspectRatio') || {}).value || '16:9';
                    var motionStrengthVal = (document.getElementById('studioMotionStrength') || {}).value || 'medium';
                    var cameraMovementVal = (document.getElementById('studioCameraMovement') || {}).value || 'static';
                    var qualityVal = (document.getElementById('studioQuality') || {}).value || 'standard';

                    var unifiedParams = {
                        aspectRatio: aspectRatioVal,
                        motionStrength: motionStrengthVal,
                        cameraMovement: cameraMovementVal,
                        quality: qualityVal
                    };

                    var taskInput = {
                        prompt: prompt,
                        duration: durationVal,
                        params: unifiedParams,
                        modelId: selectedModelId,
                        negativePrompt: (document.getElementById('studioNegativePrompt')?.value || '').trim()
                    };

                    if (creationType === 'image2video') {
                        if (!YJ.state.aiCreation.assetId && !YJ.state.aiCreation.uploadedImageUrl && !YJ.state.aiCreation.selectedFile) {
                            throw new Error('请先上传参考图片');
                        }
                        if (YJ.state.aiCreation.assetId) {
                            taskInput.sourceAssetId = YJ.state.aiCreation.assetId;
                        } else if (YJ.state.aiCreation.uploadedImageUrl) {
                            taskInput.imageUrl = YJ.state.aiCreation.uploadedImageUrl;
                        } else if (YJ.state.aiCreation.selectedFile) {
                            // 先上传
                            if (statusText) statusText.textContent = '正在上传素材...';
                            if (generateText) generateText.textContent = '上传中...';
                            var uploadResult = await YuJianUpload.uploadImage(YJ.state.aiCreation.selectedFile);
                            YJ.state.aiCreation.uploadedImageUrl = uploadResult.url;
                            YJ.state.aiCreation.assetId = uploadResult.assetId;
                            taskInput.imageUrl = uploadResult.url;
                            taskInput.sourceAssetId = uploadResult.assetId;
                        }
                        taskInput.templateId = 'image_to_video';
                        task = await EnterpriseAPI.Generation.createImageToVideoTask(taskInput);
                    } else {
                        taskInput.templateId = 'text_to_video';
                        task = await EnterpriseAPI.Generation.createTextToVideoTask(taskInput);
                    }
                }

                YJ.state.aiCreation.currentTaskId = task.id || task.task_id;
                console.log('[Studio] 任务创建成功, taskId:', YJ.state.aiCreation.currentTaskId);

                // 开始轮询
                if (typeof YuJianVideoTask !== 'undefined' && YuJianVideoTask.pollTaskStatus) {
                    YuJianVideoTask.pollTaskStatus(YJ.state.aiCreation.currentTaskId, {
                        onUpdate: function(t) {
                            var pct = (t.progress !== null && t.progress !== undefined) ? t.progress : 0;
                            if (progressBar) progressBar.style.width = pct + '%';
                            if (statusText) {
                                statusText.textContent = (t.status === 'pending')
                                    ? '排队中...'
                                    : '生成中 ' + pct + '%';
                            }
                            if (generateText) {
                                generateText.textContent = (t.status === 'pending') ? '排队中...' : pct + '%';
                            }
                        },
                        onSuccess: function(t) {
                            studioOnSuccess(t);
                        },
                        onFailed: function(t) {
                            studioOnFailed(t);
                        },
                        onTimeout: function() {
                            studioOnTimeout();
                        },
                        onError: function(err) {
                            console.error('[Studio] 轮询出错:', err);
                        }
                    });
                } else {
                    // 无轮询模块，直接显示成功
                    studioOnSuccess(task);
                }

            } catch (err) {
                console.error('[Studio] 生成失败:', err);
                studioOnFailed({ error_msg: err.message || '生成失败，请重试' });
            }
        }

        // ─── 生成成功 ────────────────────────────────────
        function studioOnSuccess(task) {
            YJ.state.aiCreation.isGenerating = false;
            var generateBtn = document.getElementById('studioGenerateBtn');
            var generateText = document.getElementById('studioGenerateText');
            var statusText = document.getElementById('studioStatusText');
            var statusIcon = document.getElementById('studioStatusIcon');
            var statusProgress = document.getElementById('studioStatusProgress');
            var progressBar = document.getElementById('studioProgressBar');
            var statusActions = document.getElementById('studioStatusActions');
            var resultArea = document.getElementById('studioResult');
            var resultBody = document.getElementById('studioResultBody');
            var downloadBtn = document.getElementById('studioDownloadBtn');
            var sendToEditorBtn = document.getElementById('studioSendToEditorBtn');

            if (statusIcon) statusIcon.innerHTML = '<i class="fas fa-check-circle" style="font-size:36px;color:var(--success)"></i>';
            if (statusText) statusText.textContent = '生成成功！';
            if (statusProgress) statusProgress.style.display = 'none';
            if (progressBar) progressBar.style.width = '100%';
            if (generateBtn) generateBtn.disabled = false;
            if (generateText) generateText.textContent = '开始生成';

            // 结果展示
            // Phase UI-AICreation-02-B-1-G-Q: 统一提取输出 URL，优先使用 outputAsset.url
            var creationType = YJ.state.aiCreation.creationType;
            var isImageTask = creationType === 'imageGen'
                || task.taskType === 'text2image'
                || task.taskType === 'image_generation';
            console.log(task.outputAsset);
            console.log(task.outputAsset?.url);
            // Phase UI-AICreation-02-B-2.3-B: 视频优先使用签名播放 URL
            var previewImageUrl = task.videoUrl
                || task.playUrl
                || (task.outputAsset && task.outputAsset.play_url)
                || (task.outputAsset && task.outputAsset.url)
                || task.output_url
                || (task.results && task.results[0] && task.results[0].url)
                || '';
            var videoUrl = previewImageUrl;
            if (resultArea) resultArea.style.display = 'block';
            if (resultBody) {
                if (isImageTask && videoUrl) {
                    // imageGen / text2image 图片结果展示（非视频）
                    resultBody.innerHTML = '<img src="' + escapeHtml(videoUrl) + '" style="width:100%;max-height:300px;border-radius:8px;object-fit:contain;background:#111" alt="生成图片">';
                    if (downloadBtn) { downloadBtn.href = videoUrl; downloadBtn.style.display = 'inline-flex'; }
                    if (sendToEditorBtn) {
                        sendToEditorBtn.style.display = 'inline-flex';
                        sendToEditorBtn.onclick = function() {
                            var bridgeAsset = {
                                id: task.task_id || task.id || '',
                                name: task.prompt ? task.prompt.substring(0, 40) : 'AI生成图片',
                                type: 'image',
                                url: videoUrl,
                                duration: 5,
                                thumbnailUrl: videoUrl
                            };
                            if (window.YJ && window.YJ.Editor && window.YJ.Editor.openEditorWithAsset) {
                                YJ.Editor.openEditorWithAsset(bridgeAsset);
                            } else {
                                navigateTo('editor');
                            }
                        };
                    }

                    // 右侧预览 — 图片
                    var previewVideo = document.getElementById('studioResultVideo');
                    var placeholder = document.getElementById('studioPreviewPlaceholder');
                    var largePreview = document.getElementById('studioLargePreview');
                    if (previewVideo) { previewVideo.style.display = 'none'; }
                    if (placeholder) { placeholder.style.display = 'none'; }
                    if (largePreview) {
                        largePreview.src = videoUrl;
                        largePreview.style.display = 'block';
                    }
                } else if (!isImageTask && videoUrl) {
                    resultBody.innerHTML = '<video src="' + escapeHtml(videoUrl) + '" controls playsinline style="width:100%;max-height:300px;border-radius:8px;background:#000"></video>';
                    if (downloadBtn) { downloadBtn.href = videoUrl; downloadBtn.style.display = 'inline-flex'; }
                    if (sendToEditorBtn) {
                        sendToEditorBtn.style.display = 'inline-flex';
                        // Phase 2-D-1-B: Wire Studio → Editor bridge
                        sendToEditorBtn.onclick = function() {
                            var bridgeAsset = {
                                id: task.task_id || task.id || '',
                                name: task.prompt ? task.prompt.substring(0, 40) : 'AI生成视频',
                                type: 'video',
                                url: videoUrl,
                                duration: task.duration || 5,
                                thumbnailUrl: task.cover_url || ''
                            };
                            if (window.YJ && window.YJ.Editor && window.YJ.Editor.openEditorWithAsset) {
                                YJ.Editor.openEditorWithAsset(bridgeAsset);
                            } else {
                                navigateTo('editor');
                            }
                        };
                    }

                    // 右侧预览
                    var previewVideo2 = document.getElementById('studioResultVideo');
                    var placeholder2 = document.getElementById('studioPreviewPlaceholder');
                    var largePreview2 = document.getElementById('studioLargePreview');
                    if (previewVideo2) { previewVideo2.src = videoUrl; previewVideo2.style.display = 'block'; }
                    if (placeholder2) placeholder2.style.display = 'none';
                    if (largePreview2) largePreview2.style.display = 'none';
                } else if (task.images && task.images.length > 0) {
                    // 图片生成结果（多图）
                    resultBody.innerHTML = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">'
                        + task.images.map(function(img) {
                            return '<img src="' + escapeHtml(img) + '" style="width:100%;border-radius:8px" alt="生成图片">';
                        }).join('')
                        + '</div>';
                    if (sendToEditorBtn) {
                        sendToEditorBtn.style.display = 'inline-flex';
                        sendToEditorBtn.onclick = function() {
                            var bridgeAsset = {
                                id: task.task_id || task.id || '',
                                name: task.prompt ? task.prompt.substring(0, 40) : 'AI生成图片',
                                type: 'image',
                                url: task.images[0] || '',
                                duration: 5,
                                thumbnailUrl: task.images[0] || ''
                            };
                            if (window.YJ && window.YJ.Editor && window.YJ.Editor.openEditorWithAsset) {
                                YJ.Editor.openEditorWithAsset(bridgeAsset);
                            } else {
                                navigateTo('editor');
                            }
                        };
                    }

                    // Phase UI-AICreation-02-B-1-G-Q: 多图时右侧预览显示第一张
                    var previewVideo3 = document.getElementById('studioResultVideo');
                    var placeholder3 = document.getElementById('studioPreviewPlaceholder');
                    var largePreview3 = document.getElementById('studioLargePreview');
                    if (previewVideo3) { previewVideo3.style.display = 'none'; }
                    if (placeholder3) { placeholder3.style.display = 'none'; }
                    if (largePreview3) {
                        largePreview3.src = task.images[0];
                        largePreview3.style.display = 'block';
                    }
                } else {
                    resultBody.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sub)">'
                        + '<i class="fas fa-check-circle" style="font-size:32px;color:var(--success);display:block;margin-bottom:8px"></i>'
                        + '生成完成，请在<a href="javascript:navigateTo(\'myworks\')" style="color:var(--primary-light)">作品库</a>中查看</div>';
                }
            }

            if (statusActions) {
                statusActions.style.display = 'flex';
                statusActions.innerHTML = ''
                    + '<button class="yj-btn yj-btn-outline yj-btn-sm" onclick="studioReset()"><i class="fas fa-redo"></i> 再次生成</button>'
                    + '<button class="yj-btn yj-btn-primary yj-btn-sm" onclick="navigateTo(\'myworks\')"><i class="fas fa-film"></i> 查看作品库</button>';
            }

            showToast('生成成功！', 'success');
            refreshMyWorksIfActive();
        }

        // ─── 生成失败 ────────────────────────────────────
        function studioOnFailed(task) {
            YJ.state.aiCreation.isGenerating = false;
            var generateBtn = document.getElementById('studioGenerateBtn');
            var generateText = document.getElementById('studioGenerateText');
            var statusText = document.getElementById('studioStatusText');
            var statusIcon = document.getElementById('studioStatusIcon');
            var statusProgress = document.getElementById('studioStatusProgress');
            var statusActions = document.getElementById('studioStatusActions');

            if (statusIcon) statusIcon.innerHTML = '<i class="fas fa-exclamation-circle" style="font-size:36px;color:var(--danger)"></i>';
            if (statusText) statusText.textContent = '生成失败：' + (task.error_msg || task.errorMsg || '未知错误');
            if (statusProgress) statusProgress.style.display = 'none';
            if (generateBtn) generateBtn.disabled = false;
            if (generateText) generateText.textContent = '重新生成';

            if (statusActions) {
                statusActions.style.display = 'flex';
                statusActions.innerHTML = ''
                    + '<button class="yj-btn yj-btn-outline yj-btn-sm" onclick="studioStartGenerate()"><i class="fas fa-redo"></i> 重试</button>'
                    + '<button class="yj-btn yj-btn-ghost yj-btn-sm" onclick="studioReset()"><i class="fas fa-times"></i> 取消</button>';
            }

            showToast(task.error_msg || task.errorMsg || '生成失败，请重试', 'error');
        }

        // ─── 生成超时 ────────────────────────────────────
        function studioOnTimeout() {
            YJ.state.aiCreation.isGenerating = false;
            var generateBtn = document.getElementById('studioGenerateBtn');
            var generateText = document.getElementById('studioGenerateText');
            var statusText = document.getElementById('studioStatusText');
            var statusIcon = document.getElementById('studioStatusIcon');
            var statusActions = document.getElementById('studioStatusActions');

            if (statusIcon) statusIcon.innerHTML = '<i class="fas fa-clock" style="font-size:36px;color:var(--warning)"></i>';
            if (statusText) statusText.textContent = '任务状态确认超时，可稍后在作品库中查看';
            if (generateBtn) generateBtn.disabled = false;
            if (generateText) generateText.textContent = '重新生成';

            if (statusActions) {
                statusActions.style.display = 'flex';
                statusActions.innerHTML = ''
                    + '<button class="yj-btn yj-btn-outline yj-btn-sm" onclick="studioStartGenerate()"><i class="fas fa-redo"></i> 重试</button>'
                    + '<button class="yj-btn yj-btn-primary yj-btn-sm" onclick="navigateTo(\'myworks\')"><i class="fas fa-film"></i> 查看作品库</button>';
            }

            showToast('任务确认超时，可稍后在作品库中查看', 'warning');
        }

        // ─── 重置结果 ────────────────────────────────────
        // ─── 更新预览区域占位文案 ──────────────────────
        function studioUpdatePreviewPlaceholder(type) {
            var titleEl = document.getElementById('studioPreviewPlaceholderTitle');
            var descEl = document.getElementById('studioPreviewPlaceholderDesc');
            if (!titleEl || !descEl) return;

            var isVideoMode = type === 'ref2video' || type === 'image2video' || type === 'text2video';
            if (isVideoMode) {
                titleEl.textContent = '生成结果预览';
                descEl.textContent = '生成完成的视频将在此处显示，可直接预览和播放';
            } else if (type === 'imageGen') {
                titleEl.textContent = '生成结果预览';
                descEl.textContent = '生成完成的图片将在此处显示，可直接预览';
            }
        }

        function studioResetResult() {
            var resultArea = document.getElementById('studioResult');
            var statusArea = document.getElementById('studioStatus');
            var previewVideo = document.getElementById('studioResultVideo');
            var largePreview = document.getElementById('studioLargePreview');
            var placeholder = document.getElementById('studioPreviewPlaceholder');

            if (resultArea) resultArea.style.display = 'none';
            if (statusArea) statusArea.style.display = 'none';
            if (previewVideo) { previewVideo.style.display = 'none'; previewVideo.src = ''; }
            // Phase UI-AICreation-02-B-1-G-V: 重置右侧大图预览，恢复占位符
            if (largePreview) { largePreview.style.display = 'none'; largePreview.src = ''; }
            if (placeholder) placeholder.style.display = '';
        }

        // ─── 重置整个 Studio 状态 ─────────────────────────
        function studioReset() {
            STUDIO_STATE.isGenerating = false;
            STUDIO_STATE.currentTaskId = null;
            STUDIO_STATE.textPrompt = '';
            STUDIO_STATE.negativePrompt = '';              // Phase UI-AICreation-07-C
            syncStudioToAiCreation();

            // Phase 2-C-2-4-C-3-2: 清理两套素材
            studioClearMaterial();
            studioClearRefImages();

            var generateBtn = document.getElementById('studioGenerateBtn');
            var generateText = document.getElementById('studioGenerateText');

            if (generateBtn) generateBtn.disabled = false;
            if (generateText) generateText.textContent = '开始生成';

            // Phase UI-AICreation-07-C: 清空负向提示词 DOM
            var negPromptEl = document.getElementById('studioNegativePrompt');
            if (negPromptEl) negPromptEl.value = '';

            studioResetResult();
        }

        var VOICE_LABEL_MAP = {
            'zhiyan_emo': '智言情感',
            'zhiyan_cute': '智言可爱',
            'zhiyan_pro': '智言专业'
        };

        /**
         * 格式化语音ID为显示名称
         * 将 technical ID (如 'zhiyan_emo') 转为可读标签
         * 优先使用中文映射，未识别时回退到英文格式化
         */
        function formatVoiceLabel(voiceId) {
            if (VOICE_LABEL_MAP[voiceId]) {
                return VOICE_LABEL_MAP[voiceId];
            }
            return voiceId
                .replace(/_/g, ' ')
                .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        }

        /**
         * 处理自定义形象文件选择
         * Phase 2-C-2-4-B-4-C-5: 完整上传链路 — 校验 → 预览 → OSS上传 → 状态更新
         * @param {HTMLInputElement} input — file input 元素
         */
        async function handleCustomAvatarFile(input) {
            var file = input.files && input.files[0];
            if (!file) return;

            var YJ = window.YJ || {};
            var btn = document.getElementById('dhCustomAvatarBtn');
            var previewIcon = document.getElementById('dhPreviewIcon');
            var previewImg = document.getElementById('dhPreviewImg');
            var previewName = document.getElementById('dhPreviewName');
            var originalBtnHTML = btn ? btn.innerHTML : '';

            // ── 校验 ──
            if (typeof YuJianUpload === 'undefined' || !YuJianUpload.validateImage) {
                if (typeof showToast === 'function') showToast('上传模块未加载，请刷新页面后重试', 'error');
                return;
            }

            var validation = await YuJianUpload.validateImage(file);
            if (!validation.valid) {
                if (typeof showToast === 'function') showToast(validation.error, 'error');
                input.value = '';
                return;
            }

            // ── 本地预览 ──
            var preview = YuJianUpload.createPreview(file);

            if (previewIcon) previewIcon.style.display = 'none';
            if (previewImg) {
                previewImg.src = preview.url;
                previewImg.style.display = 'block';
            }
            if (previewName) {
                previewName.textContent = file.name;
            }

            // ── 上传中状态 ──
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';
            }

            try {
                // ── 完整上传流程: OSS直传 → Asset记录 ──
                var result = await YuJianUpload.uploadImage(file);

                // ── 切换到 OSS 真实 URL（释放本地 blob） ──
                if (previewImg) {
                    previewImg.src = result.url;
                }
                preview.revoke();

                // ── 写入状态 ──
                if (YJ.state && YJ.state.setDigitalHumanState) {
                    YJ.state.setDigitalHumanState({
                        imageUrl: result.url,
                        avatarId: null
                    });
                    console.log('[DigitalHuman] 自定义形象已上传:', result.url);
                }

                if (typeof showToast === 'function') {
                    showToast('自定义形象上传成功', 'success');
                }

                // ── 恢复按钮 ──
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> 已上传';
                    setTimeout(function () {
                        if (btn) btn.innerHTML = originalBtnHTML;
                    }, 2000);
                }

            } catch (err) {
                console.error('[DigitalHuman] 自定义形象上传失败:', err);

                preview.revoke();

                // 恢复预览面板占位
                if (previewIcon) previewIcon.style.display = '';
                if (previewImg) {
                    previewImg.src = '';
                    previewImg.style.display = 'none';
                }
                if (previewName) {
                    previewName.textContent = '职场女性 - 小雅';
                }

                // 恢复按钮
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalBtnHTML;
                }

                var errMsg = (err && err.message) ? err.message : '自定义形象上传失败，请重试';
                if (typeof showToast === 'function') showToast(errMsg, 'error');
            }

            // ── 重置 file input，允许再次选择同一文件 ──
            input.value = '';
        }

         *   3. 使用动态数据渲染页面
         */
        async function renderDigitalHumanAsync(container) {
            // 显示加载状态
            container.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:60px"><i class="fas fa-spinner fa-spin"></i> 加载数字人模型...</div></div>';

            try {
                // Step 1: 确保 Registry 数据已加载
                if (window.YJ && YJ.modules && YJ.modules.modelData) {
                    await YJ.modules.modelData.ensureLoaded();
                }
            } catch (e) {
                console.warn('[DigitalHuman] Model data load failed:', e.message || e);
            }

            // Step 2: 从 Registry 解析数字人模型配置
            if (window.YJ && YJ.state && YJ.state.resolveDigitalHumanFromRegistry) {
                YJ.state.resolveDigitalHumanFromRegistry();
            }

            // Step 3: 使用动态数据渲染页面
